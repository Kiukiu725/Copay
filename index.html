<body class="antialiased min-h-screen font-sans text-[#2C261E]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 初始化 Firebase
    const firebaseConfig = {
      databaseURL: "https://travel-split-app-78a36-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 獨立版 TripTab App 網址
    const TRIPTAB_APP_URL = "https://kiukiu725.github.io/Triptab/";

    // 公數錢包固定代號
    const POOL_PAYER_KEY = "🏦 公數錢包";

    // 將任何 YYYY-MM-DD 日期統一轉為英式 DD/MM/YYYY 格式
    const formatDateUK = (isoDateStr) => {
      if (!isoDateStr || typeof isoDateStr !== "string") return "";
      const parts = isoDateStr.split("-");
      if (parts.length !== 3) return isoDateStr;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    };

    // 多國貨幣清單
    const TRIPTAB_RATES = {
      HKD: 1.0,
      JPY: 0.052,
      TWD: 0.245,
      SGD: 5.82,
      KRW: 0.0058,
      THB: 0.22,
      EUR: 8.45,
      GBP: 9.95,
      USD: 7.78,
      AUD: 5.15,
      CNY: 1.08,
      MOP: 0.97,
      CAD: 5.75,
      CHF: 8.85,
      VND: 0.00031
    };

    const CHART_COLORS = ["#E5B94B", "#10B981", "#3B82F6", "#F97316", "#8B5CF6", "#EC4899", "#14B8A6"];

    const DEFAULT_MEMBERS = ["我", "Alex", "Chloe", "Sam"];
    const DEFAULT_CATEGORIES_DAILY = ["🍱 食飯", "🚕 車費", "📦 團購"];
    const DEFAULT_CATEGORIES_TRAVEL = ["🍱 食飯", "🚕 車費", "📦 團購"];

    // 【新收費邏輯】首發完整免費體驗：免費建立 1 個旅程/日常房間額度
    const FREE_ROOM_QUOTA = 1;
    const VALID_VIP_CODES = ["COPAY2026", "TRIPTAB", "VIP888", "TRAVELPRO"];

    const generateRandomRoomId = () => {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let result = "";
      for (let i = 0; i < 6; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    };

    const sanitizeRoomId = (raw) => {
      return (raw || "").trim().toUpperCase().replace(/[.#$\[\]\/\s]/g, "");
    };

    const getStoredRooms = () => {
      try {
        const saved = JSON.parse(localStorage.getItem("copay_my_rooms_v4"));
        if (Array.isArray(saved) && saved.length > 0) {
          return saved.map(item =>
            typeof item === "string"
              ? { id: item, name: item, mode: "triptab" }
              : { id: item.id, name: item.name, mode: item.mode === "daily" ? "daily" : "triptab" }
          );
        }
      } catch (e) {}
      const firstId = generateRandomRoomId();
      // 新用戶第一次打開 App，預設獲得 1 個免費旅程房間額度
      const initial = [{ id: firstId, name: "首個旅程夾錢 ✈️", mode: "triptab" }];
      localStorage.setItem("copay_my_rooms_v4", JSON.stringify(initial));
      return initial;
    };

    const getInitialRoomId = () => {
      const params = new URLSearchParams(window.location.search);
      const urlRoom = params.get("room");
      if (urlRoom) return sanitizeRoomId(urlRoom);
      const rooms = getStoredRooms();
      return rooms[0].id;
    };

    // 根據模式自動顯示 COPAY Logo 或 TripTab 行李牌 Logo
    function BrandLogo({ isTripTab = false, size = "w-9 h-9 sm:w-10 sm:h-10" }) {
      const [copayErr, setCopayErr] = useState(false);
      const [triptabErr, setTriptabErr] = useState(false);

      if (isTripTab) {
        if (!triptabErr) {
          return (
            <img
              src="TripTab.png"
              alt="TripTab Logo"
              onError={() => setTriptabErr(true)}
              className={`${size} rounded-2xl object-cover shadow-md border border-white/60 shrink-0`}
            />
          );
        }
        return (
          <div className={`${size} rounded-2xl bg-[#6C8C74] flex items-center justify-center shadow-md border border-white/60 relative overflow-hidden shrink-0`}>
            <svg viewBox="0 0 100 100" className="w-full h-full">
              <rect width="100" height="100" rx="22" fill="#6C8C74" />
              <path d="M50 28 C48 18, 65 12, 68 20 C70 25, 56 28, 52 31" stroke="#DFC7A7" strokeWidth="3.5" fill="none" strokeLinecap="round" />
              <path d="M40 28 L64 28 L72 38 L72 78 L67 74 L62 78 L57 74 L52 78 L47 74 L42 78 L37 74 L32 78 L32 38 Z" fill="#597661" transform="translate(2, 2)" />
              <path d="M39 27 L61 27 L69 37 L69 62 C66 62, 66 66, 69 66 L69 77 L64 73 L59 77 L54 73 L50 77 L46 73 L41 77 L36 73 L31 77 L31 66 C34 66, 34 62, 31 62 L31 37 Z" fill="#F7EAD9" />
              <path d="M50 27 L61 27 L69 37 L69 77 L64 73 L59 77 L54 73 L50 77 Z" fill="#EDD8BE" opacity="0.55" />
              <circle cx="50" cy="34" r="4.5" fill="#6C8C74" stroke="#D5B895" strokeWidth="2.5" />
              <line x1="50" y1="43" x2="50" y2="71" stroke="#6C8C74" strokeWidth="2" strokeDasharray="4 3" strokeLinecap="round" />
              <line x1="36" y1="64" x2="60" y2="64" stroke="#6C8C74" strokeWidth="2" strokeDasharray="4 3" strokeLinecap="round" />
              <path d="M38 56 L45 53 L43 59 L41 56.5 L39 58 Z" fill="#C9AF8E" />
              <path d="M59 45 L60.5 48.5 L64 50 L60.5 51.5 L59 55 L57.5 51.5 L54 50 L57.5 48.5 Z" fill="#C9AF8E" />
              <circle cx="63" cy="62.5" r="1.8" stroke="#6C8C74" strokeWidth="1.5" fill="none" />
              <circle cx="63" cy="66.5" r="1.8" stroke="#6C8C74" strokeWidth="1.5" fill="none" />
              <line x1="58" y1="66" x2="62" y2="63" stroke="#6C8C74" strokeWidth="1.5" />
              <line x1="58" y1="63" x2="62" y2="66" stroke="#6C8C74" strokeWidth="1.5" />
            </svg>
          </div>
        );
      }

      if (!copayErr) {
        return (
          <img
            src="Copay.png"
            alt="COPAY Logo"
            onError={() => setCopayErr(true)}
            className={`${size} rounded-2xl object-cover shadow-md border border-white/60 shrink-0`}
          />
        );
      }
      return (
        <div className={`${size} rounded-2xl bg-[#2B353E] flex items-center justify-center shadow-md border border-white/60 relative overflow-hidden shrink-0`}>
          <svg viewBox="0 0 64 64" className="w-4/5 h-4/5">
            <defs>
              <linearGradient id="copayTeal" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#3B7A8C" />
                <stop offset="100%" stopColor="#1F4E5B" />
              </linearGradient>
              <linearGradient id="copayGold" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#FAD074" />
                <stop offset="100%" stopColor="#D99B43" />
              </linearGradient>
            </defs>
            <rect x="28" y="8" width="8" height="48" rx="4" fill="url(#copayTeal)" />
            <path d="M44 21C44 15.5 38.5 12 32 12C25.5 12 20 15.5 20 21C20 26.5 25.5 29 32 31C38.5 33 44 35.5 44 41C44 46.5 38.5 50 32 50C25.5 50 20 46.5 20 41" stroke="url(#copayTeal)" strokeWidth="8" strokeLinecap="round" fill="none" />
            <path d="M33 14C39 14 44 17 45 21" stroke="url(#copayGold)" strokeWidth="7" strokeLinecap="round" fill="none" />
          </svg>
        </div>
      );
    }

    function App() {
      // 帳號與房間清單狀態 (Usage-based 收費架構)
      const [myRooms, setMyRooms] = useState(getStoredRooms);
      const [isPro, setIsPro] = useState(() => localStorage.getItem("copay_v4_pro_unlocked") === "true");
      const [showPaywall, setShowPaywall] = useState(false);
      const [pendingAction, setPendingAction] = useState(null);
      const [vipInput, setVipInput] = useState("");
      const [paywallMsg, setPaywallMsg] = useState("");
      const [paywallTriggerTitle, setPaywallTriggerTitle] = useState("解鎖 Pro 完整版 (HK$ 38 一次性買斷)");

      // 建立全新獨立房間專用彈窗
      const [showNewTravelRoomModal, setShowNewTravelRoomModal] = useState(false);
      const [newTravelRoomTitle, setNewTravelRoomTitle] = useState("");

      // 當前房間 ID 與連線狀態
      const [roomId, setRoomId] = useState(getInitialRoomId);
      const [newRoomNameInput, setNewRoomNameInput] = useState("");
      const [newRoomTypeSelect, setNewRoomTypeSelect] = useState("triptab");
      const [joinRoomCodeInput, setJoinRoomCodeInput] = useState("");
      const [syncStatus, setSyncStatus] = useState("connecting");

      // 群組雲端同步資料
      const [groupName, setGroupName] = useState("首個旅程夾錢 ✈️");
      const [isEditingGroupName, setIsEditingGroupName] = useState(false);
      const [tempGroupName, setTempGroupName] = useState("");

      // 當前房間嘅模式：'triptab' (旅遊房) | 'daily' (日常房)
      const [roomMode, setRoomMode] = useState("triptab");
      // 【關卡 1 核心狀態】房間是否已點擊「一鍵結算」並封存為唯讀模式 (Read-Only)
      const [isRoomSettled, setIsRoomSettled] = useState(false);

      const [members, setMembers] = useState(DEFAULT_MEMBERS);
      const [customCategories, setCustomCategories] = useState(null);
      const [newCategoryInput, setNewCategoryInput] = useState("");
      const [expenses, setExpenses] = useState([]);
      const [customRates, setCustomRates] = useState({});
      const [paidMap, setPaidMap] = useState({});

      const [showAllExpenses, setShowAllExpenses] = useState(false);
      const [isTravelFormCollapsed, setIsTravelFormCollapsed] = useState(false);
      const [collapsedDays, setCollapsedDays] = useState({});
      const [cardFeePercent, setCardFeePercent] = useState(1.95);

      // 成員改名狀態
      const [editingMemberName, setEditingMemberName] = useState(null);
      const [tempMemberNewName, setTempMemberNewName] = useState("");

      // 【TripTab 公數錢包狀態】
      const [poolContributions, setPoolContributions] = useState({});
      const [poolDate, setPoolDate] = useState(new Date().toISOString().split("T")[0]);
      const [poolTopUpAmount, setPoolTopUpAmount] = useState("");
      const [showPoolModal, setShowPoolModal] = useState(false);

      // 編輯單據與刪除確認狀態
      const [editingExpId, setEditingExpId] = useState(null);
      const [editTitle, setEditTitle] = useState("");
      const [editAmount, setEditAmount] = useState("");
      const [deleteConfirmExp, setDeleteConfirmExp] = useState(null);

      // UI 導航狀態
      const [activeTab, setActiveTab] = useState("expenses");
      const [newMemberName, setNewMemberName] = useState("");
      const [liveRates, setLiveRates] = useState(TRIPTAB_RATES);
      const [rateUpdatedText, setRateUpdatedText] = useState("即時匯率");
      const [newCurCode, setNewCurCode] = useState("");
      const [newCurRate, setNewCurRate] = useState("");

      // 新增開支表單輸入
      const [title, setTitle] = useState("");
      const [amount, setAmount] = useState("");
      // 房間基準單一貨幣 (免費版鎖定使用 baseCurrency 單一貨幣記帳；Pro 版可自由切換多幣別自動匯率)
      const [baseCurrency, setBaseCurrency] = useState("HKD");
      const [currency, setCurrency] = useState("HKD");
      const [addCardFee, setAddCardFee] = useState(false);
      const [payer, setPayer] = useState("我");
      const [splitWith, setSplitWith] = useState(DEFAULT_MEMBERS);
      const [category, setCategory] = useState("🍱 食飯");
      const [date, setDate] = useState(new Date().toISOString().split("T")[0]);

      // 【關卡 3 核心狀態】進階拆帳邏輯（例如：B 同 C 唔飲酒少夾 $50）
      const [useAdvancedSplit, setUseAdvancedSplit] = useState(false);
      const [splitAdjustments, setSplitAdjustments] = useState({}); // { "Alex": -50, "Chloe": -50 }

      // 日常版消費報告篩選狀態 (年 / 月 / 日)
      const [reportYear, setReportYear] = useState("ALL");
      const [reportMonth, setReportMonth] = useState("ALL");
      const [reportDay, setReportDay] = useState("ALL");

      const rates = useMemo(() => ({ ...liveRates, ...customRates }), [liveRates, customRates]);
      // 首個免費房間亦可使用旅遊介面（無限記帳、加朋友），但觸碰 3 大進階關卡時彈出 HK$ 38 Paywall
      const isTripTabActive = roomMode === "triptab";
      // 當房間已結算封存（且未升級 Pro 解封）時，進入唯讀模式
      const isReadOnly = isRoomSettled && !isPro;

      const dailyRoomsList = useMemo(() => myRooms.filter(r => r.mode === "daily"), [myRooms]);
      const travelRoomsList = useMemo(() => myRooms.filter(r => r.mode !== "daily"), [myRooms]);

      const activeCategories = useMemo(() => {
        if (Array.isArray(customCategories) && customCategories.length > 0) {
          return customCategories;
        }
        return isTripTabActive ? DEFAULT_CATEGORIES_TRAVEL : DEFAULT_CATEGORIES_DAILY;
      }, [customCategories, isTripTabActive]);

      const sortedCurrencyKeys = useMemo(() => {
        const allKeys = Object.keys(rates);
        return [currency, ...allKeys.filter(k => k !== currency)];
      }, [rates, currency]);

      useEffect(() => {
        if (!activeCategories.includes(category)) {
          setCategory(activeCategories[0] || "🍱 食飯");
        }
      }, [activeCategories, isTripTabActive]);

      useEffect(() => {
        localStorage.setItem("copay_my_rooms_v4", JSON.stringify(myRooms));
      }, [myRooms]);

      useEffect(() => {
        localStorage.setItem("copay_v4_pro_unlocked", isPro ? "true" : "false");
      }, [isPro]);

      useEffect(() => {
        if (!roomId || !groupName) return;
        setMyRooms(prev => {
          const exists = prev.some(r => r.id === roomId);
          if (exists) {
            return prev.map(r => r.id === roomId ? { ...r, name: groupName, mode: roomMode, isSettled: isRoomSettled } : r);
          } else {
            return [...prev, { id: roomId, name: groupName, mode: roomMode, isSettled: isRoomSettled }];
          }
        });
      }, [roomId, groupName, roomMode, isRoomSettled]);

      const fetchLiveExchangeRates = () => {
        setRateUpdatedText("更新中...");
        fetch("https://open.er-api.com/v6/latest/HKD")
          .then(res => res.json())
          .then(data => {
            if (data && data.rates) {
              const updated = {};
              Object.keys(TRIPTAB_RATES).forEach(cur => {
                if (cur === "HKD") {
                  updated[cur] = 1.0;
                } else if (data.rates[cur]) {
                  updated[cur] = Number((1 / data.rates[cur]).toFixed(5));
                } else {
                  updated[cur] = TRIPTAB_RATES[cur];
                }
              });
              setLiveRates(prev => ({ ...prev, ...updated }));
              setRateUpdatedText(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
            }
          })
          .catch(() => {
            setRateUpdatedText("預設匯率");
          });
      };

      useEffect(() => {
        fetchLiveExchangeRates();
      }, []);

      // 統一彈出 HK$ 38 Paywall 函數
      const triggerPaywall = (titleText, msgText, onUnlockCallback = null) => {
        setPaywallTriggerTitle(titleText);
        setPaywallMsg(msgText);
        if (onUnlockCallback) {
          setPendingAction(() => onUnlockCallback);
        } else {
          setPendingAction(null);
        }
        setShowPaywall(true);
      };

      // 監聽當前 Firebase 房間數據
      useEffect(() => {
        setSyncStatus("connecting");
        setIsEditingGroupName(false);
        setEditingExpId(null);
        setEditingMemberName(null);
        setShowAllExpenses(false);
        setIsTravelFormCollapsed(false);
        setCollapsedDays({});
        setUseAdvancedSplit(false);
        setSplitAdjustments({});
        setReportYear("ALL");
        setReportMonth("ALL");
        setReportDay("ALL");

        const url = new URL(window.location);
        url.searchParams.set("room", roomId);
        window.history.replaceState({}, "", url);

        const roomRef = db.ref(`billmate_rooms/${roomId}`);

        const handleValue = (snapshot) => {
          const data = snapshot.val();
          if (data) {
            const loadedMode = data.roomMode === "daily" ? "daily" : "triptab";
            setRoomMode(loadedMode);
            setGroupName(data.groupName || (loadedMode === "triptab" ? "首個旅程夾錢 ✈️" : "日常飯局夾錢 🍱"));
            setIsRoomSettled(!!data.isSettled);

            const roomBaseCur = data.defaultCurrency || "HKD";
            setBaseCurrency(roomBaseCur);
            // 如果係免費版，鎖定使用單一基準貨幣；Pro 版可記住上次選擇嘅外幣
            setCurrency(roomBaseCur);

            if (data.cardFeePercent !== undefined && !isNaN(Number(data.cardFeePercent))) {
              setCardFeePercent(Number(data.cardFeePercent));
            } else {
              setCardFeePercent(1.95);
            }

            const loadedMembers = Array.isArray(data.members) && data.members.length > 0 ? data.members : DEFAULT_MEMBERS;
            setMembers(loadedMembers);
            setPayer(prev => (prev === POOL_PAYER_KEY || loadedMembers.includes(prev)) ? prev : loadedMembers[0]);
            setSplitWith(prev => {
              const valid = prev.filter(m => loadedMembers.includes(m));
              return valid.length > 0 ? valid : loadedMembers;
            });

            if (Array.isArray(data.customCategories) && data.customCategories.length > 0) {
              setCustomCategories(data.customCategories);
            } else {
              setCustomCategories(null);
            }

            if (data.expenses) {
              const expList = Object.values(data.expenses).sort((a, b) => {
                const dateA = new Date(a.date).getTime();
                const dateB = new Date(b.date).getTime();
                if (dateA !== dateB) return dateB - dateA;
                return (b.id || 0) - (a.id || 0);
              });
              setExpenses(expList);
            } else {
              setExpenses([]);
            }

            setCustomRates(data.customRates || {});
            setPaidMap(data.paidMap || {});
            setPoolContributions(data.poolContributions || {});
            if (data.poolDate) setPoolDate(data.poolDate);
          } else {
            const localRoom = myRooms.find(r => r.id === roomId);
            const targetMode = localRoom && localRoom.mode === "daily" ? "daily" : "triptab";
            const defaultTitle = localRoom ? localRoom.name : (targetMode === "triptab" ? "首個旅程夾錢 ✈️" : "日常飯局夾錢 🍱");
            const initialRoomData = {
              roomId: roomId,
              groupName: defaultTitle,
              roomMode: targetMode,
              defaultCurrency: "HKD",
              isSettled: false,
              cardFeePercent: 1.95,
              members: DEFAULT_MEMBERS,
              expenses: {},
              customRates: {},
              paidMap: {},
              poolContributions: {},
              poolDate: new Date().toISOString().split("T")[0],
              createdAt: Date.now()
            };
            roomRef.set(initialRoomData);
          }
          setSyncStatus("synced");
        };

        const handleError = () => setSyncStatus("error");

        roomRef.on("value", handleValue, handleError);
        return () => roomRef.off("value", handleValue);
      }, [roomId, isPro]);

      // 金額折合港幣 (免費版若全單用單一貨幣，則以該單一貨幣或折合 HKD 計算；Pro 版啟用多幣別實時匯率轉換)
      const toHKD = (amt, curr) => {
        if (!curr || curr === "HKD") return amt;
        const r = rates[curr] || 1;
        return amt * r;
      };

      // ==========================================
      // 🏦 公數錢包總額、已用金額及可用餘額
      // ==========================================
      const poolStats = useMemo(() => {
        const totalContributedHKD = members.reduce((sum, m) => {
          return sum + (Number(poolContributions[m]) || 0);
        }, 0);

        const totalSpentFromPoolHKD = expenses.reduce((sum, exp) => {
          if (exp.payer === POOL_PAYER_KEY || exp.isPoolExpense) {
            return sum + toHKD(Number(exp.amount), exp.currency);
          }
          return sum;
        }, 0);

        const remainingPoolHKD = Math.max(0, Number((totalContributedHKD - totalSpentFromPoolHKD).toFixed(2)));
        const rawRemainingHKD = Number((totalContributedHKD - totalSpentFromPoolHKD).toFixed(2));

        return {
          totalContributedHKD,
          totalSpentFromPoolHKD,
          remainingPoolHKD,
          rawRemainingHKD
        };
      }, [members, poolContributions, expenses, rates]);

      const feeMultiplier = useMemo(() => {
        const pct = Math.max(0, Number(cardFeePercent) || 0);
        return 1 + pct / 100;
      }, [cardFeePercent]);

      const currentInputHKD = useMemo(() => {
        const raw = parseFloat(amount);
        if (isNaN(raw) || raw <= 0) return 0;
        const withFee = isTripTabActive && addCardFee ? raw * feeMultiplier : raw;
        const curr = isTripTabActive ? currency : "HKD";
        return toHKD(withFee, curr);
      }, [amount, currency, addCardFee, isTripTabActive, rates, feeMultiplier]);

      const isExceedingPoolBalance = useMemo(() => {
        if (payer !== POOL_PAYER_KEY) return false;
        return currentInputHKD > (poolStats.rawRemainingHKD + 0.05);
      }, [payer, currentInputHKD, poolStats.rawRemainingHKD]);

      const handleBatchTopUpPool = (e) => {
        e.preventDefault();
        if (isReadOnly) {
          triggerPaywall(
            "🔒 此房間已結算封存 (唯讀模式)",
            "此免費房間已完成最終結算並封存為唯讀模式。升級 HK$ 38 Pro 版即可解封房間繼續記帳，並獲得無限建立新旅程房間權限！"
          );
          return;
        }
        const addAmt = parseFloat(poolTopUpAmount);
        if (isNaN(addAmt) || addAmt <= 0) return;
        const updated = { ...poolContributions };
        members.forEach(m => {
          updated[m] = Number(((Number(updated[m]) || 0) + addAmt).toFixed(2));
        });
        db.ref(`billmate_rooms/${roomId}`).update({
          poolContributions: updated,
          poolDate: poolDate
        });
        setPoolTopUpAmount("");
      };

      const handlePoolDateChange = (newDate) => {
        setPoolDate(newDate);
        db.ref(`billmate_rooms/${roomId}/poolDate`).set(newDate);
      };

      const handleMemberPoolChange = (memberName, newValStr) => {
        if (isReadOnly) return;
        const newVal = Math.max(0, parseFloat(newValStr) || 0);
        const tempContributions = { ...poolContributions, [memberName]: newVal };
        const newTotalPool = members.reduce((sum, m) => sum + (Number(tempContributions[m]) || 0), 0);

        if (newTotalPool + 0.05 < poolStats.totalSpentFromPoolHKD) {
          alert(
            `⚠️ 無法調低公數金額！\n\n` +
            `目前公數錢包已經消費咗 HK$ ${Math.round(poolStats.totalSpentFromPoolHKD).toLocaleString()}，` +
            `公數總注資額唔可以少過已消費金額！`
          );
          return;
        }
        db.ref(`billmate_rooms/${roomId}/poolContributions/${memberName}`).set(newVal);
      };

      // ==========================================
      // 🏷️ 自訂活動類別新增與刪除
      // ==========================================
      const handleAddCategory = (e) => {
        e.preventDefault();
        const trimmed = newCategoryInput.trim();
        if (!trimmed) return;
        if (activeCategories.includes(trimmed)) {
          setNewCategoryInput("");
          return;
        }
        const updated = [...activeCategories, trimmed];
        setCustomCategories(updated);
        setCategory(trimmed);
        db.ref(`billmate_rooms/${roomId}/customCategories`).set(updated);
        setNewCategoryInput("");
      };

      const handleDeleteCategory = (catToDel) => {
        if (activeCategories.length <= 1) {
          alert("至少要保留 1 個活動類別！");

        const updated = activeCategories.filter(c => c !== catToDel);
        setCustomCategories(updated);
        if (category === catToDel) {
          setCategory(updated[0]);

        db.ref(`billmate_rooms/${roomId}/customCategories`).set(updated);
      };

      // ==========================================
      // 👥 成員管理（免費首個房間亦可無限加入同行朋友）
      // ==========================================
      const handleAddMember = () => {
        const name = newMemberName.trim();
        if (!name || members.includes(name) || name === POOL_PAYER_KEY) return;
        const updated = [...members, name];
        db.ref(`billmate_rooms/${roomId}/members`).set(updated);
        setSplitWith(updated);
        setNewMemberName("");
      };

      const handleRenameMember = (oldName) => {
        const newName = tempMemberNewName.trim();
        if (!newName || newName === oldName || newName === POOL_PAYER_KEY) {
          setEditingMemberName(null);
          return;
        }
        if (members.includes(newName)) {
          alert("呢個成員名已經存在！");
          return;
        }

        const updatedMembers = members.map(m => m === oldName ? newName : m);
        const updates = {};
        updates[`members`] = updatedMembers;

        expenses.forEach(exp => {
          const newPayer = exp.payer === oldName ? newName : exp.payer;
          const newSplit = (exp.splitWith || []).map(p => p === oldName ? newName : p);
          if (newPayer !== exp.payer || JSON.stringify(newSplit) !== JSON.stringify(exp.splitWith)) {
            updates[`expenses/${exp.id}/payer`] = newPayer;
            updates[`expenses/${exp.id}/splitWith`] = newSplit;
          }
          if (exp.splitAdjustments && exp.splitAdjustments[oldName] !== undefined) {
            const newAdj = { ...exp.splitAdjustments };
            newAdj[newName] = newAdj[oldName];
            delete newAdj[oldName];
            updates[`expenses/${exp.id}/splitAdjustments`] = newAdj;
          }
        });

        if (poolContributions && poolContributions[oldName] !== undefined) {
          const newPool = { ...poolContributions };
          newPool[newName] = newPool[oldName];
          delete newPool[oldName];
          updates[`poolContributions`] = newPool;
        }

        db.ref(`billmate_rooms/${roomId}`).update(updates);
        if (payer === oldName) setPayer(newName);
        setSplitWith(prev => prev.map(m => m === oldName ? newName : m));
        setEditingMemberName(null);
        setTempMemberNewName("");
      };

      const handleRemoveMember = (nameToRemove) => {
        if (members.length <= 2) {
          alert("每個房間至少需要保留 2 位活躍成員！");
          return;

        if (!window.confirm(`確定要刪除成員「${nameToRemove}」？\n\n• 佢參與過嘅開支將會保留原總額，並自動由餘下成員重新平分。\n• 如果佢曾擔任「墊支人」，系統會直接以負數顯示佢嘅墊支額，並保留喺消費報告內。`)) {
          return;
        }

        const updatedMembers = members.filter(x => x !== nameToRemove);
        const updates = {};
        updates[`members`] = updatedMembers;

        expenses.forEach(exp => {
          if (Array.isArray(exp.splitWith) && exp.splitWith.includes(nameToRemove)) {
            let remainingSplits = exp.splitWith.filter(m => m !== nameToRemove && updatedMembers.includes(m));
            if (remainingSplits.length === 0) {
              remainingSplits = [...updatedMembers];
            }
            updates[`expenses/${exp.id}/splitWith`] = remainingSplits;
          }
        });

        db.ref(`billmate_rooms/${roomId}`).update(updates);
        if (payer === nameToRemove) setPayer(updatedMembers[0]);
        setSplitWith(prev => {
          const filtered = prev.filter(m => m !== nameToRemove);
          return filtered.length > 0 ? filtered : updatedMembers;
        });
      };

      // ==========================================
      // 🔑 【關卡 1】一鍵最終結算封存為「唯讀模式」＋ 企圖建立第 2 個旅程時觸發 HK$ 38 收費牆
      // ==========================================
      const handleFinalizeAndArchiveRoom = () => {
        if (expenses.length === 0) {
          alert("目前未有任何消費單據，無需封存結算！");
          return;
        }
        if (isRoomSettled) {
          if (isPro) {
            // Pro 用戶可以隨時解封房間
            db.ref(`billmate_rooms/${roomId}/isSettled`).set(false);
            setIsRoomSettled(false);
            alert("🔓 已為你解封此房間，現在可以繼續新增或修改消費單據！");
          } else {
            triggerPaywall(
              "🔓 解封房間 / 開啟無限旅程",
              "此免費房間已完成最終結算並封存為「唯讀模式」。一鍵買斷 HK$ 38 Pro 版即可隨時解封房間，並無限建立下一次旅行房間！"
            );
          }
          return;
        }

        const confirmMsg = isPro
          ? "確定要完成此房間嘅最終結算並標記為「已結算」？（Pro 版用戶隨時可以解封修改）"
          : "【完成首個旅程 · 一鍵最終結算】\n\n確認結算並得出最終過數清單後，此免費房間將會自動封存為「唯讀模式」（只能查閱紀錄及剔選過數狀態，不能再新增消費）。\n\n確定要完成結算嗎？";

        if (window.confirm(confirmMsg)) {
          db.ref(`billmate_rooms/${roomId}/isSettled`).set(true);
          setIsRoomSettled(true);
          setActiveTab("settle");
        }
      };

      const createSeparateRoomWithMode = (customName, targetMode) => {
        const newId = generateRandomRoomId();
        const initialRoomData = {
          roomId: newId,
          groupName: customName,
          roomMode: targetMode,
          defaultCurrency: "HKD",
          isSettled: false,
          cardFeePercent: 1.95,
          members: DEFAULT_MEMBERS,
          expenses: {},
          customRates: {},
          paidMap: {},
          poolContributions: {},
          poolDate: new Date().toISOString().split("T")[0],
          createdAt: Date.now()
        };
        db.ref(`billmate_rooms/${newId}`).set(initialRoomData);
        setMyRooms(prev => [...prev, { id: newId, name: customName, mode: targetMode, isSettled: false }]);
        setRoomId(newId);
        setGroupName(customName);
        setRoomMode(targetMode);
        setBaseCurrency("HKD");
        setCurrency("HKD");
        setIsRoomSettled(false);
        setActiveTab("expenses");
      };

      // 【關卡 1】當用戶企圖建立第 2 個房間時，立刻觸發 HK$ 38 收費牆
      const handleCreateNewRoom = (e) => {
        e.preventDefault();
        const customName = newRoomNameInput.trim();
        if (!customName) return;

        if (!isPro && myRooms.length >= FREE_ROOM_QUOTA) {
          triggerPaywall(
            "✈️ 開啟第 2 個旅程房間 (HK$ 38 買斷)",
            `你已完成首個免費房間體驗（免費額度：${myRooms.length}/${FREE_ROOM_QUOTA} 間房）！準備飛外站或開始第二次旅行？一鍵買斷 HK$ 38 Pro 版，即可無限建立新旅程與日常房間！`,
            () => {
              createSeparateRoomWithMode(customName, newRoomTypeSelect);
              setNewRoomNameInput("");
            }
          );
          return;
        }

        createSeparateRoomWithMode(customName, newRoomTypeSelect);
        setNewRoomNameInput("");
      };

      const handleConfirmCreateTravelRoom = (e) => {
        e.preventDefault();
        const name = newTravelRoomTitle.trim() || "第二次旅行 ✈️";
        createSeparateRoomWithMode(name, "triptab");
        setNewTravelRoomTitle("");
        setShowNewTravelRoomModal(false);
      };

      // 頂部切換房間或開新房按鈕（若超過 1 個免費房間額度即觸發關卡 1）
      const handleSwitchToTripTab = (targetMode) => {
        if (targetMode === roomMode) return;

        if (targetMode === "triptab") {
          if (travelRoomsList.length > 0) {

            triggerPaywall(
              "✈️ 建立新旅程房間 (HK$ 38 買斷)",
              "你已使用咗首個免費房間額度！想開立全新獨立嘅「✈️ TripTab 旅遊房間」？只需 HK$ 38 一次性買斷，即可永久解鎖無限房間與多幣別自動匯率！",
              () => {

                setShowNewTravelRoomModal(true);
              }
            );
          } else {
            setNewTravelRoomTitle("日本之旅 ✈️");
            setShowNewTravelRoomModal(true);
          }
        } else {

            setActiveTab("expenses");
          } else if (!isPro && myRooms.length >= FREE_ROOM_QUOTA) {

              "☕ 建立第 2 個獨立房間 (HK$ 38 買斷)",
              "免費版提供 1 個完整房間額度。想額外開立獨立嘅「☕ 日常夾錢房間」將日常與旅遊帳目分開？只需 HK$ 38 一次性買斷即可無限開房！",

      const handleJoinRoomByCode = (e) => {

          setJoinRoomCodeInput("");

      // ==========================================
      // 💱 【關卡 2】企圖啟用「多幣別自動匯率」時，立刻觸發 HK$ 38 收費牆
      // ==========================================
      const handleExpCurrencyChange = (targetCur) => {

      // 在設定頁更改房間基準單一貨幣
      const handleSelectDefaultCurrency = (cur) => {
        if (!isPro && expenses.length > 0 && cur !== baseCurrency) {
          triggerPaywall(

      // ⚖️ 【關卡 3A】企圖啟用「進階拆帳邏輯（如 B 和 C 唔飲酒少夾 50 蚊）」時，立刻觸發收費牆
      // ==========================================
      const handleToggleAdvancedSplit = () => {
        if (!useAdvancedSplit && !isPro) {
          triggerPaywall(
            "⚖️ 啟用「進階拆帳邏輯」 (HK$ 38 買斷)",
            "想處理「呢餐飯 A 墊支，但 B 同 C 唔飲酒所以少夾 $50」或者「某人特別買多咗手信要多夾 $100」？立即以 HK$ 38 一次性買斷解鎖「進階拆帳邏輯」及所有 Pro 功能！",
            () => {
              setUseAdvancedSplit(true);

          );

        setUseAdvancedSplit(prev => !prev);
      };

      const handleAdjustmentChange = (memberName, valStr) => {
        setSplitAdjustments(prev => ({
          ...prev,
          [memberName]: valStr
        }));
      };

      // ==========================================
      // 📥 【關卡 3B】企圖點擊「匯出 CSV 試算表」時，立刻觸發收費牆
      // ==========================================
      const handleExportExcelCSV = () => {
        if (!isPro) {
          triggerPaywall(
            "📥 匯出 CSV 試算表留底備份 (HK$ 38 買斷)",
            "想一鍵匯出完整 Excel (.csv) 試算表（包含每日消費明細、匯率折算及各人墊支對帳表）自行留底備份？立即以 HK$ 38 一次性買斷解鎖 Pro 版！"
          );
          return;
        }
        let csv = "\uFEFF";
        csv += `${isTripTabActive ? "TripTab 旅遊報告" : "COPAY 日常消費報告"} - ${groupName} (房號 #${roomId})\n`;
        if (!isTripTabActive) {
          csv += `篩選範圍：,日子:${reportDay === 'ALL' ? '全部' : reportDay},月份:${reportMonth === 'ALL' ? '全部' : reportMonth},年份:${reportYear === 'ALL' ? '全部' : reportYear}\n\n`;
        } else {
          csv += `模式：,獨立旅遊專案房間 (全旅程總結)\n\n`;
        }
        csv += "單據日期(DD/MM/YYYY),類別,項目名稱,原幣金額,貨幣,折合港幣(HKD),墊支人(狀態),參與分攤成員,進階拆帳備註\n";

        tripTabChartAndReport.list.forEach(e => {
          const hkd = Math.round(toHKD(Number(e.amount), e.currency));
          const payerStatus = (e.payer !== POOL_PAYER_KEY && !members.includes(e.payer)) ? `${e.payer} (已刪除)` : e.payer;
          const splitsText = (e.splitWith || []).filter(p => members.includes(p)).join(" / ");
          const adjNotes = e.splitAdjustments
            ? Object.entries(e.splitAdjustments)
                .filter(([, v]) => Number(v) !== 0)
                .map(([k, v]) => `${k}:${Number(v) > 0 ? '+' : ''}${v}`)
                .join("; ")
            : "平分";
          const safeTitle = `"${String(e.title || "").replace(/"/g, '""')}"`;
          csv += `${formatDateUK(e.date)},${e.category},${safeTitle},${e.amount},${e.currency || "HKD"},${hkd},"${payerStatus}","${splitsText}","${adjNotes}"\n`;
        });

        csv += "\n成員消費匯總 (包括已刪除但有事件紀錄之成員)\n";
        csv += "成員姓名,狀態,累計墊支(HKD),實際享用消費(HKD),淨結餘/負數顯示(HKD)\n";
        tripTabChartAndReport.personArray.forEach(p => {
          csv += `"${p.name}",${p.isDeleted ? "已刪除成員" : "現有成員"},${Math.round(p.paidHKD)},${Math.round(p.shareHKD)},${Math.round(p.netHKD)}\n`;
        });

        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.setAttribute("download", `${isTripTabActive ? "TripTab" : "COPAY"}_${groupName}_${roomId}_報告.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const openExternalTripTabApp = () => {
        const targetUrl = `${TRIPTAB_APP_URL}?room=${encodeURIComponent(roomId)}`;
        window.open(targetUrl, "_blank");
      };

      const unlockProPermanent = () => {
        setIsPro(true);
        setShowPaywall(false);
        setVipInput("");
        if (pendingAction) {
          pendingAction();
          setPendingAction(null);
        }
        alert("🎉 感謝支持！已為你永久解鎖【COPAY × TripTab Pro 完整版 (HK$ 38 買斷)】，所有無限房間、多幣別自動匯率、進階拆帳及 CSV 匯出已全面開通！");
      };

      const handleUnlockWithCode = (e) => {
        e.preventDefault();
        const code = vipInput.trim().toUpperCase();
        if (VALID_VIP_CODES.includes(code)) {
          unlockProPermanent();
        } else {
          alert("❌ 解鎖碼無效！測試可用解鎖碼：COPAY2026 或 TRIPTAB");
        }
      };

      const handleSimulatePurchase = () => {
        unlockProPermanent();
      };

      const saveGroupName = (e) => {
        if (e) e.preventDefault();
        const trimmed = tempGroupName.trim();
        if (trimmed) {
          setGroupName(trimmed);
          db.ref(`billmate_rooms/${roomId}/groupName`).set(trimmed);
        }
        setIsEditingGroupName(false);
      };

      // 新增開支（支援防唯讀攔截 ＋ 進階拆帳邏輯）
      const handleAddExpense = (e) => {
        e.preventDefault();
        if (isReadOnly) {
          triggerPaywall(
            "🔒 此免費房間已結算封存 (唯讀模式)",
            "你已完成第一次旅行結算並將房間封存為唯讀模式！如需解封繼續記帳或開啟第 2 個旅程房間，請以 HK$ 38 一次性買斷 Pro 版！"
          );
          return;
        }
        if (!title || !amount || splitWith.length === 0 || !date) return;

        const rawAmt = parseFloat(amount);
        if (isNaN(rawAmt) || rawAmt <= 0) return;

        const finalAmt = isTripTabActive && addCardFee ? Number((rawAmt * feeMultiplier).toFixed(2)) : rawAmt;
        const finalCurrency = isTripTabActive ? (isPro ? currency : baseCurrency) : "HKD";
        const expenseHKD = toHKD(finalAmt, finalCurrency);

        if (payer === POOL_PAYER_KEY) {
          if (poolStats.totalContributedHKD <= 0) {
            alert(`⚠️ 公數錢包目前餘額為 HK$ 0！請先注資公數或改揀個人墊支。`);
            setShowPoolModal(true);
            return;
          }
          if (expenseHKD > poolStats.rawRemainingHKD + 0.05) {
            const diffHKD = (expenseHKD - poolStats.remainingPoolHKD).toFixed(1);
            alert(
              `🚫 拒絕記帳：公數錢包餘額不足！\n\n` +
              `• 今筆單據折合：HK$ ${expenseHKD.toFixed(1)}\n` +
              `• 公數目前只剩：HK$ ${poolStats.remainingPoolHKD.toFixed(1)}\n` +
              `• 尚欠差額：HK$ ${diffHKD}`
            );
            return;
          }
        }

        // 整理進階拆帳加減金額 (以原幣計算，結算時自動按匯率轉 HKD)
        let cleanedAdjustments = null;
        if (isPro && useAdvancedSplit) {
          cleanedAdjustments = {};
          splitWith.forEach(m => {
            const adjVal = parseFloat(splitAdjustments[m]);
            if (!isNaN(adjVal) && adjVal !== 0) {
              cleanedAdjustments[m] = adjVal;
            }
          });
          if (Object.keys(cleanedAdjustments).length === 0) {
            cleanedAdjustments = null;
          }
        }

        const id = Date.now();
        const feeLabel = isTripTabActive && addCardFee ? ` (連${cardFeePercent}%卡費)` : "";
        const newExp = {
          id,
          title: `${title.trim()}${feeLabel}`,
          amount: finalAmt,
          currency: finalCurrency,
          payer,
          isPoolExpense: payer === POOL_PAYER_KEY,
          splitWith,
          splitAdjustments: cleanedAdjustments,
          category,
          date
        };
        db.ref(`billmate_rooms/${roomId}/expenses/${id}`).set(newExp);
        setTitle("");
        setAmount("");
        setAddCardFee(false);
        setSplitAdjustments({});
      };

      const saveEditExpense = (exp) => {
        if (isReadOnly) return;
        const trimmedTitle = editTitle.trim();
        const parsedAmt = parseFloat(editAmount);
        if (!trimmedTitle || isNaN(parsedAmt) || parsedAmt <= 0) return;

        if (exp.payer === POOL_PAYER_KEY || exp.isPoolExpense) {
          const oldHKD = toHKD(Number(exp.amount), exp.currency);
          const newHKD = toHKD(parsedAmt, exp.currency);
          const availableForThisEditHKD = poolStats.rawRemainingHKD + oldHKD;

          if (newHKD > availableForThisEditHKD + 0.05) {
            alert(
              `🚫 無法儲存修改：修改後金額超出公數錢包上限！\n` +
              `公數最多可負擔：HK$ ${Math.max(0, availableForThisEditHKD).toFixed(1)}`
            );
            return;
          }
        }

        db.ref(`billmate_rooms/${roomId}/expenses/${exp.id}`).update({
          title: trimmedTitle,
          amount: parsedAmt
        });
        setEditingExpId(null);
      };

      const confirmDeleteExpense = () => {
        if (!deleteConfirmExp || isReadOnly) return;
        db.ref(`billmate_rooms/${roomId}/expenses/${deleteConfirmExp.id}`).remove();
        setDeleteConfirmExp(null);
      };

      const handleRateChange = (cur, val) => {
        const num = parseFloat(val);
        if (isNaN(num) || num <= 0) return;
        db.ref(`billmate_rooms/${roomId}/customRates/${cur}`).set(num);
      };

      const handleAddCustomCurrency = (e) => {
        e.preventDefault();
        const code = newCurCode.trim().toUpperCase();
        const rateVal = parseFloat(newCurRate);
        if (code.length !== 3 || isNaN(rateVal) || rateVal <= 0) return;
        db.ref(`billmate_rooms/${roomId}/customRates/${code}`).set(rateVal);
        handleSelectDefaultCurrency(code);
        setNewCurCode("");
        setNewCurRate("");
      };

      const handleCardFeePercentChange = (valStr) => {
        const val = parseFloat(valStr);
        if (isNaN(val) || val < 0) {
          setCardFeePercent(0);
          return;
        }
        setCardFeePercent(val);
        db.ref(`billmate_rooms/${roomId}/cardFeePercent`).set(val);
      };

      const toggleSettlementPaid = (txKey) => {
        const current = !!paidMap[txKey];
        db.ref(`billmate_rooms/${roomId}/paidMap/${txKey}`).set(!current);
      };

      const resetAllPaidStatus = () => {
        db.ref(`billmate_rooms/${roomId}/paidMap`).remove();
      };

      const totalHKD = useMemo(() => {
        return expenses.reduce((acc, exp) => acc + toHKD(Number(exp.amount), exp.currency), 0);
      }, [expenses, rates]);

      // 計算單筆開支每位成員嘅實際分攤金額 (HKD)，支援「進階拆帳邏輯（如某人唔飲酒少夾 $50）」
      const calculateMemberSharesHKD = (exp, validSplitMembers) => {
        const totalExpHKD = toHKD(Number(exp.amount), exp.currency);
        const count = validSplitMembers.length;
        if (count === 0) return {};

        const adjustments = exp.splitAdjustments || {};
        let totalAdjHKD = 0;
        const memberAdjHKD = {};

        validSplitMembers.forEach(m => {
          const rawAdj = Number(adjustments[m]) || 0;
          const adjHKD = toHKD(rawAdj, exp.currency);
          memberAdjHKD[m] = adjHKD;
          totalAdjHKD += adjHKD;
        });

        // 扣除/加上特別調整金額後，餘下金額由參與者平均分攤
        const baseShareHKD = (totalExpHKD - totalAdjHKD) / count;
        const result = {};
        validSplitMembers.forEach(m => {
          result[m] = Math.max(0, baseShareHKD + (memberAdjHKD[m] || 0));
        });
        return result;
      };

      // ==========================================
      // 📅 旅遊版第一頁專屬：按日期 (Day 1, Day 2...) 分組
      // ==========================================
      const travelDailyGroups = useMemo(() => {
        if (!expenses || expenses.length === 0) return [];
        const uniqueDatesAsc = Array.from(new Set(expenses.map(e => e.date || "未知日期"))).sort();
        const dayIndexMap = {};
        uniqueDatesAsc.forEach((d, idx) => {
          dayIndexMap[d] = idx + 1;
        });

        const uniqueDatesDesc = [...uniqueDatesAsc].reverse();
        return uniqueDatesDesc.map(d => {
          const items = expenses.filter(e => (e.date || "未知日期") === d);
          const dayTotalHKD = items.reduce((sum, e) => sum + toHKD(Number(e.amount), e.currency), 0);
          return {
            date: d,
            ukDate: formatDateUK(d),
            dayNum: dayIndexMap[d] || 1,
            items,
            dayTotalHKD
          };
        });
      }, [expenses, rates]);

      const toggleDayCollapse = (dateKey) => {
        setCollapsedDays(prev => ({
          ...prev,
          [dateKey]: !prev[dateKey]
        }));
      };

      // ==========================================
      // ⚡ 結算與重算邏輯（支援進階不等額拆帳）
      // ==========================================
      const settlement = useMemo(() => {
        const balances = {};
        const deletedPayersNegative = {};

        members.forEach(m => {
          const poolPaid = isTripTabActive ? (Number(poolContributions[m]) || 0) : 0;
          balances[m] = poolPaid;
        });

        expenses.forEach(exp => {
          const hkdAmount = toHKD(Number(exp.amount), exp.currency);
          let activeSplits = (exp.splitWith || []).filter(p => members.includes(p));
          if (activeSplits.length === 0) {
            activeSplits = [...members];
          }

          if (exp.payer !== POOL_PAYER_KEY && !exp.isPoolExpense) {
            if (members.includes(exp.payer)) {
              balances[exp.payer] += hkdAmount;
            } else {
              deletedPayersNegative[exp.payer] = (deletedPayersNegative[exp.payer] || 0) - hkdAmount;
            }
          } else if (!isTripTabActive) {
            return;
          }

          const sharesMap = calculateMemberSharesHKD(exp, activeSplits);
          activeSplits.forEach(p => {
            balances[p] -= (sharesMap[p] || 0);
          });
        });

        if (isTripTabActive && poolStats.remainingPoolHKD > 0 && poolStats.totalContributedHKD > 0) {
          members.forEach(m => {
            const myContrib = Number(poolContributions[m]) || 0;
            const myRefundShare = (myContrib / poolStats.totalContributedHKD) * poolStats.remainingPoolHKD;
            balances[m] -= myRefundShare;
          });
        }

        const debtors = [];
        const creditors = [];
        Object.keys(balances).forEach(m => {
          const val = Math.round(balances[m]);
          if (val < -1) debtors.push({ name: m, amount: -val });
          else if (val > 1) creditors.push({ name: m, amount: val });
        });

        debtors.sort((a, b) => b.amount - a.amount);
        creditors.sort((a, b) => b.amount - a.amount);

        const transactions = [];
        let i = 0, j = 0;
        while (i < debtors.length && j < creditors.length) {
          const deb = debtors[i];
          const cred = creditors[j];
          const settleAmt = Math.min(deb.amount, cred.amount);
          const fromName = deb.name;
          const toName = cred.name;
          const txKey = `${fromName}_TO_${toName}`.replace(/[.#$\[\]\/]/g, "_");
          transactions.push({
            key: txKey,
            from: fromName,
            to: toName,
            amount: Math.round(settleAmt)
          });
          deb.amount -= settleAmt;
          cred.amount -= settleAmt;
          if (deb.amount === 0) i++;
          if (cred.amount === 0) j++;
        }
        return { balances, deletedPayersNegative, transactions };
      }, [expenses, members, rates, poolContributions, isTripTabActive, poolStats]);

      // ==========================================
      // 📊 報告與圖表數據計算
      // ==========================================
      const reportAvailableDates = useMemo(() => {
        const years = new Set();
        const months = new Set();
        const days = new Set();
        expenses.forEach(e => {
          if (!e.date) return;
          const parts = e.date.split("-");
          if (parts[0]) years.add(parts[0]);
          if (parts[1]) months.add(parts[1]);
          if (parts[2]) days.add(parts[2]);
        });
        return {
          years: Array.from(years).sort().reverse(),
          months: Array.from(months).sort(),
          days: Array.from(days).sort()
        };
      }, [expenses]);

      const tripTabChartAndReport = useMemo(() => {
        const list = expenses.filter(e => {
          if (isTripTabActive) return true;
          if (!e.date) return true;
          const [y, m, d] = e.date.split("-");
          if (reportYear !== "ALL" && y !== reportYear) return false;
          if (reportMonth !== "ALL" && m !== reportMonth) return false;
          if (reportDay !== "ALL" && d !== reportDay) return false;
          return true;
        });

        const totalFilteredHKD = list.reduce((s, e) => s + toHKD(Number(e.amount), e.currency), 0);

        const catMap = {};
        list.forEach(e => {
          const hkd = toHKD(Number(e.amount), e.currency);
          const cat = e.category || "🍱 食飯";
          catMap[cat] = (catMap[cat] || 0) + hkd;
        });
        const categoryBreakdown = Object.entries(catMap)
          .map(([cat, val]) => ({
            category: cat,
            amountHKD: val,
            percent: totalFilteredHKD > 0 ? Math.round((val / totalFilteredHKD) * 100) : 0
          }))
          .sort((a, b) => b.amountHKD - a.amountHKD);

        const participantSet = new Set(members);
        list.forEach(exp => {
          if (exp.payer && exp.payer !== POOL_PAYER_KEY) participantSet.add(exp.payer);
          (exp.splitWith || []).forEach(p => participantSet.add(p));
        });

        const personStats = {};
        Array.from(participantSet).forEach(person => {
          personStats[person] = {
            name: person,
            isDeleted: !members.includes(person),
            paidHKD: 0,
            shareHKD: 0,
            netHKD: 0,
            eventCount: 0
          };
        });

        list.forEach(exp => {
          const hkd = toHKD(Number(exp.amount), exp.currency);
          if (exp.payer && exp.payer !== POOL_PAYER_KEY && personStats[exp.payer]) {
            personStats[exp.payer].paidHKD += hkd;
            personStats[exp.payer].eventCount += 1;
          }
          let validSplits = (exp.splitWith || []).filter(p => members.includes(p));
          if (validSplits.length === 0) validSplits = [...members];
          if (validSplits.length > 0) {
            const sharesMap = calculateMemberSharesHKD(exp, validSplits);
            validSplits.forEach(p => {
              if (personStats[p]) {
                personStats[p].shareHKD += (sharesMap[p] || 0);
                if (exp.payer !== p) personStats[p].eventCount += 1;
              }
            });
          }
        });

        const personArray = Object.values(personStats)
          .filter(p => !p.isDeleted || p.eventCount > 0 || p.paidHKD > 0 || p.shareHKD > 0)
          .map(p => ({
            ...p,
            netHKD: p.isDeleted && p.paidHKD > 0 ? -p.paidHKD : (p.paidHKD - p.shareHKD)
          }))
          .sort((a, b) => b.shareHKD - a.shareHKD);

        const maxShareHKD = personArray.reduce((max, p) => Math.max(max, p.shareHKD), 0);

        return { list, totalFilteredHKD, categoryBreakdown, personArray, maxShareHKD };
      }, [expenses, isTripTabActive, reportYear, reportMonth, reportDay, members, rates]);

      const shareRoomLink = () => {
        const shareUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(roomId)}`;
        const msg = `💰 一齊用 ${isTripTabActive ? "TripTab 旅遊版" : "COPAY"} 夾錢記帳：「${groupName}」\n🔑 房間代碼：${roomId}\n👉 直接撳連結進入房間：\n${shareUrl}`;
        navigator.clipboard.writeText(msg);
        alert(`已複製邀請連結！\n房間名稱：${groupName}\n專屬代碼：${roomId}\n直接貼去 WhatsApp 群組，朋友一撳即入房 📲`);
      };

      const copyToWhatsApp = () => {
        const badge = isTripTabActive ? "COPAY × TripTab 旅遊版" : "COPAY";
        let text = `💰【${badge} · ${groupName}】結算清單 📊\n`;
        text += `房間代碼：#${roomId} ｜ 總開支：HK$ ${Math.round(totalHKD).toLocaleString()}\n`;
        if (isTripTabActive && poolStats.totalContributedHKD > 0) {
          text += `🏦 公數總注資：HK$ ${Math.round(poolStats.totalContributedHKD).toLocaleString()} ｜ 公數結餘：HK$ ${Math.round(poolStats.remainingPoolHKD).toLocaleString()}\n`;
        }
        text += `------------------------\n`;
        text += `【過數指引 / FPS / PayMe】：\n`;
        if (settlement.transactions.length === 0) {
          text += `✅ 大家帳目已平衡，互不相欠！\n`;
        } else {
          settlement.transactions.forEach(t => {
            const isPaid = !!paidMap[t.key];
            if (isPaid) {
              text += `✅ [已付清] ${t.from} 過數 HK$ ${t.amount.toLocaleString()} 畀 ${t.to}\n`;
            } else {
              text += `⭕ [待過數] ${t.from} 需過數 HK$ ${t.amount.toLocaleString()} 畀 ${t.to}\n`;
            }
          });
        }
        navigator.clipboard.writeText(text);
        alert("已複製 WhatsApp 結算清單！📲");
      };

      const paidCount = settlement.transactions.filter(t => !!paidMap[t.key]).length;

      const visibleExpenses = useMemo(() => {
        return showAllExpenses ? expenses : expenses.slice(0, 3);
      }, [expenses, showAllExpenses]);

      // 渲染單筆開支卡片共用函數
      const renderExpenseItemCard = (exp) => {
        const isPayerDeleted = exp.payer !== POOL_PAYER_KEY && !members.includes(exp.payer);
        const hasAdjustments = exp.splitAdjustments && Object.keys(exp.splitAdjustments).length > 0;
        return (
          <div key={exp.id} className="glass-dark p-3.5 sm:p-4 rounded-3xl flex flex-col gap-2">
            {editingExpId === exp.id ? (
              <div className="space-y-2.5 bg-[#F7F4EC] p-3 rounded-2xl border border-[#EAE3D5]">
                <div className="text-[10px] font-bold text-[#9C7316]">✏️ 修改單據名稱與金額</div>
                <input
                  type="text"
                  value={editTitle}
                  onChange={e => setEditTitle(e.target.value)}
                  className="w-full min-w-0 text-sm bg-white rounded-xl px-3 py-2 font-bold text-[#2C261E] border border-[#EAE3D5] focus:outline-none"
                />
                <div className="flex items-center gap-2 w-full">
                  <input
                    type="number"
                    inputMode="decimal"
                    pattern="[0-9]*"
                    step="any"
                    value={editAmount}
                    onChange={e => setEditAmount(e.target.value)}
                    className="flex-1 min-w-0 text-sm bg-white rounded-xl px-3 py-2 font-bold text-[#2C261E] border border-[#EAE3D5] focus:outline-none"
                  />
                  <button
                    type="button"
                    onClick={() => saveEditExpense(exp)}
                    className="shrink-0 teal-pill text-xs font-bold px-3.5 py-2 rounded-xl"
                  >
                    儲存
                  </button>
                  <button
                    type="button"
                    onClick={() => setEditingExpId(null)}
                    className="shrink-0 bg-white border border-[#EAE3D5] text-[#7D7465] text-xs font-bold px-3 py-2 rounded-xl"
                  >
                    取消
                  </button>
                </div>
              </div>
            ) : (
              <>
                <div className="flex justify-between items-start gap-2">
                  <div className="flex items-center gap-1.5 min-w-0">
                    <span className="shrink-0 text-[10px] bg-[#F7F4EC] border border-[#EAE3D5] text-[#6E6558] px-2 py-1 rounded-xl font-bold">{exp.category}</span>
                    <span className="font-bold text-[#2C261E] text-sm truncate">{exp.title}</span>
                  </div>
                  <div className="text-right shrink-0">
                    <p className="font-black text-[#B5851D] text-sm">
                      {(!exp.currency || exp.currency === "HKD") ? `HK$ ${Number(exp.amount).toLocaleString()}` : `${exp.currency} ${Number(exp.amount).toLocaleString()}`}
                    </p>
                    {exp.currency && exp.currency !== "HKD" && (
                      <p className="text-[10px] text-[#7D7465]">≈ HK$ {Math.round(toHKD(exp.amount, exp.currency)).toLocaleString()}</p>
                    )}
                  </div>
                </div>
                <div className="text-[11px] text-[#7D7465] mt-0.5 space-y-0.5">
                  <p className="leading-snug">
                    <span className={`font-bold ${exp.payer === POOL_PAYER_KEY ? "text-[#B5851D]" : isPayerDeleted ? "text-rose-500" : "text-[#2C261E]"}`}>
                      {exp.payer}{isPayerDeleted ? " (已刪成員·負數記帳)" : ""}
                    </span> 支付 • {(exp.splitWith || []).filter(m => members.includes(m)).length}人夾 ({(exp.splitWith || []).filter(m => members.includes(m)).join(", ")})
                  </p>
                  {hasAdjustments && (
                    <p className="text-[10px] text-[#9C7316] font-bold">
                      ⚖️ 進階拆帳：{Object.entries(exp.splitAdjustments).map(([k, v]) => `${k} ${Number(v) > 0 ? `+${v}` : v}`).join("、")}
                    </p>
                  )}
                </div>
                <div className="flex justify-between items-center pt-2 mt-1 border-t border-[#F0EAE0]">
                  {isReadOnly ? (
                    <span className="text-[10px] text-[#A69D8E] font-bold">🔒 房間已結算封存 (唯讀)</span>
                  ) : (
                    <button
                      type="button"
                      onClick={() => {
                        setEditingExpId(exp.id);
                        setEditTitle(exp.title);
                        setEditAmount(String(exp.amount));
                      }}
                      className="text-[10px] text-[#8C6715] font-bold bg-[#F7F4EC] hover:bg-[#EFE9DA] px-3 py-1 rounded-full transition whitespace-nowrap"
                    >
                      ✏️ 修改單據
                    </button>
                  )}
                  <span className="text-[10px] text-[#A69D8E] whitespace-nowrap">📅 {formatDateUK(exp.date)}</span>

                      取消
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-3 rounded-2xl teal-pill text-xs font-black shadow-lg"
                    >
                      🚀 立即建立旅遊房
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 🏦 公數錢包管理彈窗 */}
          {showPoolModal && (
            <div className="fixed inset-0 bg-black/45 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-dark max-w-sm w-full rounded-[2rem] p-5 sm:p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-start gap-2">
                  <div>
                    <h3 className="font-black text-base text-amber-300">🏦 公數錢包管理 (Common Pool)</h3>
                    <p className="text-[11px] text-slate-300 mt-0.5">
                      系統已啟用防超支保護：公數消費絕不能多於可用餘額
                    </p>
                  </div>
                  <button onClick={() => setShowPoolModal(false)} className="shrink-0 text-slate-300 hover:text-white text-xl font-bold leading-none">×</button>
                </div>

                <div className="bg-white/5 border border-white/10 rounded-2xl p-3.5 grid grid-cols-3 gap-2 text-center">
                  <div>
                    <div className="text-[10px] text-slate-300">總注資 (HK$)</div>
                    <div className="font-black text-sm text-white">{Math.round(poolStats.totalContributedHKD).toLocaleString()}</div>
                  </div>
                  <div>
                    <div className="text-[10px] text-slate-300">已消費 (HK$)</div>
                    <div className="font-black text-sm text-amber-300">{Math.round(poolStats.totalSpentFromPoolHKD).toLocaleString()}</div>
                  </div>
                  <div>
                    <div className="text-[10px] text-slate-300">可用餘額 (HK$)</div>
                    <div className="font-black text-sm text-emerald-300">{poolStats.remainingPoolHKD.toLocaleString()}</div>
                  </div>
                </div>

                <div>
                  <label className="block text-[10px] text-slate-300 font-bold mb-1">📅 公數注資 / 建立日期 (DD/MM/YYYY)</label>
                  <div className="relative ios-uniform-field w-full bg-[#F7F4EC] border border-[#EAE3D5] px-3.5 flex items-center justify-between">
                    <span className="text-xs font-bold text-[#2C261E]">
                      {formatDateUK(poolDate)}
                    </span>
                    <span className="text-xs opacity-65">📅</span>
                    <input
                      type="date"
                      value={poolDate}
                      onChange={e => handlePoolDateChange(e.target.value)}
                      className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                    />
                  </div>
                </div>

                <form onSubmit={handleBatchTopUpPool} className="space-y-1.5">
                  <label className="block text-[10px] text-slate-300 font-bold">⚡ 全體成員每人一鍵加碼夾公數 (HKD)</label>
                  <div className="flex items-center gap-2 w-full">
                    <input
                      type="number"
                      inputMode="decimal"
                      pattern="[0-9]*"
                      step="any"
                      placeholder="例如每人夾 1000"
                      value={poolTopUpAmount}
                      onChange={e => setPoolTopUpAmount(e.target.value)}
                      className="flex-1 min-w-0 text-xs bg-white/10 border border-white/15 rounded-xl px-3 py-2.5 text-white font-bold focus:outline-none"
                    />
                    <button type="submit" className="shrink-0 teal-pill text-xs font-black px-3.5 py-2.5 rounded-xl whitespace-nowrap">
                      ＋ 每人加碼
                    </button>
                  </div>
                </form>

                <div className="space-y-2 max-h-44 overflow-y-auto pr-1">
                  <div className="text-[10px] text-slate-300 font-bold">各成員累計已夾公數金額 (HKD)：</div>
                  {members.map(m => (
                    <div key={m} className="flex justify-between items-center bg-white/5 px-3 py-2 rounded-xl border border-white/10 gap-2">
                      <span className="text-xs font-bold text-white truncate">{m}</span>
                      <div className="flex items-center gap-1.5 shrink-0">
                        <span className="text-[10px] text-slate-400">HK$</span>
                        <input
                          type="number"
                          inputMode="decimal"
                          pattern="[0-9]*"
                          step="any"
                          value={poolContributions[m] || 0}
                          onChange={e => handleMemberPoolChange(m, e.target.value)}
                          className="w-24 text-right bg-white rounded-lg px-2 py-1 font-mono font-bold text-xs text-amber-300 border border-[#EAE3D5] focus:outline-none"
                        />
                      </div>
                    </div>
                  ))}
                </div>

                <button
                  type="button"
                  onClick={() => setShowPoolModal(false)}
                  className="w-full py-2.5 rounded-2xl teal-pill text-xs font-bold"
                >
                  完成並返回記帳
                </button>
              </div>
            </div>
          )}

          {/* 刪除單據雙重確認彈窗 */}
          {deleteConfirmExp && (
            <div className="fixed inset-0 bg-black/45 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-dark max-w-xs w-full rounded-3xl p-6 text-center space-y-4">
                <div className="w-12 h-12 rounded-full bg-rose-50 border border-rose-200 flex items-center justify-center mx-auto text-2xl">
                  🗑️
                </div>
                <div className="space-y-1">
                  <h3 className="font-black text-base text-white">確定要刪除呢筆單據？</h3>
                  <p className="text-xs text-slate-300">
                    「<span className="font-bold text-amber-300">{deleteConfirmExp.title}</span>」
                    ({(!deleteConfirmExp.currency || deleteConfirmExp.currency === "HKD") ? "HK$" : deleteConfirmExp.currency} {Number(deleteConfirmExp.amount).toLocaleString()})
                  </p>
                  <p className="text-[11px] text-slate-400">刪除後所有成員嘅夾錢結算會即時重新計算。</p>
                </div>
                <div className="flex gap-2.5 pt-1">
                  <button
                    type="button"
                    onClick={() => setDeleteConfirmExp(null)}
                    className="flex-1 py-2.5 rounded-2xl bg-[#F7F4EC] text-[#7D7465] text-xs font-bold transition"
                  >
                    取消
                  </button>
                  <button
                    type="button"
                    onClick={confirmDeleteExpense}
                    className="flex-1 py-2.5 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold shadow-lg transition"
                  >
                    確定刪除
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 👑 【HK$ 38 一次性買斷（解鎖 Pro 版）】收費牆彈窗 */}
          {showPaywall && (
            <div className="fixed inset-0 bg-black/45 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-dark max-w-sm w-full rounded-[2rem] p-5 sm:p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-start gap-2">
                  <div className="flex items-center gap-2.5 min-w-0">
                    <BrandLogo isTripTab={true} size="w-10 h-10" />
                    <div className="min-w-0">
                      <h2 className="font-black text-base text-white truncate">{paywallTriggerTitle}</h2>
                      <p className="text-[11px] text-amber-300 font-bold">首個旅程無痛體驗 · 一次買斷永久免月費</p>
                    </div>
                  </div>
                  <button onClick={() => setShowPaywall(false)} className="shrink-0 text-slate-300 hover:text-white text-xl font-bold leading-none">×</button>
                </div>

                <div className="bg-[#FDF8EA] border border-[#E8CD7D] p-3.5 rounded-2xl text-xs text-[#8C6715] leading-relaxed font-medium">
                  {paywallMsg}
                </div>

                <div className="space-y-2 text-xs text-slate-200 bg-white/5 p-3.5 rounded-2xl border border-white/10">
                  <div className="flex items-center gap-2"><span>✈️</span> <strong>無限建立旅程與日常房間</strong>（打破 1 間免費房限制）</div>
                  <div className="flex items-center gap-2"><span>💱</span> <strong>多幣別實時自動匯率轉換</strong>（外幣混合記帳零誤差）</div>
                  <div className="flex items-center gap-2"><span>⚖️</span> <strong>進階拆帳邏輯</strong>（支援唔飲酒少夾 $50 / 個別加減）</div>
                  <div className="flex items-center gap-2"><span>📥</span> <strong>一鍵匯出 CSV 試算表備份</strong> ＋ 隨時解封唯讀房間</div>
                </div>

                <button
                  type="button"
                  onClick={handleSimulatePurchase}
                  className="w-full p-4 rounded-2xl teal-pill text-center transition shadow-lg active:scale-98 space-y-0.5"
                >
                  <div className="text-[11px] font-black uppercase tracking-wider">🔥 永久買斷 · 無限次旅行使用</div>
                  <div className="text-xl font-black">HK$ 38 <span className="text-xs font-bold">(一次性買斷解鎖 Pro 版)</span></div>
                </button>

                <form onSubmit={handleUnlockWithCode} className="pt-2 border-t border-white/10">
                  <label className="block text-[10px] text-slate-300 font-bold mb-1">已有 VIP 解鎖碼？（測試碼：COPAY2026 或 TRIPTAB）</label>
                  <div className="flex items-center gap-2 w-full">
                    <input
                      type="text"
                      placeholder="輸入解鎖碼"
                      value={vipInput}
                      onChange={e => setVipInput(e.target.value)}
                      className="flex-1 min-w-0 text-xs bg-white/10 border border-white/15 rounded-xl px-3 py-2 font-mono uppercase text-white focus:outline-none"
                    />
                    <button type="submit" className="shrink-0 gold-pill text-xs font-black px-4 py-2 rounded-xl whitespace-nowrap">
                      兌換
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
