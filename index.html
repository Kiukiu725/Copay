  <script>
    (function setupAppIcons() {
      function drawFallbackIcon() {
        try {
          var canvas = document.createElement("canvas");
          canvas.width = 512;
          canvas.height = 512;
          var ctx = canvas.getContext("2d");
          if (!ctx) return null;

          var bgGrad = ctx.createLinearGradient(0, 0, 512, 512);
          bgGrad.addColorStop(0, "#3D4650");
          bgGrad.addColorStop(1, "#262C33");
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, 512, 512);

          var glowGrad = ctx.createRadialGradient(295, 165, 5, 295, 165, 95);
          glowGrad.addColorStop(0, "rgba(246, 193, 107, 0.55)");
          glowGrad.addColorStop(0.5, "rgba(246, 193, 107, 0.18)");
          glowGrad.addColorStop(1, "rgba(246, 193, 107, 0)");
          ctx.fillStyle = glowGrad;
          ctx.beginPath();
          ctx.arc(295, 165, 95, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#2E6070";
          ctx.fillRect(238, 96, 36, 232);

          ctx.strokeStyle = "#2B5B6C";
          ctx.lineWidth = 40;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(298, 162);
          ctx.bezierCurveTo(265, 120, 195, 130, 198, 176);
          ctx.bezierCurveTo(200, 222, 315, 210, 315, 262);
          ctx.bezierCurveTo(315, 305, 230, 308, 205, 268);
          ctx.stroke();

          ctx.strokeStyle = "#EAA956";
          ctx.lineWidth = 34;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(256, 136);
          ctx.quadraticCurveTo(292, 132, 306, 162);
          ctx.stroke();

          ctx.fillStyle = "#B2C8CE";
          ctx.font = "bold 76px -apple-system, BlinkMacSystemFont, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("copay", 256, 420);

          return canvas.toDataURL("image/png");
        } catch (err) {
          return null;
        }
      }

      window.addEventListener("load", function () {
        var appleIcon = document.getElementById("dynamic-apple-icon");
        var favIcon = document.getElementById("dynamic-favicon");
        var files = ["Copay.png", "Copay_2.png", "copay.png"];
        var loaded = false;

        files.forEach(function (file) {
          var img = new Image();
          img.onload = function () {
            if (!loaded) {
              loaded = true;
              if (appleIcon) appleIcon.href = file;
              if (favIcon) favIcon.href = file;
            }
          };
          img.src = file;
        });

        setTimeout(function () {
          if (!loaded) {
            var dataUrl = drawFallbackIcon();
            if (dataUrl) {
              if (appleIcon) appleIcon.href = dataUrl;
              if (favIcon) favIcon.href = dataUrl;
            }
          }
        }, 1200);
      });
    })();
  </script>

        csv += "單據日期(DD/MM/YYYY),類別,項目名稱,原幣金額,貨幣,折合港幣(HKD),墊支人(狀態),參與分攤成員,進階拆帳備註\n";

        chartAndReportData.list.forEach(e => {
          const hkd = Math.round(toHKD(Number(e.amount), e.currency));
          const payerStatus = (e.payer !== POOL_PAYER_KEY && !members.includes(e.payer)) ? `${e.payer} (已刪除)` : e.payer;
          const splitsText = (e.splitWith || []).filter(p => members.includes(p)).join(" / ");
          const adjNotes = e.splitAdjustments ? Object.entries(e.splitAdjustments).filter(([, v]) => Number(v) !== 0).map(([k, v]) => `${k}:${Number(v) > 0 ? '+' : ''}${v}`).join("; ") : "平分";
          csv += `${formatDateUK(e.date)},${e.category},"${String(e.title || "").replace(/"/g, '""')}",${e.amount},${e.currency || "HKD"},${hkd},"${payerStatus}","${splitsText}","${adjNotes}"\n`;
        });

        csv += "\n成員消費匯總 (包括已刪除但有事件紀錄之成員)\n";
        csv += "成員姓名,狀態,累計墊支(HKD),實際享用消費(HKD),淨結餘/負數顯示(HKD)\n";
        chartAndReportData.personArray.forEach(p => {
          csv += `"${p.name}",${p.isDeleted ? "已刪除成員" : "現有成員"},${Math.round(p.paidHKD)},${Math.round(p.shareHKD)},${Math.round(p.netHKD)}\n`;
        });

        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
        link.setAttribute("download", `Copay_${groupName}_${roomId}_報告.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
      };

      const unlockProPermanent = () => {
        setIsPro(true); setShowPaywall(false); setVipInput("");
        if (auth.currentUser) saveProToCloudUser(auth.currentUser);
        if (pendingAction) { pendingAction(); setPendingAction(null); }
        alert("🎉 恭喜你成功鎖定【Copay Travel 早鳥永久解鎖 $38】！所有進階功能與無廣告體驗已永久開通！");
      };

      const handleUnlockWithCode = (e) => {
        e.preventDefault();
        if (VALID_VIP_CODES.includes(vipInput.trim().toUpperCase())) unlockProPermanent();
        else alert("❌ 解鎖碼無效！請檢查輸入是否正確");
      };

      const saveGroupName = (e) => {
        if (e) e.preventDefault();
        const trimmed = tempGroupName.trim();
        if (trimmed) {
          setGroupName(trimmed);
          db.ref(`copay_rooms/${roomId}`).update({ groupName: trimmed, lastUpdated: Date.now() });
        }
        setIsEditingGroupName(false);
      };

      const handleAddExpense = (e) => {
        e.preventDefault();
        if (!title || !amount || splitWith.length === 0 || !date) return;
        const rawAmt = parseFloat(amount);
        if (isNaN(rawAmt) || rawAmt <= 0) return;

        const finalAmt = isTravelMode && addCardFee ? Number((rawAmt * feeMultiplier).toFixed(2)) : rawAmt;
        const finalCurrency = isTravelMode ? currency : "HKD";
        const expenseHKD = toHKD(finalAmt, finalCurrency);

        if (payer === POOL_PAYER_KEY) {
          if (poolStats.totalContributedHKD <= 0) return setShowPoolModal(true);
          if (expenseHKD > poolStats.rawRemainingHKD + 0.05) return alert(`🚫 公數錢包餘額不足！尚欠差額 HK$ ${(expenseHKD - poolStats.remainingPoolHKD).toFixed(1)}`);
        }

        let cleanedAdjustments = null;
        if ((isPro || isProRoom) && useAdvancedSplit) {
          cleanedAdjustments = {};
          splitWith.forEach(m => {
            const adjVal = parseFloat(splitAdjustments[m]);
            if (!isNaN(adjVal) && adjVal !== 0) cleanedAdjustments[m] = adjVal;
          });
          if (Object.keys(cleanedAdjustments).length === 0) cleanedAdjustments = null;
        }

        const id = Date.now();
        const newExp = {
          id, title: `${title.trim()}${isTravelMode && addCardFee ? ` (連${cardFeePercent}%卡費)` : ""}`,
          amount: finalAmt, currency: finalCurrency, payer, isPoolExpense: payer === POOL_PAYER_KEY,
          splitWith, splitAdjustments: cleanedAdjustments, category, date
        };
        db.ref(`copay_rooms/${roomId}`).update({ [`expenses/${id}`]: newExp, lastUpdated: Date.now() });
        setTitle(""); setAmount(""); setAddCardFee(false); setSplitAdjustments({});
      };

      const saveEditExpense = (exp) => {
        const trimmedTitle = editTitle.trim();
        const parsedAmt = parseFloat(editAmount);
        if (!trimmedTitle || isNaN(parsedAmt) || parsedAmt <= 0) return;

        if (exp.payer === POOL_PAYER_KEY || exp.isPoolExpense) {
          if (toHKD(parsedAmt, exp.currency) > (poolStats.rawRemainingHKD + toHKD(Number(exp.amount), exp.currency)) + 0.05) {
            return alert(`🚫 修改後金額超出公數錢包上限！`);
          }
        }
        db.ref(`copay_rooms/${roomId}`).update({ [`expenses/${exp.id}/title`]: trimmedTitle, [`expenses/${exp.id}/amount`]: parsedAmt, lastUpdated: Date.now() });
        setEditingExpId(null);
      };

      const confirmDeleteExpense = () => {
        if (!deleteConfirmExp) return;
        db.ref(`copay_rooms/${roomId}/expenses/${deleteConfirmExp.id}`).remove();
        touchRoom();
        setDeleteConfirmExp(null);
      };

      const handleRateChange = (cur, val) => {
        const num = parseFloat(val);
        if (!isNaN(num) && num > 0) { db.ref(`copay_rooms/${roomId}/customRates/${cur}`).set(num); touchRoom(); }
      };

      const handleSelectDefaultCurrency = (cur) => {
        setCurrency(cur); db.ref(`copay_rooms/${roomId}/defaultCurrency`).set(cur); touchRoom();
      };

      const handleAddCustomCurrency = (e) => {
        e.preventDefault();
        const code = newCurCode.trim().toUpperCase();
        const rateVal = parseFloat(newCurRate);
        if (code.length === 3 && !isNaN(rateVal) && rateVal > 0) {
          db.ref(`copay_rooms/${roomId}/customRates/${code}`).set(rateVal);
          handleSelectDefaultCurrency(code);
          setNewCurCode(""); setNewCurRate("");
          touchRoom();
        }
      };

      const handleCardFeePercentChange = (valStr) => {
        const val = Math.max(0, parseFloat(valStr) || 0);
        setCardFeePercent(val);
        db.ref(`copay_rooms/${roomId}/cardFeePercent`).set(val);
        touchRoom();
      };

      const toggleSettlementPaid = (txKey) => {
        db.ref(`copay_rooms/${roomId}/paidMap/${txKey}`).set(!paidMap[txKey]); touchRoom();
      };

      const resetAllPaidStatus = () => {
        db.ref(`copay_rooms/${roomId}/paidMap`).remove(); touchRoom();
      };

      const totalHKD = useMemo(() => expenses.reduce((acc, exp) => acc + toHKD(Number(exp.amount), exp.currency), 0), [expenses, rates]);

      const calculateMemberSharesHKD = (exp, validSplitMembers) => {
        const totalExpHKD = toHKD(Number(exp.amount), exp.currency);
        if (validSplitMembers.length === 0) return {};

        let totalAdjHKD = 0; const memberAdjHKD = {};
        validSplitMembers.forEach(m => {
          const adjHKD = toHKD(Number((exp.splitAdjustments || {})[m]) || 0, exp.currency);
          memberAdjHKD[m] = adjHKD; totalAdjHKD += adjHKD;
        });

        const baseShareHKD = (totalExpHKD - totalAdjHKD) / validSplitMembers.length;
        const result = {};
        validSplitMembers.forEach(m => result[m] = Math.max(0, baseShareHKD + (memberAdjHKD[m] || 0)));
        return result;
      };

      const travelDailyGroups = useMemo(() => {
        if (!expenses || expenses.length === 0) return [];
        const uniqueDatesAsc = Array.from(new Set(expenses.map(e => e.date || "未知日期"))).sort();
        const dayIndexMap = {}; uniqueDatesAsc.forEach((d, idx) => dayIndexMap[d] = idx + 1);
        return [...uniqueDatesAsc].reverse().map(d => {
          const items = expenses.filter(e => (e.date || "未知日期") === d);
          return { date: d, ukDate: formatDateUK(d), dayNum: dayIndexMap[d] || 1, items, dayTotalHKD: items.reduce((sum, e) => sum + toHKD(Number(e.amount), e.currency), 0) };
        });
      }, [expenses, rates]);

      const toggleDayCollapse = (dateKey) => setCollapsedDays(prev => ({ ...prev, [dateKey]: !prev[dateKey] }));

      const settlement = useMemo(() => {
        const balances = {}; const deletedPayersNegative = {};
        members.forEach(m => balances[m] = isTravelMode ? (Number(poolContributions[m]) || 0) : 0);

        expenses.forEach(exp => {
          const hkdAmount = toHKD(Number(exp.amount), exp.currency);
          let activeSplits = (exp.splitWith || []).filter(p => members.includes(p));
          if (activeSplits.length === 0) activeSplits = [...members];

          if (exp.payer !== POOL_PAYER_KEY && !exp.isPoolExpense) {
            if (members.includes(exp.payer)) balances[exp.payer] += hkdAmount;
            else deletedPayersNegative[exp.payer] = (deletedPayersNegative[exp.payer] || 0) - hkdAmount;
          } else if (!isTravelMode) return;

          const sharesMap = calculateMemberSharesHKD(exp, activeSplits);
          activeSplits.forEach(p => balances[p] -= (sharesMap[p] || 0));
        });

        if (isTravelMode && poolStats.remainingPoolHKD > 0 && poolStats.totalContributedHKD > 0) {
          members.forEach(m => balances[m] -= ((Number(poolContributions[m]) || 0) / poolStats.totalContributedHKD) * poolStats.remainingPoolHKD);
        }

        const debtors = []; const creditors = [];
        Object.keys(balances).forEach(m => {
          const val = Math.round(balances[m]);
          if (val < -1) debtors.push({ name: m, amount: -val });
          else if (val > 1) creditors.push({ name: m, amount: val });
        });

        debtors.sort((a, b) => b.amount - a.amount); creditors.sort((a, b) => b.amount - a.amount);
        const transactions = []; let i = 0, j = 0;
        while (i < debtors.length && j < creditors.length) {
          const deb = debtors[i]; const cred = creditors[j];
          const settleAmt = Math.min(deb.amount, cred.amount);
          transactions.push({ key: `${deb.name}_TO_${cred.name}`.replace(/[.#$\[\]\/]/g, "_"), from: deb.name, to: cred.name, amount: Math.round(settleAmt) });
          deb.amount -= settleAmt; cred.amount -= settleAmt;
          if (deb.amount === 0) i++; if (cred.amount === 0) j++;
        }
        return { balances, deletedPayersNegative, transactions };
      }, [expenses, members, rates, poolContributions, isTravelMode, poolStats]);

      const reportAvailableDates = useMemo(() => {
        const years = new Set(), months = new Set(), days = new Set();
        expenses.forEach(e => {
          if (!e.date) return; const parts = e.date.split("-");
          if (parts[0]) years.add(parts[0]); if (parts[1]) months.add(parts[1]); if (parts[2]) days.add(parts[2]);
        });
        return { years: Array.from(years).sort().reverse(), months: Array.from(months).sort(), days: Array.from(days).sort() };
      }, [expenses]);

      const chartAndReportData = useMemo(() => {
        const list = expenses.filter(e => {
          if (isTravelMode || !e.date) return true;
          const [y, m, d] = e.date.split("-");
          return (reportYear === "ALL" || y === reportYear) && (reportMonth === "ALL" || m === reportMonth) && (reportDay === "ALL" || d === reportDay);
        });

        const totalFilteredHKD = list.reduce((s, e) => s + toHKD(Number(e.amount), e.currency), 0);
        const catMap = {};
        list.forEach(e => { const cat = e.category || "🍱 食飯"; catMap[cat] = (catMap[cat] || 0) + toHKD(Number(e.amount), e.currency); });
        const categoryBreakdown = Object.entries(catMap).map(([cat, val]) => ({ category: cat, amountHKD: val, percent: totalFilteredHKD > 0 ? Math.round((val / totalFilteredHKD) * 100) : 0 })).sort((a, b) => b.amountHKD - a.amountHKD);

        const personStats = {};
        const participantSet = new Set(members);
        list.forEach(exp => { if (exp.payer && exp.payer !== POOL_PAYER_KEY) participantSet.add(exp.payer); (exp.splitWith || []).forEach(p => participantSet.add(p)); });
        Array.from(participantSet).forEach(person => personStats[person] = { name: person, isDeleted: !members.includes(person), paidHKD: 0, shareHKD: 0, eventCount: 0 });

        list.forEach(exp => {
          const hkd = toHKD(Number(exp.amount), exp.currency);
          if (exp.payer && exp.payer !== POOL_PAYER_KEY && personStats[exp.payer]) { personStats[exp.payer].paidHKD += hkd; personStats[exp.payer].eventCount += 1; }
          let validSplits = (exp.splitWith || []).filter(p => members.includes(p));
          if (validSplits.length === 0) validSplits = [...members];
          const sharesMap = calculateMemberSharesHKD(exp, validSplits);
          validSplits.forEach(p => { if (personStats[p]) { personStats[p].shareHKD += (sharesMap[p] || 0); if (exp.payer !== p) personStats[p].eventCount += 1; } });
        });

        const personArray = Object.values(personStats)
          .filter(p => !p.isDeleted || p.eventCount > 0 || p.paidHKD > 0 || p.shareHKD > 0)
          .map(p => ({ ...p, netHKD: p.isDeleted && p.paidHKD > 0 ? -p.paidHKD : (p.paidHKD - p.shareHKD) }))
          .sort((a, b) => b.shareHKD - a.shareHKD);

        return { list, totalFilteredHKD, categoryBreakdown, personArray, maxShareHKD: personArray.reduce((max, p) => Math.max(max, p.shareHKD), 0) };
      }, [expenses, isTravelMode, reportYear, reportMonth, reportDay, members, rates]);

      const shareRoomLink = () => {
        navigator.clipboard.writeText(`💰 一齊用 ${isTravelMode ? "Copay Travel 海外旅遊版" : "Copay"} 夾錢記帳：「${groupName}」\n🔑 房間代碼：${roomId}\n👉 直接撳連結進入房間：\n${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(roomId)}`);
        alert(`已複製邀請連結！\n專屬代碼：${roomId}\n直接貼去 WhatsApp 群組，朋友一撳即入房 📲`);
      };

      const copyToWhatsApp = () => {
        let text = `💰【${isTravelMode ? "Copay Travel 海外旅遊版" : "Copay Lite 日常版"} · ${groupName}】結算清單 📊\n房間代碼：#${roomId} ｜ 總開支：HK$ ${Math.round(totalHKD).toLocaleString()}\n`;
        if (isTravelMode && poolStats.totalContributedHKD > 0) text += `🏦 公數總注資：HK$ ${Math.round(poolStats.totalContributedHKD).toLocaleString()} ｜ 公數結餘：HK$ ${Math.round(poolStats.remainingPoolHKD).toLocaleString()}\n`;
        text += `------------------------\n【過數指引 / FPS / PayMe】：\n`;
        if (settlement.transactions.length === 0) text += `✅ 大家帳目已平衡，互不相欠！\n`;
        else settlement.transactions.forEach(t => text += !!paidMap[t.key] ? `✅ [已付清] ${t.from} 過數 HK$ ${t.amount.toLocaleString()} 畀 ${t.to}\n` : `⭕ [待過數] ${t.from} 需過數 HK$ ${t.amount.toLocaleString()} 畀 ${t.to}\n`);
        navigator.clipboard.writeText(text); alert("已複製 WhatsApp 結算清單！📲");
      };

      const leaveRoomLocal = (idToRemove) => {
        setMyRooms(prev => {
          const next = prev.filter(r => r.id !== idToRemove);
          if (next.length === 0) return [{ id: generateRandomRoomId(), name: "日常飯局夾錢 🍱", mode: "daily" }];
          return next;
        });
        if (roomId === idToRemove) {
          const remaining = myRooms.filter(r => r.id !== idToRemove);
          if (remaining.length > 0) setRoomId(remaining[0].id);
        }
        setManagingRoomId(null);
      };

      const destroyRoomCloud = (idToRemove) => {
        if (window.confirm("⚠️ 警告：此操作將會永久刪除雲端資料，所有朋友都會無法存取呢個房間！\n\n確定徹底刪除？")) {
          db.ref(`copay_rooms/${idToRemove}`).remove();
          leaveRoomLocal(idToRemove);
        }
      };

      const paidCount = settlement.transactions.filter(t => !!paidMap[t.key]).length;
      const visibleExpenses = useMemo(() => showAllExpenses ? expenses : expenses.slice(0, 3), [expenses, showAllExpenses]);

      const renderExpenseItemCard = (exp, isNew = false) => {
        const isPayerDeleted = exp.payer !== POOL_PAYER_KEY && !members.includes(exp.payer);
        const hasAdjustments = exp.splitAdjustments && Object.keys(exp.splitAdjustments).length > 0;
        return (
          <div key={exp.id} className={`glass-dark p-3.5 sm:p-4 rounded-3xl flex flex-col gap-2 ${isNew ? 'animate-fade-in-up' : ''}`}>
            {editingExpId === exp.id ? (
              <div className="space-y-2.5 bg-[#F7F4EC] p-3 rounded-2xl border border-[#EAE3D5] animate-scale-in">
                <div className="text-[10px] font-bold text-[#9C7316]">✏️ 修改單據名稱與金額</div>
                <input type="text" value={editTitle} onChange={e => setEditTitle(e.target.value)} className="w-full text-sm bg-white rounded-xl px-3 py-2 font-bold text-[#2C261E] border border-[#EAE3D5] focus:outline-none" />
                <div className="flex items-center gap-2 w-full">
                  <input type="number" inputMode="decimal" step="any" value={editAmount} onChange={e => setEditAmount(e.target.value)} className="flex-1 text-sm bg-white rounded-xl px-3 py-2 font-bold text-[#2C261E] border border-[#EAE3D5] focus:outline-none" />
                  <button type="button" onClick={() => saveEditExpense(exp)} className="shrink-0 teal-pill text-xs font-bold px-3.5 py-2 rounded-xl">儲存</button>
                  <button type="button" onClick={() => setEditingExpId(null)} className="shrink-0 bg-white border border-[#EAE3D5] text-[#7D7465] text-xs font-bold px-3 py-2 rounded-xl">取消</button>
                </div>
              </div>
            ) : (
              <>
                <div className="flex justify-between items-start gap-2">
                  <div className="flex items-center gap-1.5 min-w-0">
                    <span className="shrink-0 text-[10px] bg-[#F7F4EC] border border-[#EAE3D5] text-[#6E6558] px-2 py-1 rounded-xl font-bold">{exp.category}</span>
                    <span className="font-bold text-[#2C261E] text-sm truncate">{exp.title}</span>
                  </div>
                  <div className="text-right shrink-0">
                    <p className="font-black text-[#B5851D] text-sm">{(!exp.currency || exp.currency === "HKD") ? `HK$ ${Number(exp.amount).toLocaleString()}` : `${exp.currency} ${Number(exp.amount).toLocaleString()}`}</p>
                    {exp.currency && exp.currency !== "HKD" && <p className="text-[10px] text-[#7D7465]">≈ HK$ {Math.round(toHKD(exp.amount, exp.currency)).toLocaleString()}</p>}
                  </div>
                </div>
                <div className="text-[11px] text-[#7D7465] mt-0.5 space-y-0.5">
                  <p className="leading-snug"><span className={`font-bold ${exp.payer === POOL_PAYER_KEY ? "text-[#B5851D]" : isPayerDeleted ? "text-rose-500" : "text-[#2C261E]"}`}>{exp.payer}{isPayerDeleted ? " (已刪成員)" : ""}</span> 支付 • {(exp.splitWith || []).filter(m => members.includes(m)).length}人夾</p>
                  {hasAdjustments && <p className="text-[10px] text-[#9C7316] font-bold">⚖️ 進階拆帳：{Object.entries(exp.splitAdjustments).map(([k, v]) => `${k} ${Number(v) > 0 ? `+${v}` : v}`).join("、")}</p>}
                </div>
                <div className="flex justify-between items-center pt-2 mt-1 border-t border-[#F0EAE0]">
                  <button type="button" onClick={() => { setEditingExpId(exp.id); setEditTitle(exp.title); setEditAmount(String(exp.amount)); }} className="text-[10px] text-[#8C6715] font-bold bg-[#F7F4EC] hover:bg-[#EFE9DA] px-3 py-1 rounded-full">✏️ 修改</button>
                  <span className="text-[10px] text-[#A69D8E]">📅 {formatDateUK(exp.date)}</span>
                  <button type="button" onClick={() => setDeleteConfirmExp(exp)} className="text-[10px] text-rose-500 font-bold bg-rose-50 hover:bg-rose-100 px-3 py-1 rounded-full">🗑️ 刪除</button>
                </div>
              </>
            )}
          </div>
        );
      };

      const renderSettlementCard = () => (
        <div className="glass-dark p-4 sm:p-5 rounded-3xl space-y-3">
          <div className="flex justify-between items-center gap-2 border-b border-[#F0EAE0] pb-3">
            <h3 className="font-bold text-[#2C261E] text-xs sm:text-sm">⚡ {isTravelMode ? "自動結算（連公數多除小補）" : "自動對沖結算清單 (HK$)"}</h3>
            <button onClick={copyToWhatsApp} className="shrink-0 teal-pill text-[10px] sm:text-[11px] px-3 py-1.5 rounded-full font-bold">📲 複製</button>
          </div>
          {settlement.transactions.length === 0 ? (
            <div className="text-center py-8 text-[#8C8273] text-xs bg-[#F7F4EC] rounded-2xl animate-fade-in">🌿 目前收支平衡，互不相欠！</div>
          ) : (
            <div className="space-y-2.5">
              {settlement.transactions.map((t) => {
                const isPaid = !!paidMap[t.key];
                return (
                  <div key={t.key} className={`flex items-center justify-between gap-2 p-3 sm:p-3.5 rounded-2xl border transition-all ${isPaid ? "bg-emerald-50 border-emerald-200 opacity-75" : "bg-[#F7F4EC] border-[#EAE3D5]"}`}>
                    <div className="flex items-center gap-2 min-w-0">
                      <span className="shrink-0 w-7 h-7 rounded-xl bg-[#DFECF2] text-[#376885] flex items-center justify-center text-xs">💸</span>
                      <div className="flex items-center gap-1 flex-wrap min-w-0">
                        <span className={`font-bold text-xs sm:text-sm ${isPaid ? "line-through text-[#A69D8E]" : "text-[#2C261E]"}`}>{t.from}</span>
                        <span className="text-[11px] text-[#8C8273]">➡️ 過數畀</span>
                        <span className={`font-bold text-xs sm:text-sm ${isPaid ? "line-through text-[#A69D8E]" : "text-[#9C7316]"}`}>{t.to}</span>
                      </div>
                    </div>

                  </div>
                  <div onClick={() => setModalSelectedMode("travel")} className={`p-4 rounded-2xl border-2 cursor-pointer transition-colors ${modalSelectedMode === "travel" ? "bg-[#DFECF2] border-[#2D3842]" : "bg-[#ECF2F5] border-transparent"}`}>
                    <div className="flex justify-between items-center mb-1"><span className="font-black text-sm text-[#26353D]">✈️ 海外旅遊</span>{isPro ? <span className="text-[10px] bg-[#2D3842] text-[#F4D58D] px-2.5 py-0.5 rounded-full">PRO</span> : <span className="text-[10px] bg-[#2D3842] text-[#F4D58D] px-2.5 py-0.5 rounded-full">🔥 早鳥 $38</span>}</div>
                  </div>
                </div>
                <form onSubmit={handleModalCreateRoomSubmit} className="space-y-3 pt-1">
                  <input type="text" placeholder={modalSelectedMode === "travel" ? "旅程名稱" : "飯局名稱"} value={modalRoomNameInput} onChange={e => setModalRoomNameInput(e.target.value)} autoFocus className="w-full text-sm bg-[#ECF2F5] text-[#26353D] font-extrabold px-4 py-3 rounded-2xl focus:outline-none" required />
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setShowCreateRoomModal(false)} className="flex-1 py-3 rounded-2xl bg-[#ECF2F5] text-[#5C707B] text-xs font-bold">取消</button>
                    <button type="submit" className={`flex-1 py-3 rounded-2xl text-xs font-black shadow-md ${modalSelectedMode === "travel" ? "gold-pill" : "teal-pill"}`}>{modalSelectedMode === "travel" ? (isPro ? "建立" : "解鎖") : "建立"}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {showPoolModal && (
            <div className="fixed inset-0 bg-black/45 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-dark max-w-sm w-full rounded-[2rem] p-5 sm:p-6 space-y-4 animate-scale-in">
                <div className="flex justify-between items-start"><h3 className="font-black text-base text-amber-300">🏦 公數錢包管理</h3><button onClick={() => setShowPoolModal(false)} className="text-white text-xl">×</button></div>
                <div className="bg-white/5 border border-white/10 rounded-2xl p-3.5 grid grid-cols-3 gap-2 text-center">
                  <div><div className="text-[10px] text-slate-300">總注資 (HK$)</div><div className="font-black text-sm text-white">{Math.round(poolStats.totalContributedHKD).toLocaleString()}</div></div>
                  <div><div className="text-[10px] text-slate-300">已消費 (HK$)</div><div className="font-black text-sm text-amber-300">{Math.round(poolStats.totalSpentFromPoolHKD).toLocaleString()}</div></div>
                  <div><div className="text-[10px] text-slate-300">可用餘額 (HK$)</div><div className="font-black text-sm text-emerald-300">{poolStats.remainingPoolHKD.toLocaleString()}</div></div>
                </div>
                <form onSubmit={handleBatchTopUpPool} className="flex gap-2">
                  <input type="number" step="any" placeholder="全體每人注資金額" value={poolTopUpAmount} onChange={e => setPoolTopUpAmount(e.target.value)} className="flex-1 text-xs bg-white/10 border border-white/15 rounded-xl px-3 py-2.5 text-white focus:outline-none" />
                  <button type="submit" className="teal-pill text-xs font-black px-3.5 py-2.5 rounded-xl active:scale-98">＋ 加碼</button>
                </form>
                <div className="space-y-2 max-h-44 overflow-y-auto pr-1">
                  {members.map(m => (
                    <div key={m} className="flex justify-between items-center bg-white/5 px-3 py-2 rounded-xl border border-white/10 gap-2">
                      <span className="text-xs font-bold text-white truncate">{m}</span>
                      <input type="number" step="any" value={poolContributions[m] || 0} onChange={e => handleMemberPoolChange(m, e.target.value)} className="w-24 text-right bg-white rounded-lg px-2 py-1 font-mono font-bold text-xs text-amber-300 focus:outline-none" />
                    </div>
                  ))}
                </div>
                <button type="button" onClick={() => setShowPoolModal(false)} className="w-full py-2.5 rounded-2xl teal-pill text-xs font-bold">完成</button>
              </div>
            </div>
          )}

          {deleteConfirmExp && (
            <div className="fixed inset-0 bg-black/45 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-dark max-w-xs w-full rounded-3xl p-6 text-center space-y-4 animate-scale-in">
                <div className="w-12 h-12 rounded-full bg-rose-50 flex items-center justify-center mx-auto text-2xl">🗑️</div>
                <h3 className="font-black text-base text-white">確定要刪除呢筆單據？</h3>
                <p className="text-xs text-slate-300">「{deleteConfirmExp.title}」</p>
                <div className="flex gap-2.5 pt-1">
                  <button type="button" onClick={() => setDeleteConfirmExp(null)} className="flex-1 py-2.5 rounded-2xl bg-[#F7F4EC] text-[#7D7465] text-xs font-bold">取消</button>
                  <button type="button" onClick={confirmDeleteExpense} className="flex-1 py-2.5 rounded-2xl bg-rose-500 text-white text-xs font-bold shadow-lg">確定刪除</button>
                </div>
              </div>
            </div>
          )}

          {showPaywall && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-dark max-w-sm w-full rounded-[2rem] p-5 sm:p-6 space-y-4 animate-scale-in">
                <div className="flex justify-between items-start">
                  <div className="flex items-center gap-2.5"><BrandLogo isTravel={true} size="w-10 h-10" /><div><h2 className="font-black text-sm text-white">{paywallTriggerTitle}</h2></div></div>
                  <button onClick={() => setShowPaywall(false)} className="text-white text-xl">×</button>
                </div>
                {paywallMsg && <div className="bg-[#FDF8EA] border border-[#7FA8C4] p-3.5 rounded-2xl text-xs text-[#376885] font-medium">{paywallMsg}</div>}
                <button type="button" onClick={() => window.open(STRIPE_PAYMENT_LINK, "_blank")} className="w-full p-4 rounded-2xl gold-pill text-center shadow-lg active:scale-98 transition-transform">
                  <div className="text-base font-black">Copay Travel 早鳥永久解鎖：$38</div>
                  <div className="text-[11px] opacity-85 mt-0.5">支援 Apple Pay / 信用卡 · 付款後自動解鎖兼享無廣告</div>
                </button>
                <form onSubmit={handleUnlockWithCode} className="flex gap-2 w-full pt-2 border-t border-white/10">
                  <input type="text" placeholder="輸入解鎖碼 (COPAY2026)" value={vipInput} onChange={e => setVipInput(e.target.value)} className="flex-1 text-xs bg-white/10 border border-white/15 rounded-xl px-3 py-2 font-mono uppercase text-white focus:outline-none" />
                  <button type="submit" className="teal-pill text-xs font-black px-4 py-2 rounded-xl">兌換</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById("root");
    if (ReactDOM.createRoot) {
      ReactDOM.createRoot(rootElement).render(<App />);
    } else {
      ReactDOM.render(<App />, rootElement);
    }
  </script>
</body>
</html>
