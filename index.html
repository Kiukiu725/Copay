<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>COPAY — 香港人日常與旅遊夾錢神器</title>
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="COPAY" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#23313B" />

  <!-- App Logo 設定 -->
  <link rel="icon" type="image/png" href="Copay.png" />
  <link rel="apple-touch-icon" href="Copay.png" />

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase Compat SDKs (App + Realtime Database) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      background-color: #1B252C;
    }
    input, select, textarea {
      user-select: auto;
    }
    .volo-bg {
      background: 
        radial-gradient(circle at 82% 24%, rgba(247, 195, 115, 0.45) 0%, rgba(235, 160, 85, 0.18) 28%, transparent 60%),
        radial-gradient(circle at 20% 70%, rgba(58, 136, 153, 0.35) 0%, transparent 55%),
        linear-gradient(180deg, #CFDCE3 0%, #90A8B6 30%, #3E5260 65%, #1E2931 100%);
    }
    .glass-dark {
      background: rgba(25, 36, 44, 0.68);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
    }
    .glass-light {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.35);
    }
    .teal-pill {
      background: linear-gradient(135deg, #3A8899 0%, #2C6F7E 100%);
      box-shadow: 0 6px 20px rgba(44, 111, 126, 0.45);
    }
    .gold-pill {
      background: linear-gradient(135deg, #F5B952 0%, #D98A2B 100%);
      box-shadow: 0 6px 20px rgba(217, 138, 43, 0.4);
    }
    .nav-square {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .nav-square-active {
      background: linear-gradient(145deg, rgba(120, 195, 210, 0.88), rgba(58, 136, 153, 0.92));
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 20px rgba(58, 136, 153, 0.45);
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="antialiased min-h-screen font-sans text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 初始化 Firebase
    const firebaseConfig = {
      databaseURL: "https://travel-split-app-78a36-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 獨立版 TripTab App 網址
    const TRIPTAB_APP_URL = "https://kiukiu725.github.io/Triptab/";

    // 公數錢包固定代號
    const POOL_PAYER_KEY = "🏦 公數錢包";

    // TripTab 旅遊版專屬多國貨幣清單 (日常版只用 HKD)
    const TRIPTAB_RATES = {
      HKD: 1.0,
      JPY: 0.052,
      TWD: 0.245,
      SGD: 5.82,
      KRW: 0.0058,
      THB: 0.22,
      EUR: 8.45,
      GBP: 9.95,
      USD: 7.78,
      AUD: 5.15,
      CNY: 1.08,
      MOP: 0.97,
      CAD: 5.75,
      CHF: 8.85,
      VND: 0.00031
    };

    const DEFAULT_MEMBERS = ["我", "Alex", "Chloe", "Sam"];
    const FREE_ROOM_QUOTA = 2;
    const VALID_VIP_CODES = ["COPAY2026", "TRIPTAB", "VIP888", "TRAVELPRO"];

    // 隨機產生 6 位不重複房間 ID
    const generateRandomRoomId = () => {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let result = "";
      for (let i = 0; i < 6; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    };

    const sanitizeRoomId = (raw) => {
      return (raw || "").trim().toUpperCase().replace(/[.#$\[\]\/\s]/g, "");
    };

    const getStoredRooms = () => {
      try {
        const saved = JSON.parse(localStorage.getItem("copay_my_rooms"));
        if (Array.isArray(saved) && saved.length > 0) {
          return saved.map(item =>
            typeof item === "string" ? { id: item, name: item } : item
          );
        }
      } catch (e) {}
      const firstId = generateRandomRoomId();
      const initial = [{ id: firstId, name: "日常飯局夾錢 🍱" }];
      localStorage.setItem("copay_my_rooms", JSON.stringify(initial));
      return initial;
    };

    const getInitialRoomId = () => {
      const params = new URLSearchParams(window.location.search);
      const urlRoom = params.get("room");
      if (urlRoom) return sanitizeRoomId(urlRoom);
      const rooms = getStoredRooms();
      return rooms[0].id;
    };

    // 圖二 COPAY Logo 元件
    function CopayLogo({ size = "w-9 h-9" }) {
      const [imgErr, setImgErr] = useState(false);
      if (!imgErr) {
        return (
          <img
            src="Copay.png"
            alt="COPAY Logo"
            onError={() => setImgErr(true)}
            className={`${size} rounded-xl object-cover shadow-md border border-white/20`}
          />
        );
      }
      return (
        <div className={`${size} rounded-xl bg-[#2B353E] flex items-center justify-center shadow-md border border-white/20 relative overflow-hidden`}>
          <svg viewBox="0 0 64 64" className="w-4/5 h-4/5">
            <defs>
              <linearGradient id="copayTeal" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#3B7A8C" />
                <stop offset="100%" stopColor="#1F4E5B" />
              </linearGradient>
              <linearGradient id="copayGold" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#FAD074" />
                <stop offset="100%" stopColor="#D99B43" />
              </linearGradient>
            </defs>
            <rect x="28" y="8" width="8" height="48" rx="4" fill="url(#copayTeal)" />
            <path d="M44 21C44 15.5 38.5 12 32 12C25.5 12 20 15.5 20 21C20 26.5 25.5 29 32 31C38.5 33 44 35.5 44 41C44 46.5 38.5 50 32 50C25.5 50 20 46.5 20 41" stroke="url(#copayTeal)" strokeWidth="8" strokeLinecap="round" fill="none" />
            <path d="M33 14C39 14 44 17 45 21" stroke="url(#copayGold)" strokeWidth="7" strokeLinecap="round" fill="none" />
          </svg>
        </div>
      );
    }

    function App() {
      // 帳號與房間清單狀態
      const [myRooms, setMyRooms] = useState(getStoredRooms);
      const [isPro, setIsPro] = useState(() => localStorage.getItem("copay_is_pro") === "true");
      const [showPaywall, setShowPaywall] = useState(false);
      const [pendingAction, setPendingAction] = useState(null);
      const [vipInput, setVipInput] = useState("");
      const [paywallMsg, setPaywallMsg] = useState("");

      // 當前房間 ID (6位亂碼) 與連線狀態
      const [roomId, setRoomId] = useState(getInitialRoomId);
      const [newRoomNameInput, setNewRoomNameInput] = useState("");
      const [joinRoomCodeInput, setJoinRoomCodeInput] = useState("");
      const [syncStatus, setSyncStatus] = useState("connecting");

      // 群組雲端同步資料
      const [groupName, setGroupName] = useState("日常飯局夾錢 🍱");
      const [isEditingGroupName, setIsEditingGroupName] = useState(false);
      const [tempGroupName, setTempGroupName] = useState("");

      // 模式：'daily' (純港幣日常版) | 'triptab' (付費升級 TripTab 旅遊記帳版)
      const [roomMode, setRoomMode] = useState("daily");
      const [members, setMembers] = useState(DEFAULT_MEMBERS);
      const [expenses, setExpenses] = useState([]);
      const [customRates, setCustomRates] = useState({});
      const [paidMap, setPaidMap] = useState({});

      // 【TripTab 公數錢包狀態】記錄每位成員注資咗幾多 HKD 入公數池 { "我": 1000, "Alex": 1000 }
      const [poolContributions, setPoolContributions] = useState({});
      const [poolTopUpAmount, setPoolTopUpAmount] = useState("");
      const [showPoolModal, setShowPoolModal] = useState(false);

      // 編輯單據與刪除確認狀態
      const [editingExpId, setEditingExpId] = useState(null);
      const [editTitle, setEditTitle] = useState("");
      const [editAmount, setEditAmount] = useState("");
      const [deleteConfirmExp, setDeleteConfirmExp] = useState(null);

      // UI 導航狀態
      const [activeTab, setActiveTab] = useState("expenses");
      const [newMemberName, setNewMemberName] = useState("");
      const [liveRates, setLiveRates] = useState(TRIPTAB_RATES);
      const [rateUpdatedText, setRateUpdatedText] = useState("即時匯率");
      const [newCurCode, setNewCurCode] = useState("");
      const [newCurRate, setNewCurRate] = useState("");

      // 新增開支表單輸入
      const [title, setTitle] = useState("");
      const [amount, setAmount] = useState("");
      const [currency, setCurrency] = useState("HKD");
      const [addCardFee, setAddCardFee] = useState(false);
      const [payer, setPayer] = useState("我");
      const [splitWith, setSplitWith] = useState(DEFAULT_MEMBERS);
      const [category, setCategory] = useState("🍱 餐飲美食");
      const [date, setDate] = useState(new Date().toISOString().split("T")[0]);

      const rates = useMemo(() => ({ ...liveRates, ...customRates }), [liveRates, customRates]);

      useEffect(() => {
        localStorage.setItem("copay_my_rooms", JSON.stringify(myRooms));
      }, [myRooms]);

      useEffect(() => {
        localStorage.setItem("copay_is_pro", isPro ? "true" : "false");
      }, [isPro]);

      useEffect(() => {
        if (!roomId || !groupName) return;
        setMyRooms(prev => {
          const exists = prev.some(r => r.id === roomId);
          if (exists) {
            return prev.map(r => r.id === roomId ? { ...r, name: groupName } : r);
          } else {
            return [...prev, { id: roomId, name: groupName }];
          }
        });
      }, [roomId, groupName]);

      // 載入即時匯率
      useEffect(() => {
        fetch("https://open.er-api.com/v6/latest/HKD")
          .then(res => res.json())
          .then(data => {
            if (data && data.rates) {
              const updated = {};
              Object.keys(TRIPTAB_RATES).forEach(cur => {
                if (cur === "HKD") {
                  updated[cur] = 1.0;
                } else if (data.rates[cur]) {
                  updated[cur] = Number((1 / data.rates[cur]).toFixed(5));
                } else {
                  updated[cur] = TRIPTAB_RATES[cur];
                }
              });
              setLiveRates(prev => ({ ...prev, ...updated }));
              setRateUpdatedText(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
            }
          })
          .catch(() => {
            setRateUpdatedText("預設匯率");
          });
      }, []);

      // 監聽當前 Firebase 房間數據
      useEffect(() => {
        setSyncStatus("connecting");
        setIsEditingGroupName(false);
        setEditingExpId(null);

        const url = new URL(window.location);
        url.searchParams.set("room", roomId);
        window.history.replaceState({}, "", url);

        const roomRef = db.ref(`billmate_rooms/${roomId}`);

        const handleValue = (snapshot) => {
          const data = snapshot.val();
          if (data) {
            setGroupName(data.groupName || "日常飯局夾錢 🍱");
            const loadedMode = data.roomMode === "travel" || data.roomMode === "triptab" ? "triptab" : "daily";
            if (loadedMode === "triptab" && isPro) {
              setRoomMode("triptab");
            } else {
              setRoomMode("daily");
              setCurrency("HKD");
              setAddCardFee(false);
              if (payer === POOL_PAYER_KEY) setPayer("我");
            }

            const loadedMembers = Array.isArray(data.members) && data.members.length > 0 ? data.members : DEFAULT_MEMBERS;
            setMembers(loadedMembers);
            setPayer(prev => (prev === POOL_PAYER_KEY || loadedMembers.includes(prev)) ? prev : loadedMembers[0]);
            setSplitWith(prev => {
              const valid = prev.filter(m => loadedMembers.includes(m));
              return valid.length > 0 ? valid : loadedMembers;
            });

            if (data.expenses) {
              const expList = Object.values(data.expenses).sort((a, b) => {
                const dateA = new Date(a.date).getTime();
                const dateB = new Date(b.date).getTime();
                if (dateA !== dateB) return dateB - dateA;
                return (b.id || 0) - (a.id || 0);
              });
              setExpenses(expList);
            } else {
              setExpenses([]);
            }

            setCustomRates(data.customRates || {});
            setPaidMap(data.paidMap || {});
            setPoolContributions(data.poolContributions || {});
          } else {
            const localRoom = myRooms.find(r => r.id === roomId);
            const defaultTitle = localRoom ? localRoom.name : "日常飯局夾錢 🍱";
            const initialRoomData = {
              roomId: roomId,
              groupName: defaultTitle,
              roomMode: "daily",
              members: DEFAULT_MEMBERS,
              expenses: {},
              customRates: {},
              paidMap: {},
              poolContributions: {},
              createdAt: Date.now()
            };
            roomRef.set(initialRoomData);
          }
          setSyncStatus("synced");
        };

        const handleError = () => setSyncStatus("error");

        roomRef.on("value", handleValue, handleError);
        return () => roomRef.off("value", handleValue);
      }, [roomId, isPro]);

      // 金額折合港幣
      const toHKD = (amt, curr) => {
        if (!curr || curr === "HKD") return amt;
        const r = rates[curr] || 1;
        return amt * r;
      };

      const isTripTabActive = isPro && roomMode === "triptab";

      // ==========================================
      // 🏦 【核心防超支計算】公數錢包總額、已用金額及可用餘額 (全部以 HKD 基準嚴格核對)
      // ==========================================
      const poolStats = useMemo(() => {
        // 1. 計算所有人注資入公數錢包嘅總金額 (HKD)
        const totalContributedHKD = members.reduce((sum, m) => {
          return sum + (Number(poolContributions[m]) || 0);
        }, 0);

        // 2. 計算所有由「🏦 公數錢包」支付嘅單據總額 (折合 HKD)
        const totalSpentFromPoolHKD = expenses.reduce((sum, exp) => {
          if (exp.payer === POOL_PAYER_KEY || exp.isPoolExpense) {
            return sum + toHKD(Number(exp.amount), exp.currency);
          }
          return sum;
        }, 0);

        // 3. 公數錢包目前可用餘額 (HKD)
        const remainingPoolHKD = Math.max(0, Number((totalContributedHKD - totalSpentFromPoolHKD).toFixed(2)));
        const rawRemainingHKD = Number((totalContributedHKD - totalSpentFromPoolHKD).toFixed(2));

        return {
          totalContributedHKD,
          totalSpentFromPoolHKD,
          remainingPoolHKD,
          rawRemainingHKD
        };
      }, [members, poolContributions, expenses, rates]);

      // 即時計算當前輸入緊嘅單據折合幾多 HKD，以及如果揀咗「公數錢包」係咪超出餘額
      const currentInputHKD = useMemo(() => {
        const raw = parseFloat(amount);
        if (isNaN(raw) || raw <= 0) return 0;
        const withFee = isTripTabActive && addCardFee ? raw * 1.0195 : raw;
        const curr = isTripTabActive ? currency : "HKD";
        return toHKD(withFee, curr);
      }, [amount, currency, addCardFee, isTripTabActive, rates]);

      // 判斷係咪「揀咗公數錢包支付」而且「輸入金額大過公數餘額」
      const isExceedingPoolBalance = useMemo(() => {
        if (payer !== POOL_PAYER_KEY) return false;
        // 預留 0.5 蚊四捨五入緩衝，只要超過實際餘額即刻攔截
        return currentInputHKD > (poolStats.rawRemainingHKD + 0.05);
      }, [payer, currentInputHKD, poolStats.rawRemainingHKD]);

      // 【公數錢包注資操作】一鍵每人夾同額公數（連防倒扣保護）
      const handleBatchTopUpPool = (e) => {
        e.preventDefault();
        const addAmt = parseFloat(poolTopUpAmount);
        if (isNaN(addAmt) || addAmt <= 0) return;
        const updated = { ...poolContributions };
        members.forEach(m => {
          updated[m] = Number(((Number(updated[m]) || 0) + addAmt).toFixed(2));
        });
        db.ref(`billmate_rooms/${roomId}/poolContributions`).set(updated);
        setPoolTopUpAmount("");
      };

      // 單獨修改某位成員嘅公數注資金額（連防超支倒扣檢查！）
      const handleMemberPoolChange = (memberName, newValStr) => {
        const newVal = Math.max(0, parseFloat(newValStr) || 0);
        const tempContributions = { ...poolContributions, [memberName]: newVal };
        const newTotalPool = members.reduce((sum, m) => sum + (Number(tempContributions[m]) || 0), 0);

        // 【嚴格防超支】如果改細注資額之後，令到公數總額少過「已經洗咗嘅公數」，即刻拒絕！
        if (newTotalPool + 0.05 < poolStats.totalSpentFromPoolHKD) {
          alert(
            `⚠️ 無法調低公數金額！\n\n` +
            `目前公數錢包已經消費咗 HK$ ${Math.round(poolStats.totalSpentFromPoolHKD).toLocaleString()}，` +
            `公數總注資額唔可以少過已消費金額（否則公數會變負數）！\n` +
            `如需調低，請先刪除或修改相關公數單據。`
          );
          return;
        }
        db.ref(`billmate_rooms/${roomId}/poolContributions/${memberName}`).set(newVal);
      };

      // 建立新房間
      const handleCreateNewRoom = (e) => {
        e.preventDefault();
        const customName = newRoomNameInput.trim();
        if (!customName) return;

        const executeCreate = () => {
          const newId = generateRandomRoomId();
          const initialRoomData = {
            roomId: newId,
            groupName: customName,
            roomMode: "daily",
            members: DEFAULT_MEMBERS,
            expenses: {},
            customRates: {},
            paidMap: {},
            poolContributions: {},
            createdAt: Date.now()
          };
          db.ref(`billmate_rooms/${newId}`).set(initialRoomData);
          setMyRooms(prev => [...prev, { id: newId, name: customName }]);
          setRoomId(newId);
          setGroupName(customName);
          setNewRoomNameInput("");
          setActiveTab("expenses");
        };

        if (!isPro && myRooms.length >= FREE_ROOM_QUOTA) {
          setPendingAction(() => executeCreate);
          setPaywallMsg(`免費版支援 ${FREE_ROOM_QUOTA} 個日常房間（目前已使用 ${myRooms.length}/${FREE_ROOM_QUOTA}）。立即升級即可解鎖無限房間 + ✈️ TripTab 旅遊記帳版！`);
          setShowPaywall(true);
          return;
        }

        executeCreate();
      };

      // 用 6 位隨機代碼加入朋友房間
      const handleJoinRoomByCode = (e) => {
        e.preventDefault();
        const cleanCode = sanitizeRoomId(joinRoomCodeInput);
        if (!cleanCode) return;

        if (myRooms.some(r => r.id === cleanCode) || isPro) {
          setRoomId(cleanCode);
          setJoinRoomCodeInput("");
          setActiveTab("expenses");
          return;
        }

        if (myRooms.length >= FREE_ROOM_QUOTA) {
          setPendingAction(() => () => {
            setRoomId(cleanCode);
            setJoinRoomCodeInput("");
            setActiveTab("expenses");
          });
          setPaywallMsg(`免費版最多支援 ${FREE_ROOM_QUOTA} 個活躍房間。升級即可加入無限個朋友房間及開啟 TripTab 旅遊記帳版！`);
          setShowPaywall(true);
        } else {
          setRoomId(cleanCode);
          setJoinRoomCodeInput("");
          setActiveTab("expenses");
        }
      };

      // 切換「日常純港幣版」與「TripTab 旅遊記帳版」
      const handleSwitchToTripTab = (targetMode) => {
        if (targetMode === "triptab" && !isPro) {
          setPendingAction(() => () => {
            setRoomMode("triptab");
            setCurrency("JPY");
            setCategory("🍱 餐飲美食");
            db.ref(`billmate_rooms/${roomId}/roomMode`).set("triptab");
          });
          setPaywallMsg("「✈️ TripTab 旅遊記帳版」屬於付費升級功能！解鎖後即可使用公數錢包管理、15 國旅遊外幣轉換、信用卡 1.95% 手續費計算及無限房間！");
          setShowPaywall(true);
          return;
        }
        setRoomMode(targetMode);
        if (targetMode === "daily") {
          setCurrency("HKD");
          setAddCardFee(false);
          if (payer === POOL_PAYER_KEY) setPayer(members[0] || "我");
        } else {
          setCurrency("JPY");
        }
        db.ref(`billmate_rooms/${roomId}/roomMode`).set(targetMode);
      };

      const openExternalTripTabApp = () => {
        const targetUrl = `${TRIPTAB_APP_URL}?room=${encodeURIComponent(roomId)}`;
        window.open(targetUrl, "_blank");
      };

      const handleUnlockWithCode = (e) => {
        e.preventDefault();
        const code = vipInput.trim().toUpperCase();
        if (VALID_VIP_CODES.includes(code)) {
          setIsPro(true);
          setShowPaywall(false);
          setVipInput("");
          if (pendingAction) {
            pendingAction();
            setPendingAction(null);
          } else {
            setRoomMode("triptab");
            setCurrency("JPY");
            db.ref(`billmate_rooms/${roomId}/roomMode`).set("triptab");
          }
          alert("🎉 驗證成功！已為你開通無限房間 + ✈️ TripTab 旅遊記帳版全部功能！");
        } else {
          alert("❌ 解鎖碼無效！測試可用解鎖碼：COPAY2026 或 TRIPTAB");
        }
      };

      const handleSimulatePurchase = (planName) => {
        setIsPro(true);
        setShowPaywall(false);
        if (pendingAction) {
          pendingAction();
          setPendingAction(null);
        } else {
          setRoomMode("triptab");
          setCurrency("JPY");
          db.ref(`billmate_rooms/${roomId}/roomMode`).set("triptab");
        }
        alert(`🎉 感謝支持！已成功開通【${planName}】，現已為你解鎖無限房間及切換至「✈️ TripTab 旅遊記帳版」！`);
      };

      const saveGroupName = (e) => {
        if (e) e.preventDefault();
        const trimmed = tempGroupName.trim();
        if (trimmed) {
          setGroupName(trimmed);
          db.ref(`billmate_rooms/${roomId}/groupName`).set(trimmed);
        }
        setIsEditingGroupName(false);
      };

      const multiplyAmount = (factor) => {
        const val = parseFloat(amount);
        if (isNaN(val) || val <= 0) return;
        setAmount(String(Number((val * factor).toFixed(2))));
      };

      // ==========================================
      // 🛡️ 【防超支關卡 1】新增開支時嚴格檢查公數錢包餘額
      // ==========================================
      const handleAddExpense = (e) => {
        e.preventDefault();
        if (!title || !amount || splitWith.length === 0 || !date) return;

        const isTripTabMode = isPro && roomMode === "triptab";
        const rawAmt = parseFloat(amount);
        if (isNaN(rawAmt) || rawAmt <= 0) return;

        const finalAmt = isTripTabMode && addCardFee ? Number((rawAmt * 1.0195).toFixed(2)) : rawAmt;
        const finalCurrency = isTripTabMode ? currency : "HKD";
        const expenseHKD = toHKD(finalAmt, finalCurrency);

        // 如果揀咗「🏦 公數錢包」出錢，檢查公數餘額夠唔夠俾！
        if (payer === POOL_PAYER_KEY) {
          if (poolStats.totalContributedHKD <= 0) {
            alert(
              `⚠️ 公數錢包目前餘額為 HK$ 0！\n\n` +
              `請先撳上面「🏦 管理公數 / 注資」入錢落公數錢包，或者改揀個人墊支。`
            );
            setShowPoolModal(true);
            return;
          }

          if (expenseHKD > poolStats.rawRemainingHKD + 0.05) {
            const diffHKD = (expenseHKD - poolStats.remainingPoolHKD).toFixed(1);
            alert(
              `🚫 拒絕記帳：公數錢包餘額不足！\n\n` +
              `• 今筆單據折合：HK$ ${expenseHKD.toFixed(1)}\n` +
              `• 公數目前只剩：HK$ ${poolStats.remainingPoolHKD.toFixed(1)}\n` +
              `• 尚欠差額：HK$ ${diffHKD}\n\n` +
              `💡 解決方法：請先撳「🏦 公數加碼注資」，或者改由個人墊支呢筆單據！`
            );
            return;
          }
        }

        const id = Date.now();
        const newExp = {
          id,
          title: isTripTabMode && addCardFee ? `${title.trim()} (連1.95%卡費)` : title.trim(),
          amount: finalAmt,
          currency: finalCurrency,
          payer,
          isPoolExpense: payer === POOL_PAYER_KEY,
          splitWith,
          category,
          date
        };
        db.ref(`billmate_rooms/${roomId}/expenses/${id}`).set(newExp);
        setTitle("");
        setAmount("");
        setAddCardFee(false);
      };

      // ==========================================
      // 🛡️ 【防超支關卡 2】修改單據金額時，如果係公數單據，嚴格檢查會唔會改大到爆煲
      // ==========================================
      const saveEditExpense = (exp) => {
        const trimmedTitle = editTitle.trim();
        const parsedAmt = parseFloat(editAmount);
        if (!trimmedTitle || isNaN(parsedAmt) || parsedAmt <= 0) return;

        // 如果呢筆單原本係「公數錢包」出錢，檢查修改後嘅新金額會唔會超過（現有餘額 + 原本單據金額）
        if (exp.payer === POOL_PAYER_KEY || exp.isPoolExpense) {
          const oldHKD = toHKD(Number(exp.amount), exp.currency);
          const newHKD = toHKD(parsedAmt, exp.currency);
          const availableForThisEditHKD = poolStats.rawRemainingHKD + oldHKD;

          if (newHKD > availableForThisEditHKD + 0.05) {
            alert(
              `🚫 無法儲存修改：修改後金額超出公數錢包上限！\n\n` +
              `• 修改後折合：HK$ ${newHKD.toFixed(1)}\n` +
              `• 公數最多可負擔：HK$ ${Math.max(0, availableForThisEditHKD).toFixed(1)}\n\n` +
              `請先為公數錢包加碼注資，或輸入較細嘅金額。`
            );
            return;
          }
        }

        db.ref(`billmate_rooms/${roomId}/expenses/${exp.id}`).update({
          title: trimmedTitle,
          amount: parsedAmt
        });
        setEditingExpId(null);
      };

      // 確認刪除單據
      const confirmDeleteExpense = () => {
        if (!deleteConfirmExp) return;
        db.ref(`billmate_rooms/${roomId}/expenses/${deleteConfirmExp.id}`).remove();
        setDeleteConfirmExp(null);
      };

      const handleAddMember = () => {
        const name = newMemberName.trim();
        if (!name || members.includes(name) || name === POOL_PAYER_KEY) return;
        if (!isPro && members.length >= 4) {
          setPaywallMsg("免費日常版每個房間最多支援 4 位成員。升級即可解鎖無限人數 + ✈️ TripTab 旅遊記帳版！");
          setShowPaywall(true);
          return;
        }
        const updated = [...members, name];
        db.ref(`billmate_rooms/${roomId}/members`).set(updated);
        setSplitWith(updated);
        setNewMemberName("");
      };

      const handleRemoveMember = (name) => {
        if (members.length <= 2) return;
        const updated = members.filter(x => x !== name);
        db.ref(`billmate_rooms/${roomId}/members`).set(updated);
      };

      const handleRateChange = (cur, val) => {
        const num = parseFloat(val);
        if (isNaN(num) || num <= 0) return;
        db.ref(`billmate_rooms/${roomId}/customRates/${cur}`).set(num);
      };

      const handleAddCustomCurrency = (e) => {
        e.preventDefault();
        const code = newCurCode.trim().toUpperCase();
        const rateVal = parseFloat(newCurRate);
        if (code.length !== 3 || isNaN(rateVal) || rateVal <= 0) return;
        db.ref(`billmate_rooms/${roomId}/customRates/${code}`).set(rateVal);
        setCurrency(code);
        setNewCurCode("");
        setNewCurRate("");
      };

      const toggleSettlementPaid = (txKey) => {
        const current = !!paidMap[txKey];
        db.ref(`billmate_rooms/${roomId}/paidMap/${txKey}`).set(!current);
      };

      const resetAllPaidStatus = () => {
        db.ref(`billmate_rooms/${roomId}/paidMap`).remove();
      };

      const totalHKD = useMemo(() => {
        return expenses.reduce((acc, exp) => acc + toHKD(Number(exp.amount), exp.currency), 0);
      }, [expenses, rates]);

      // 結算計算（同時整合個人墊支 + 公數錢包注資與消費分攤）
      const settlement = useMemo(() => {
        const balances = {};
        members.forEach(m => {
          // 如果喺 TripTab 模式有夾公數，成員預先夾落公數池嘅錢計入佢嘅「已付出額 (+credit)」
          const poolPaid = isTripTabActive ? (Number(poolContributions[m]) || 0) : 0;
          balances[m] = poolPaid;
        });

        expenses.forEach(exp => {
          const hkdAmount = toHKD(Number(exp.amount), exp.currency);
          const validSplits = (exp.splitWith || []).filter(p => balances[p] !== undefined);
          if (validSplits.length === 0) return;

          // 如果是日常模式，略過公數注資；但若單據係個人墊支，照常計入墊支者 credit
          if (exp.payer !== POOL_PAYER_KEY && !exp.isPoolExpense) {
            if (balances[exp.payer] !== undefined) {
              balances[exp.payer] += hkdAmount;
            }
          } else if (!isTripTabActive) {
            // 如果切換返日常模式，公數單據唔影響個人墊支差額
            return;
          }

          const share = hkdAmount / validSplits.length;
          validSplits.forEach(p => {
            balances[p] -= share;
          });
        });

        // 如果喺 TripTab 模式，公數錢包仲有剩錢（未洗晒），按成員注資比例喺結算帳面退回計算
        if (isTripTabActive && poolStats.remainingPoolHKD > 0 && poolStats.totalContributedHKD > 0) {
          members.forEach(m => {
            const myContrib = Number(poolContributions[m]) || 0;
            const myRefundShare = (myContrib / poolStats.totalContributedHKD) * poolStats.remainingPoolHKD;
            // 剩低喺公數銀包未洗嘅錢屬於佢自己，扣除已預支 credit 等於只計實際洗咗嗰部分
            balances[m] -= myRefundShare;
          });
        }

        const debtors = [];
        const creditors = [];
        Object.keys(balances).forEach(m => {
          const val = Math.round(balances[m]);
          if (val < -1) debtors.push({ name: m, amount: -val });
          else if (val > 1) creditors.push({ name: m, amount: val });
        });

        debtors.sort((a, b) => b.amount - a.amount);
        creditors.sort((a, b) => b.amount - a.amount);

        const transactions = [];
        let i = 0, j = 0;
        while (i < debtors.length && j < creditors.length) {
          const deb = debtors[i];
          const cred = creditors[j];
          const settleAmt = Math.min(deb.amount, cred.amount);
          const fromName = deb.name;
          const toName = cred.name;
          const txKey = `${fromName}_TO_${toName}`.replace(/[.#$\[\]\/]/g, "_");
          transactions.push({
            key: txKey,
            from: fromName,
            to: toName,
            amount: Math.round(settleAmt)
          });
          deb.amount -= settleAmt;
          cred.amount -= settleAmt;
          if (deb.amount === 0) i++;
          if (cred.amount === 0) j++;
        }
        return { balances, transactions };
      }, [expenses, members, rates, poolContributions, isTripTabActive, poolStats]);

      const shareRoomLink = () => {
        const shareUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(roomId)}`;
        const msg = `💰 一齊用 COPAY 夾錢記帳：「${groupName}」\n🔑 房間代碼：${roomId}\n👉 直接撳連結進入房間：\n${shareUrl}`;
        navigator.clipboard.writeText(msg);
        alert(`已複製邀請連結！\n房間名稱：${groupName}\n專屬代碼：${roomId}\n直接貼去 WhatsApp 群組，朋友一撳即入房 📲`);
      };

      const copyToWhatsApp = () => {
        const badge = isTripTabActive ? "COPAY × TripTab 旅遊版" : "COPAY 日常夾錢";
        let text = `💰【${badge} · ${groupName}】結算清單 📊\n`;
        text += `房間代碼：#${roomId} ｜ 總開支：HK$ ${Math.round(totalHKD).toLocaleString()}\n`;
        if (isTripTabActive && poolStats.totalContributedHKD > 0) {
          text += `🏦 公數總注資：HK$ ${Math.round(poolStats.totalContributedHKD).toLocaleString()} ｜ 公數結餘：HK$ ${Math.round(poolStats.remainingPoolHKD).toLocaleString()}\n`;
        }
        text += `------------------------\n`;
        text += `【過數指引 / FPS / PayMe】：\n`;
        if (settlement.transactions.length === 0) {
          text += `✅ 大家帳目已平衡，互不相欠！\n`;
        } else {
          settlement.transactions.forEach(t => {
            const isPaid = !!paidMap[t.key];
            if (isPaid) {
              text += `✅ [已付清] ${t.from} 過數 HK$ ${t.amount.toLocaleString()} 畀 ${t.to}\n`;
            } else {
              text += `⭕ [待過數] ${t.from} 需過數 HK$ ${t.amount.toLocaleString()} 畀 ${t.to}\n`;
            }
          });
        }
        text += `------------------------\n`;
        text += `大家過咗數記得喺 COPAY 撳「標記已付」！🍻`;
        navigator.clipboard.writeText(text);
        alert("已複製 WhatsApp 結算清單（包含已付/未付狀態）！📲");
      };

      const categoryOptions = isTripTabActive
        ? ["🍱 餐飲美食", "🚗 交通租車", "🏨 住宿酒店", "🎟️ 門票活動", "🛍️ 購物手信", "✈️ 機票保險", "💡 其他雜費"]
        : ["🍱 食飯埋單", "🛒 超市買餸", "🏠 夾租水電", "🏸 唱K打波", "🚕 的士車費", "📦 網購團購", "💡 其他雜費"];

      const paidCount = settlement.transactions.filter(t => !!paidMap[t.key]).length;

      return (
        <div className="max-w-md mx-auto min-h-screen volo-bg flex flex-col pb-28 shadow-2xl relative overflow-x-hidden">
          
          {/* 頂部導航欄 + Hero 歡迎區 */}
          <div className="p-6 pb-4 relative z-10">
            <div className="flex justify-between items-center mb-5">
              <div className="flex items-center gap-2.5">
                <CopayLogo size="w-9 h-9" />
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="font-black tracking-wider text-lg text-[#1C2830] drop-shadow-sm leading-none">COPAY</span>
                    {isTripTabActive && (
                      <span className="text-[9px] bg-[#1C2830] text-amber-300 px-2 py-0.5 rounded-md font-black">
                        × TripTab ✈️
                      </span>
                    )}
                  </div>
                  <span className="text-[10px] font-bold text-[#2F4350]">
                    {isTripTabActive ? "旅遊多幣種 + 公數錢包模式" : "香港人日常純港幣記帳"}
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                {isPro ? (
                  <button
                    onClick={() => handleSwitchToTripTab(roomMode === "daily" ? "triptab" : "daily")}
                    className={`text-[10px] px-3 py-1.5 rounded-full font-black tracking-wide shadow-sm transition ${
                      isTripTabActive
                        ? "gold-pill text-[#1C2830]"
                        : "bg-[#1C2830]/80 text-amber-300 border border-amber-300/40"
                    }`}
                  >
                    {isTripTabActive ? "✈️ TripTab 旅遊版中" : "🔄 切換 TripTab 旅遊版"}
                  </button>
                ) : (
                  <button
                    onClick={() => {
                      setPaywallMsg("免費版支援 2 個日常港幣房間。立即升級即可解鎖無限房間 + ✈️ TripTab 旅遊記帳版（支援公數錢包、外幣、信用卡手續費）！");
                      setShowPaywall(true);
                    }}
                    className="text-[10px] bg-[#1C2830]/80 hover:bg-[#1C2830] text-amber-300 px-3 py-1.5 rounded-full font-bold backdrop-blur-md transition shadow-sm border border-amber-300/30"
                  >
                    免費 {myRooms.length}/{FREE_ROOM_QUOTA} 房 · 升級旅遊版 ✈️
                  </button>
                )}
              </div>
            </div>

            {/* Hero 標題區 */}
            <div className="space-y-1.5 mb-4">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-[11px] bg-[#1C2830]/75 text-white px-2.5 py-0.5 rounded-full font-mono font-bold flex items-center gap-1.5 backdrop-blur-md">
                  <span className={`w-2 h-2 rounded-full ${syncStatus === 'synced' ? 'bg-emerald-400' : syncStatus === 'connecting' ? 'bg-amber-300 animate-ping' : 'bg-rose-400'}`}></span>
                  房號 #{roomId}
                </span>
                <span className="text-[11px] bg-white/40 text-[#1C2830] px-2.5 py-0.5 rounded-full font-bold backdrop-blur-md">
                  {isTripTabActive ? "✈️ TripTab 旅遊版" : "🇭🇰 純港幣日常版 (HK$)"}
                </span>
                {isTripTabActive && (
                  <span className="text-[10px] text-[#1C2830]/80 font-bold">匯率更新 {rateUpdatedText}</span>
                )}
              </div>

              {isEditingGroupName ? (
                <form onSubmit={saveGroupName} className="flex items-center gap-2 pt-1">
                  <input
                    type="text"
                    value={tempGroupName}
                    onChange={e => setTempGroupName(e.target.value)}
                    placeholder="輸入房間名稱..."
                    autoFocus
                    className="flex-1 bg-white/90 text-[#1C2830] font-extrabold text-xl px-3.5 py-1.5 rounded-2xl focus:outline-none shadow-md"
                  />
                  <button type="submit" className="teal-pill text-white text-xs font-bold px-3.5 py-2.5 rounded-xl">
                    儲存
                  </button>
                  <button type="button" onClick={() => setIsEditingGroupName(false)} className="bg-black/30 text-white text-xs font-bold px-3 py-2.5 rounded-xl">
                    取消
                  </button>
                </form>
              ) : (
                <div className="pt-0.5">
                  <div className="text-xs font-extrabold tracking-widest uppercase text-[#2C4452]">
                    {isTripTabActive ? "TRIPTAB TRAVEL MODE" : "WELCOME TO COPAY HK"}
                  </div>
                  <div className="flex items-center justify-between gap-2">
                    <h1
                      onClick={() => {
                        setTempGroupName(groupName);
                        setIsEditingGroupName(true);
                      }}
                      className="text-3xl font-black tracking-tight text-white drop-shadow-[0_2px_10px_rgba(0,0,0,0.35)] cursor-pointer hover:opacity-90 leading-tight"
                    >
                      {groupName}
                    </h1>
                    <button
                      type="button"
                      onClick={() => {
                        setTempGroupName(groupName);
                        setIsEditingGroupName(true);
                      }}
                      className="text-[11px] bg-black/25 hover:bg-black/40 text-white px-2.5 py-1 rounded-full font-bold backdrop-blur-md whitespace-nowrap border border-white/20"
                    >
                      ✏️ 改名
                    </button>
                  </div>
                </div>
              )}
            </div>

            {/* 快捷按鈕列 */}
            <div className="flex items-center justify-between gap-3 pt-1">
              <button
                onClick={shareRoomLink}
                className="teal-pill text-white font-bold text-xs px-5 py-3 rounded-full flex items-center gap-2 hover:opacity-95 active:scale-95 transition"
              >
                <span>🔗 邀請朋友入房 (#{roomId})</span>
              </button>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setActiveTab("rooms")}
                  title="切換或新增房間"
                  className="w-10 h-10 rounded-full glass-light flex items-center justify-center text-sm shadow-sm hover:bg-white/40 transition"
                >
                  🔑
                </button>
                <button
                  onClick={() => handleSwitchToTripTab(isTripTabActive ? "daily" : "triptab")}
                  title="切換日常 / TripTab 旅遊版"
                  className={`px-3 h-10 rounded-full flex items-center gap-1 text-xs font-bold shadow-sm transition ${
                    isTripTabActive ? "gold-pill text-[#1C2830]" : "glass-light text-[#1C2830] hover:bg-white/40"
                  }`}
                >
                  <span>✈️</span>
                  <span>{isTripTabActive ? "旅遊版" : "去旅行"}</span>
                </button>
              </div>
            </div>

            {/* 總開支與 TripTab 公數錢包雙欄摘要卡 */}
            <div className="mt-4 glass-dark p-4 rounded-3xl space-y-3">
              <div className="flex justify-between items-end">
                <div>
                  <p className="text-[11px] text-slate-300 mb-0.5">
                    {isTripTabActive ? "旅程總開支折合 (HKD)" : "日常總開支 (港幣 HK$)"}
                  </p>
                  <p className="text-3xl font-black tracking-tight text-white">HK$ {Math.round(totalHKD).toLocaleString()}</p>
                </div>
                <div className="text-right">
                  <p className="text-[11px] text-slate-300 mb-0.5">參與成員</p>
                  <p className="text-base font-bold text-[#78C3D2]">{members.length} {!isPro && "/ 4"} 人</p>
                </div>
              </div>

              {/* TripTab 旅遊版專屬：公數錢包即時餘額進度條（杜絕負數超支） */}
              {isTripTabActive && (
                <div className="pt-3 border-t border-white/10">
                  <div className="flex justify-between items-center mb-1.5">
                    <div className="flex items-center gap-1.5">
                      <span className="text-xs font-bold text-amber-300">🏦 公數錢包可用餘額</span>
                      <span className="text-[10px] bg-white/10 px-2 py-0.5 rounded-full text-slate-300">
                        已用 HK$ {Math.round(poolStats.totalSpentFromPoolHKD).toLocaleString()} / 總額 HK$ {Math.round(poolStats.totalContributedHKD).toLocaleString()}
                      </span>
                    </div>
                    <button
                      type="button"
                      onClick={() => setShowPoolModal(true)}
                      className="text-[10px] gold-pill text-[#1C2830] font-black px-2.5 py-1 rounded-full hover:opacity-90"
                    >
                      ＋ 注資 / 管理公數
                    </button>
                  </div>

                  <div className="flex items-center justify-between gap-3">
                    <div className="flex-1 h-2 bg-black/40 rounded-full overflow-hidden">
                      <div
                        className={`h-full transition-all duration-300 ${
                          poolStats.remainingPoolHKD <= 0 ? "bg-rose-500" : "bg-gradient-to-r from-emerald-400 to-amber-300"
                        }`}
                        style={{

                            setActiveTab("expenses");
                          }}
                          className={`w-full p-3.5 rounded-2xl border text-left flex justify-between items-center transition ${
                            isCurrent
                              ? "bg-[#3A8899]/40 border-[#78C3D2] text-white shadow-md"
                              : "bg-white/5 border-white/10 text-slate-200 hover:bg-white/10"
                          }`}
                        >
                          <div>
                            <div className="font-bold text-sm flex items-center gap-2">
                              {isCurrent && <span className="w-2 h-2 rounded-full bg-emerald-400"></span>}
                              <span>{r.name}</span>
                            </div>
                            <div className="text-[11px] text-slate-300 font-mono mt-0.5">
                              房間代碼：#{r.id}
                            </div>
                          </div>
                          <span className="text-xs font-bold px-3 py-1 rounded-full bg-white/10">
                            {isCurrent ? "使用中" : "切換"}
                          </span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: 設定與 TripTab 旅遊版專區 */}
            {activeTab === "settings" && (
              <div className="space-y-4">
                <div className="glass-dark p-5 rounded-3xl space-y-3 border border-amber-300/30">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-white text-sm flex items-center gap-1.5">
                      <span>✈️ TripTab 旅遊記帳版</span>
                      {isPro && <span className="text-[10px] bg-amber-300 text-slate-900 px-2 py-0.5 rounded-full font-black">已解鎖</span>}
                    </h3>
                  </div>
                  <p className="text-[11px] text-slate-300 leading-relaxed">
                    COPAY 日常版專為香港人純港幣 (HK$) 記帳設計；去旅行時升級切換至 <strong>TripTab 旅遊記帳版</strong>，即可啟用公數錢包、外幣匯率轉換、信用卡 1.95% 手續費及唱錢匯率鎖定功能！
                  </p>
                  <div className="grid grid-cols-2 gap-2.5 pt-1">
                    <button
                      type="button"
                      onClick={() => handleSwitchToTripTab("daily")}
                      className={`p-3 rounded-2xl border text-left transition ${!isTripTabActive ? 'bg-[#3A8899]/40 border-[#78C3D2] text-white' : 'bg-white/5 border-white/10 text-slate-300'}`}
                    >
                      <div className="font-bold text-xs mb-0.5">🇭🇰 COPAY 日常版</div>
                      <div className="text-[10px] opacity-80">純港幣 HK$ · 飯局夾租</div>
                    </button>
                    <button
                      type="button"
                      onClick={() => handleSwitchToTripTab("triptab")}
                      className={`p-3 rounded-2xl border text-left transition ${isTripTabActive ? 'bg-amber-400/25 border-amber-300 text-white' : 'bg-white/5 border-white/10 text-slate-300'}`}
                    >
                      <div className="font-bold text-xs mb-0.5 flex items-center justify-between">
                        <span>✈️ TripTab 旅遊版</span>
                        {!isPro && <span>🔒</span>}
                      </div>
                      <div className="text-[10px] opacity-80">公數錢包 · 15國貨幣</div>
                    </button>
                  </div>

                  <div className="pt-2 border-t border-white/10 flex items-center justify-between">
                    <span className="text-[11px] text-slate-300">想用獨立版 TripTab 介面？</span>
                    <button
                      type="button"
                      onClick={openExternalTripTabApp}
                      className="text-xs font-bold text-amber-300 hover:underline flex items-center gap-1"
                    >
                      <span>🔗 連去 TripTab 並同步此房間 (#{roomId})</span>
                    </button>
                  </div>
                </div>

                {/* 參與成員管理 */}
                <div className="glass-dark p-5 rounded-3xl space-y-3.5">
                  <div className="flex justify-between items-center border-b border-white/10 pb-2.5">
                    <h3 className="font-bold text-white text-sm">👥 參與成員 ({members.length}人)</h3>
                    {!isPro && <span className="text-[10px] text-slate-300">免費版上限 4 人</span>}
                  </div>
                  <div className="flex gap-2">
                    <input type="text" placeholder="新增成員名字" value={newMemberName} onChange={e => setNewMemberName(e.target.value)} className="flex-1 text-sm bg-white/10 border border-white/15 rounded-2xl px-4 py-2.5 text-white placeholder-slate-400 focus:outline-none" />
                    <button onClick={handleAddMember} className="teal-pill text-white text-xs font-bold px-5 rounded-2xl">新增</button>
                  </div>
                  <div className="flex flex-wrap gap-2 pt-1">
                    {members.map(m => (
                      <span key={m} className="bg-white/10 border border-white/15 text-white text-xs px-3 py-1.5 rounded-xl font-medium flex items-center gap-2">
                        {m}
                        {members.length > 2 && <button onClick={() => handleRemoveMember(m)} className="text-slate-300 hover:text-rose-300 font-bold text-sm leading-none">×</button>}
                      </span>
                    ))}
                  </div>
                </div>

                {/* TripTab 旅遊版專屬：唱錢匯率鎖定設定 */}
                {isTripTabActive && (
                  <div className="glass-dark p-5 rounded-3xl space-y-3.5 border border-amber-300/30">
                    <div className="flex justify-between items-center border-b border-white/10 pb-2.5">
                      <div>
                        <h3 className="font-bold text-amber-300 text-sm">💱 TripTab 唱錢匯率鎖定 (兌 HKD)</h3>
                        <p className="text-[10px] text-slate-300 mt-0.5">可輸入找換店實際唱錢匯率，全團統一計數零誤差</p>
                      </div>
                    </div>
                    <form onSubmit={handleAddCustomCurrency} className="flex gap-2 bg-white/5 p-2 rounded-2xl">
                      <input type="text" maxLength="3" placeholder="代號 (NZD)" value={newCurCode} onChange={e => setNewCurCode(e.target.value.toUpperCase())} className="w-24 text-xs bg-white/10 rounded-xl px-2 py-2 font-mono uppercase text-center text-white placeholder-slate-400 focus:outline-none" />
                      <input type="number" step="any" placeholder="兌港幣匯率" value={newCurRate} onChange={e => setNewCurRate(e.target.value)} className="flex-1 text-xs bg-white/10 rounded-xl px-3 py-2 text-white placeholder-slate-400 focus:outline-none" />
                      <button type="submit" className="gold-pill text-[#1C2830] text-xs font-black px-3 rounded-xl">＋加入</button>
                    </form>
                    <div className="grid grid-cols-2 gap-2.5 pt-1">
                      {Object.keys(rates).filter(c => c !== "HKD").map(cur => (
                        <div key={cur} className="flex justify-between items-center p-2.5 bg-white/5 rounded-2xl border border-white/10">
                          <span className="font-bold text-slate-200 text-xs pl-1">{cur}</span>
                          <input type="number" step="0.0001" value={rates[cur]} onChange={e => handleRateChange(cur, e.target.value)} className="w-20 text-right bg-black/30 rounded-lg px-2 py-1 font-mono font-bold text-xs text-amber-300 focus:outline-none" />
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* 底部 4 格方形磨砂玻璃導航欄 */}
          <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto px-5 pb-4 pt-2 z-40 bg-gradient-to-t from-[#141C22] via-[#141C22]/90 to-transparent">
            <div className="grid grid-cols-4 gap-2.5">
              <button
                onClick={() => setActiveTab("expenses")}
                className={`py-2.5 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 transition-all ${
                  activeTab === "expenses" ? "nav-square-active text-white scale-105" : "nav-square text-slate-300 hover:text-white"
                }`}
              >
                <span className="text-base leading-none">📝</span>
                <span className="text-[10px] font-bold tracking-tight">記帳明細</span>
              </button>

              <button
                onClick={() => setActiveTab("settle")}
                className={`py-2.5 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 transition-all ${
                  activeTab === "settle" ? "nav-square-active text-white scale-105" : "nav-square text-slate-300 hover:text-white"
                }`}
              >
                <span className="text-base leading-none">⚡</span>
                <span className="text-[10px] font-bold tracking-tight">
                  結算 {settlement.transactions.length > 0 ? `(${paidCount}/${settlement.transactions.length})` : ""}
                </span>
              </button>

              <button
                onClick={() => setActiveTab("rooms")}
                className={`py-2.5 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 transition-all ${
                  activeTab === "rooms" ? "nav-square-active text-white scale-105" : "nav-square text-slate-300 hover:text-white"
                }`}
              >
                <span className="text-base leading-none">🔑</span>
                <span className="text-[10px] font-bold tracking-tight">房間代碼</span>
              </button>

              <button
                onClick={() => setActiveTab("settings")}
                className={`py-2.5 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 transition-all ${
                  activeTab === "settings" ? "nav-square-active text-white scale-105" : "nav-square text-slate-300 hover:text-white"
                }`}
              >
                <span className="text-base leading-none">✈️</span>
                <span className="text-[10px] font-bold tracking-tight">旅遊版/設定</span>
              </button>
            </div>
          </div>

          {/* 🏦 公數錢包管理彈窗 (Pool Money Modal - 內置防倒扣檢查) */}
          {showPoolModal && (
            <div className="fixed inset-0 bg-black/65 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-dark max-w-sm w-full rounded-[2rem] p-6 shadow-2xl space-y-4 border border-amber-300/40">
                <div className="flex justify-between items-start">
                  <div>
                    <h3 className="font-black text-base text-amber-300">🏦 公數錢包管理 (Common Pool)</h3>
                    <p className="text-[11px] text-slate-300 mt-0.5">
                      系統已啟用防超支保護：公數消費絕不能多於可用餘額
                    </p>
                  </div>
                  <button onClick={() => setShowPoolModal(false)} className="text-slate-300 hover:text-white text-xl font-bold leading-none">×</button>
                </div>

                <div className="bg-white/5 border border-white/10 rounded-2xl p-3.5 grid grid-cols-3 gap-2 text-center">
                  <div>
                    <div className="text-[10px] text-slate-300">總注資 (HK$)</div>
                    <div className="font-black text-sm text-white">{Math.round(poolStats.totalContributedHKD).toLocaleString()}</div>
                  </div>
                  <div>
                    <div className="text-[10px] text-slate-300">已消費 (HK$)</div>
                    <div className="font-black text-sm text-amber-300">{Math.round(poolStats.totalSpentFromPoolHKD).toLocaleString()}</div>
                  </div>
                  <div>
                    <div className="text-[10px] text-slate-300">可用餘額 (HK$)</div>
                    <div className="font-black text-sm text-emerald-300">{poolStats.remainingPoolHKD.toLocaleString()}</div>
                  </div>
                </div>

                {/* 一鍵全體成員每人加碼注資 */}
                <form onSubmit={handleBatchTopUpPool} className="space-y-1.5">
                  <label className="block text-[10px] text-slate-300 font-bold">⚡ 全體成員每人一鍵加碼夾公數 (HKD)</label>
                  <div className="flex gap-2">
                    <input
                      type="number"
                      step="any"
                      placeholder="例如每人夾 1000"
                      value={poolTopUpAmount}
                      onChange={e => setPoolTopUpAmount(e.target.value)}
                      className="flex-1 text-xs bg-white/10 border border-white/15 rounded-xl px-3 py-2.5 text-white font-bold focus:outline-none"
                    />
                    <button type="submit" className="gold-pill text-[#1C2830] text-xs font-black px-3.5 py-2.5 rounded-xl whitespace-nowrap">
                      ＋ 每人加碼
                    </button>
                  </div>
                </form>

                {/* 各成員個別累計注資明細 */}
                <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                  <div className="text-[10px] text-slate-300 font-bold">各成員累計已夾公數金額 (HKD)：</div>
                  {members.map(m => (
                    <div key={m} className="flex justify-between items-center bg-white/5 px-3 py-2 rounded-xl border border-white/10">
                      <span className="text-xs font-bold text-white">{m}</span>
                      <div className="flex items-center gap-1.5">
                        <span className="text-[10px] text-slate-400">HK$</span>
                        <input
                          type="number"
                          step="any"
                          value={poolContributions[m] || 0}
                          onChange={e => handleMemberPoolChange(m, e.target.value)}
                          className="w-24 text-right bg-black/40 rounded-lg px-2 py-1 font-mono font-bold text-xs text-amber-300 focus:outline-none"
                        />
                      </div>
                    </div>
                  ))}
                </div>

                <button
                  type="button"
                  onClick={() => setShowPoolModal(false)}
                  className="w-full py-2.5 rounded-2xl teal-pill text-white text-xs font-bold"
                >
                  完成並返回記帳
                </button>
              </div>
            </div>
          )}

          {/* 刪除單據雙重確認彈窗 */}
          {deleteConfirmExp && (
            <div className="fixed inset-0 bg-black/65 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-dark max-w-xs w-full rounded-3xl p-6 text-center space-y-4 border border-white/20">
                <div className="w-12 h-12 rounded-full bg-rose-500/20 border border-rose-400/30 flex items-center justify-center mx-auto text-2xl">
                  🗑️
                </div>
                <div className="space-y-1">
                  <h3 className="font-black text-base text-white">確定要刪除呢筆單據？</h3>
                  <p className="text-xs text-slate-300">
                    「<span className="font-bold text-amber-300">{deleteConfirmExp.title}</span>」
                    ({(!deleteConfirmExp.currency || deleteConfirmExp.currency === "HKD") ? "HK$" : deleteConfirmExp.currency} {Number(deleteConfirmExp.amount).toLocaleString()})
                  </p>
                  <p className="text-[11px] text-slate-400">刪除後所有成員嘅夾錢結算會即時重新計算。</p>
                </div>
                <div className="flex gap-2.5 pt-1">
                  <button
                    type="button"
                    onClick={() => setDeleteConfirmExp(null)}
                    className="flex-1 py-2.5 rounded-2xl bg-white/15 hover:bg-white/25 text-white text-xs font-bold transition"
                  >
                    取消
                  </button>
                  <button
                    type="button"
                    onClick={confirmDeleteExpense}
                    className="flex-1 py-2.5 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold shadow-lg transition"
                  >
                    確定刪除
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 升級 COPAY Pro × TripTab 旅遊記帳版彈窗 */}
          {showPaywall && (
            <div className="fixed inset-0 bg-black/65 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-dark max-w-sm w-full rounded-[2rem] p-6 shadow-2xl space-y-4 border border-amber-300/30">
                <div className="flex justify-between items-start">
                  <div className="flex items-center gap-2.5">
                    <CopayLogo size="w-9 h-9" />
                    <div>
                      <h2 className="font-black text-base text-white">升級 COPAY Pro × TripTab</h2>
                      <p className="text-[11px] text-amber-300 font-bold">無限日常房間 ＋ 完整 TripTab 旅遊記帳版</p>
                    </div>
                  </div>
                  <button onClick={() => setShowPaywall(false)} className="text-slate-300 hover:text-white text-xl font-bold leading-none">×</button>
                </div>

                <div className="bg-amber-500/20 border border-amber-300/30 p-3 rounded-2xl text-xs text-amber-200 leading-relaxed">
                  {paywallMsg}
                </div>

                <div className="space-y-2 text-xs text-slate-200 bg-white/5 p-3.5 rounded-2xl border border-white/10">
                  <div className="flex items-center gap-2"><span>🔓</span> <strong>無限個日常與旅遊房間</strong>（打破免費 2 個限制）</div>
                  <div className="flex items-center gap-2"><span>🏦</span> <strong>公數錢包管理 (防超支保護)</strong> ＋ 自動退回結餘</div>
                  <div className="flex items-center gap-2"><span>✈️</span> <strong>解鎖 TripTab 旅遊記帳版面</strong>（15國貨幣即時轉港幣）</div>
                  <div className="flex items-center gap-2"><span>💳</span> <strong>信用卡 +1.95% 手續費 & 唱錢匯率鎖定</strong></div>
                </div>

                <div className="grid grid-cols-2 gap-2.5 pt-1">
                  <button
                    type="button"
                    onClick={() => handleSimulatePurchase("單次 TripTab 旅遊通行證 HK$28")}
                    className="p-3 rounded-2xl border border-amber-300/50 bg-white/10 text-left hover:bg-white/20 transition"
                  >
                    <div className="text-[10px] font-bold text-amber-300">單次旅行買斷</div>
                    <div className="text-base font-black text-white">HK$ 28</div>
                    <div className="text-[10px] text-slate-300">解鎖 TripTab 旅遊版</div>
                  </button>
                  <button
                    type="button"
                    onClick={() => handleSimulatePurchase("COPAY × TripTab 無限版 HK$18/月")}
                    className="p-3 rounded-2xl gold-pill text-[#1C2830] text-left transition relative overflow-hidden"
                  >
                    <div className="text-[10px] font-black text-[#1C2830]">最抵玩 🔥</div>
                    <div className="text-base font-black">HK$ 18 <span className="text-xs font-bold">/月</span></div>
                    <div className="text-[10px] font-semibold opacity-85">無限房間 + 旅遊版</div>
                  </button>
                </div>

                <form onSubmit={handleUnlockWithCode} className="pt-2 border-t border-white/10">
                  <label className="block text-[10px] text-slate-300 font-bold mb-1">已有 VIP 解鎖碼？（可用：COPAY2026 或 TRIPTAB）</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      placeholder="輸入解鎖碼"
                      value={vipInput}
                      onChange={e => setVipInput(e.target.value)}
                      className="flex-1 text-xs bg-white/10 border border-white/15 rounded-xl px-3 py-2 font-mono uppercase text-white focus:outline-none"
                    />
                    <button type="submit" className="bg-amber-400 text-slate-900 text-xs font-black px-4 py-2 rounded-xl">
                      兌換
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
