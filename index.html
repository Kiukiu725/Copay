<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>COPAY — 日常與旅遊夾錢神器</title>
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="COPAY" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#23313B" />

  <!-- App Logo 設定 (請確保 GitHub 同目錄下有 Copay.png) -->
  <link rel="icon" type="image/png" href="Copay.png" />
  <link rel="apple-touch-icon" href="Copay.png" />

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase Compat SDKs (App + Realtime Database) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      background-color: #1B252C;
    }
    input, select, textarea {
      user-select: auto;
    }
    /* 參照圖一：迷霧藍與黃昏暖光背景 + 磨砂玻璃質感 */
    .volo-bg {
      background: 
        radial-gradient(circle at 82% 24%, rgba(247, 195, 115, 0.45) 0%, rgba(235, 160, 85, 0.18) 28%, transparent 60%),
        radial-gradient(circle at 20% 70%, rgba(58, 136, 153, 0.35) 0%, transparent 55%),
        linear-gradient(180deg, #CFDCE3 0%, #90A8B6 30%, #3E5260 65%, #1E2931 100%);
    }
    .glass-dark {
      background: rgba(25, 36, 44, 0.68);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
    }
    .glass-light {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.35);
    }
    .teal-pill {
      background: linear-gradient(135deg, #3A8899 0%, #2C6F7E 100%);
      box-shadow: 0 6px 20px rgba(44, 111, 126, 0.45);
    }
    .nav-square {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .nav-square-active {
      background: linear-gradient(145deg, rgba(120, 195, 210, 0.88), rgba(58, 136, 153, 0.92));
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 20px rgba(58, 136, 153, 0.45);
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="antialiased min-h-screen font-sans text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 初始化 Firebase
    const firebaseConfig = {
      databaseURL: "https://travel-split-app-78a36-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 常用貨幣清單
    const DEFAULT_RATES = {
      HKD: 1.0,
      JPY: 0.052,
      TWD: 0.245,
      SGD: 5.82,
      KRW: 0.0058,
      THB: 0.22,
      EUR: 8.45,
      GBP: 9.95,
      USD: 7.78,
      AUD: 5.15,
      CNY: 1.08,
      MOP: 0.97,
      CAD: 5.75,
      CHF: 8.85,
      VND: 0.00031
    };

    const DEFAULT_MEMBERS = ["我", "Alex", "Chloe", "Sam"];
    const FREE_ROOM_QUOTA = 2;
    const VALID_VIP_CODES = ["COPAY2026", "BILLMATE2026", "VIP888", "TRAVELPRO"];

    // 隨機產生 6 位不重複房間 ID (排除易混淆字元 I, O, 0, 1)
    const generateRandomRoomId = () => {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let result = "";
      for (let i = 0; i < 6; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    };

    const sanitizeRoomId = (raw) => {
      return (raw || "").trim().toUpperCase().replace(/[.#$\[\]\/\s]/g, "");
    };

    // 載入用戶已加入嘅房間清單 [{ id: 'X7K9P2', name: '日本之旅' }]
    const getStoredRooms = () => {
      try {
        const saved = JSON.parse(localStorage.getItem("copay_my_rooms"));
        if (Array.isArray(saved) && saved.length > 0) {
          return saved.map(item =>
            typeof item === "string" ? { id: item, name: item } : item
          );
        }
      } catch (e) {}
      const firstId = generateRandomRoomId();
      const initial = [{ id: firstId, name: "日常飯局夾錢 🍱" }];
      localStorage.setItem("copay_my_rooms", JSON.stringify(initial));
      return initial;
    };

    const getInitialRoomId = () => {
      const params = new URLSearchParams(window.location.search);
      const urlRoom = params.get("room");
      if (urlRoom) return sanitizeRoomId(urlRoom);
      const rooms = getStoredRooms();
      return rooms[0].id;
    };

    // 圖二 COPAY Logo 元件 (優先讀取 Copay.png，若未上傳則自動顯示同款青藍金光 $ SVG)
    function CopayLogo({ size = "w-9 h-9" }) {
      const [imgErr, setImgErr] = useState(false);
      if (!imgErr) {
        return (
          <img
            src="Copay.png"
            alt="COPAY Logo"
            onError={() => setImgErr(true)}
            className={`${size} rounded-xl object-cover shadow-md border border-white/20`}
          />
        );
      }
      return (
        <div className={`${size} rounded-xl bg-[#2B353E] flex items-center justify-center shadow-md border border-white/20 relative overflow-hidden`}>
          <svg viewBox="0 0 64 64" className="w-4/5 h-4/5">
            <defs>
              <linearGradient id="copayTeal" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#3B7A8C" />
                <stop offset="100%" stopColor="#1F4E5B" />
              </linearGradient>
              <linearGradient id="copayGold" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#FAD074" />
                <stop offset="100%" stopColor="#D99B43" />
              </linearGradient>
            </defs>
            <rect x="28" y="8" width="8" height="48" rx="4" fill="url(#copayTeal)" />
            <path d="M44 21C44 15.5 38.5 12 32 12C25.5 12 20 15.5 20 21C20 26.5 25.5 29 32 31C38.5 33 44 35.5 44 41C44 46.5 38.5 50 32 50C25.5 50 20 46.5 20 41" stroke="url(#copayTeal)" strokeWidth="8" strokeLinecap="round" fill="none" />
            <path d="M33 14C39 14 44 17 45 21" stroke="url(#copayGold)" strokeWidth="7" strokeLinecap="round" fill="none" />
          </svg>
        </div>
      );
    }

    function App() {
      // 帳號與房間清單狀態 [{ id, name }]
      const [myRooms, setMyRooms] = useState(getStoredRooms);
      const [isPro, setIsPro] = useState(() => localStorage.getItem("copay_is_pro") === "true");
      const [showPaywall, setShowPaywall] = useState(false);
      const [pendingAction, setPendingAction] = useState(null);
      const [vipInput, setVipInput] = useState("");
      const [paywallMsg, setPaywallMsg] = useState("");

      // 當前房間 ID (6位亂碼) 與連線狀態
      const [roomId, setRoomId] = useState(getInitialRoomId);
      const [newRoomNameInput, setNewRoomNameInput] = useState(""); // 建立新房間嘅名稱
      const [joinRoomCodeInput, setJoinRoomCodeInput] = useState(""); // 加入現有房間嘅 6 位 ID
      const [syncStatus, setSyncStatus] = useState("connecting");

      // 群組雲端同步資料
      const [groupName, setGroupName] = useState("日常飯局夾錢 🍱");
      const [isEditingGroupName, setIsEditingGroupName] = useState(false);
      const [tempGroupName, setTempGroupName] = useState("");

      const [roomMode, setRoomMode] = useState("daily"); // daily | travel
      const [members, setMembers] = useState(DEFAULT_MEMBERS);
      const [expenses, setExpenses] = useState([]);
      const [customRates, setCustomRates] = useState({});
      const [paidMap, setPaidMap] = useState({});

      // 編輯單據與刪除確認狀態
      const [editingExpId, setEditingExpId] = useState(null);
      const [editTitle, setEditTitle] = useState("");
      const [editAmount, setEditAmount] = useState("");
      const [deleteConfirmExp, setDeleteConfirmExp] = useState(null); // 儲存準備刪除嘅單據物件

      // UI 導航狀態 (expenses | settle | rooms | settings)
      const [activeTab, setActiveTab] = useState("expenses");
      const [newMemberName, setNewMemberName] = useState("");
      const [liveRates, setLiveRates] = useState(DEFAULT_RATES);
      const [rateUpdatedText, setRateUpdatedText] = useState("載入中...");
      const [newCurCode, setNewCurCode] = useState("");
      const [newCurRate, setNewCurRate] = useState("");

      // 新增開支表單輸入
      const [title, setTitle] = useState("");
      const [amount, setAmount] = useState("");
      const [currency, setCurrency] = useState("HKD");
      const [payer, setPayer] = useState("我");
      const [splitWith, setSplitWith] = useState(DEFAULT_MEMBERS);
      const [category, setCategory] = useState("🍱 餐飲美食");
      const [date, setDate] = useState(new Date().toISOString().split("T")[0]);

      const rates = useMemo(() => ({ ...liveRates, ...customRates }), [liveRates, customRates]);

      // 儲存房間清單到 localStorage
      useEffect(() => {
        localStorage.setItem("copay_my_rooms", JSON.stringify(myRooms));
      }, [myRooms]);

      useEffect(() => {
        localStorage.setItem("copay_is_pro", isPro ? "true" : "false");
      }, [isPro]);

      // 當雲端 groupName 更新時，同步更新本地房間清單顯示嘅名稱
      useEffect(() => {
        if (!roomId || !groupName) return;
        setMyRooms(prev => {
          const exists = prev.some(r => r.id === roomId);
          if (exists) {
            return prev.map(r => r.id === roomId ? { ...r, name: groupName } : r);
          } else {
            return [...prev, { id: roomId, name: groupName }];
          }
        });
      }, [roomId, groupName]);

      // 1. 載入即時公開匯率 API
      useEffect(() => {
        fetch("https://open.er-api.com/v6/latest/HKD")
          .then(res => res.json())
          .then(data => {
            if (data && data.rates) {
              const updated = {};
              Object.keys(DEFAULT_RATES).forEach(cur => {
                if (cur === "HKD") {
                  updated[cur] = 1.0;
                } else if (data.rates[cur]) {
                  updated[cur] = Number((1 / data.rates[cur]).toFixed(5));
                } else {
                  updated[cur] = DEFAULT_RATES[cur];
                }
              });
              setLiveRates(prev => ({ ...prev, ...updated }));
              setRateUpdatedText(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
            }
          })
          .catch(() => {
            setRateUpdatedText("基準匯率");
          });
      }, []);

      // 2. 監聽當前 Firebase 房間數據 (以隨機 Room ID 作為唯一節點鎖匙)
      useEffect(() => {
        setSyncStatus("connecting");
        setIsEditingGroupName(false);
        setEditingExpId(null);

        const url = new URL(window.location);
        url.searchParams.set("room", roomId);
        window.history.replaceState({}, "", url);

        const roomRef = db.ref(`billmate_rooms/${roomId}`);

        const handleValue = (snapshot) => {
          const data = snapshot.val();
          if (data) {
            setGroupName(data.groupName || "未命名項目");
            const mode = data.roomMode || "daily";
            setRoomMode(mode);
            if (mode === "daily" && currency !== "HKD" && !isPro) {
              setCurrency("HKD");
            }

            const loadedMembers = Array.isArray(data.members) && data.members.length > 0 ? data.members : DEFAULT_MEMBERS;
            setMembers(loadedMembers);
            setPayer(prev => loadedMembers.includes(prev) ? prev : loadedMembers[0]);
            setSplitWith(prev => {
              const valid = prev.filter(m => loadedMembers.includes(m));
              return valid.length > 0 ? valid : loadedMembers;
            });

            if (data.expenses) {
              const expList = Object.values(data.expenses).sort((a, b) => {
                const dateA = new Date(a.date).getTime();
                const dateB = new Date(b.date).getTime();
                if (dateA !== dateB) return dateB - dateA;
                return (b.id || 0) - (a.id || 0);
              });
              setExpenses(expList);
            } else {
              setExpenses([]);
            }

            setCustomRates(data.customRates || {});
            setPaidMap(data.paidMap || {});
          } else {
            // 若雲端未有呢個隨機 ID，建立初始資料
            const localRoom = myRooms.find(r => r.id === roomId);
            const defaultTitle = localRoom ? localRoom.name : "日常飯局夾錢 🍱";
            const initialRoomData = {
              roomId: roomId,
              groupName: defaultTitle,
              roomMode: "daily",
              members: DEFAULT_MEMBERS,
              expenses: {},
              customRates: {},
              paidMap: {},
              createdAt: Date.now()
            };
            roomRef.set(initialRoomData);
          }
          setSyncStatus("synced");
        };

        const handleError = () => setSyncStatus("error");

        roomRef.on("value", handleValue, handleError);
        return () => roomRef.off("value", handleValue);
      }, [roomId]);

      // 【核心功能】建立新房間：用戶輸入「房間名稱」，系統背後隨機生成 6 位 Room ID
      const handleCreateNewRoom = (e) => {
        e.preventDefault();
        const customName = newRoomNameInput.trim();
        if (!customName) return;

        const executeCreate = () => {
          const newId = generateRandomRoomId();
          const initialRoomData = {
            roomId: newId,
            groupName: customName,
            roomMode: "daily",
            members: DEFAULT_MEMBERS,
            expenses: {},
            customRates: {},
            paidMap: {},
            createdAt: Date.now()
          };
          db.ref(`billmate_rooms/${newId}`).set(initialRoomData);
          setMyRooms(prev => [...prev, { id: newId, name: customName }]);
          setRoomId(newId);
          setGroupName(customName);
          setNewRoomNameInput("");
          setActiveTab("expenses");
        };

        if (!isPro && myRooms.length >= FREE_ROOM_QUOTA) {
          setPendingAction(() => executeCreate);
          setPaywallMsg(`免費版最多支援 ${FREE_ROOM_QUOTA} 個活躍房間（目前已使用 ${myRooms.length}/${FREE_ROOM_QUOTA}）。升級 COPAY Pro 即可無限開房！`);
          setShowPaywall(true);
          return;
        }

        executeCreate();
      };

      // 【核心功能】用 6 位隨機代碼加入朋友房間
      const handleJoinRoomByCode = (e) => {
        e.preventDefault();
        const cleanCode = sanitizeRoomId(joinRoomCodeInput);
        if (!cleanCode) return;

        if (myRooms.some(r => r.id === cleanCode) || isPro) {
          setRoomId(cleanCode);
          setJoinRoomCodeInput("");
          setActiveTab("expenses");
          return;
        }

        if (myRooms.length >= FREE_ROOM_QUOTA) {
          setPendingAction(() => () => {
            setRoomId(cleanCode);
            setJoinRoomCodeInput("");
            setActiveTab("expenses");
          });
          setPaywallMsg(`免費版最多支援 ${FREE_ROOM_QUOTA} 個活躍房間。升級 COPAY Pro 即可加入無限個朋友房間！`);
          setShowPaywall(true);
        } else {
          setRoomId(cleanCode);
          setJoinRoomCodeInput("");
          setActiveTab("expenses");
        }
      };

      const handleToggleMode = (targetMode) => {
        if (targetMode === "travel" && !isPro) {
          setPaywallMsg("「旅遊專案模式」支援多國貨幣混合記帳、即時自動匯率及旅遊專屬分類，屬於 COPAY Pro 進階功能！");
          setShowPaywall(true);
          return;
        }
        setRoomMode(targetMode);
        if (targetMode === "daily") setCurrency("HKD");
        if (targetMode === "travel") setCurrency("JPY");
        db.ref(`billmate_rooms/${roomId}/roomMode`).set(targetMode);
      };

      const handleUnlockWithCode = (e) => {
        e.preventDefault();
        const code = vipInput.trim().toUpperCase();
        if (VALID_VIP_CODES.includes(code)) {
          setIsPro(true);
          setShowPaywall(false);
          setVipInput("");
          if (pendingAction) {
            pendingAction();
            setPendingAction(null);
          }
          alert("🎉 驗證成功！已為你開通 COPAY Pro 永久版權限！");
        } else {
          alert("❌ 解鎖碼無效！測試可用解鎖碼：COPAY2026");
        }
      };

      const handleSimulatePurchase = (planName) => {
        setIsPro(true);
        setShowPaywall(false);
        if (pendingAction) {
          pendingAction();
          setPendingAction(null);
        }
        alert(`🎉 感謝支持！已成功模擬開通【${planName}】，所有旅遊進階功能及無限房間已解鎖！`);
      };

      // 儲存房間顯示名稱（只改 groupName，絕不影響背後嘅 6 位 Room ID）
      const saveGroupName = (e) => {
        if (e) e.preventDefault();
        const trimmed = tempGroupName.trim();
        if (trimmed) {
          setGroupName(trimmed);
          db.ref(`billmate_rooms/${roomId}/groupName`).set(trimmed);
        }
        setIsEditingGroupName(false);
      };

      // 新增開支
      const handleAddExpense = (e) => {
        e.preventDefault();
        if (!title || !amount || splitWith.length === 0 || !date) return;
        const id = Date.now();
        const newExp = {
          id,
          title: title.trim(),
          amount: parseFloat(amount),
          currency: isPro || roomMode === "travel" ? currency : "HKD",
          payer,
          splitWith,
          category,
          date
        };
        db.ref(`billmate_rooms/${roomId}/expenses/${id}`).set(newExp);
        setTitle("");
        setAmount("");
      };

      // 儲存單據改名與金額修改
      const saveEditExpense = (exp) => {
        const trimmedTitle = editTitle.trim();
        const parsedAmt = parseFloat(editAmount);
        if (!trimmedTitle || isNaN(parsedAmt) || parsedAmt <= 0) return;
        db.ref(`billmate_rooms/${roomId}/expenses/${exp.id}`).update({
          title: trimmedTitle,
          amount: parsedAmt
        });
        setEditingExpId(null);
      };

      // 確認刪除單據
      const confirmDeleteExpense = () => {
        if (!deleteConfirmExp) return;
        db.ref(`billmate_rooms/${roomId}/expenses/${deleteConfirmExp.id}`).remove();
        setDeleteConfirmExp(null);
      };

      const handleAddMember = () => {
        const name = newMemberName.trim();
        if (!name || members.includes(name)) return;
        if (!isPro && members.length >= 4) {
          setPaywallMsg("免費版每個項目最多支援 4 位成員夾錢。升級 COPAY Pro 即可解鎖無限人數（適合大型旅行或團隊活動）！");
          setShowPaywall(true);
          return;
        }
        const updated = [...members, name];
        db.ref(`billmate_rooms/${roomId}/members`).set(updated);
        setSplitWith(updated);
        setNewMemberName("");
      };

      const handleRemoveMember = (name) => {
        if (members.length <= 2) return;
        const updated = members.filter(x => x !== name);
        db.ref(`billmate_rooms/${roomId}/members`).set(updated);
      };

      const handleRateChange = (cur, val) => {
        const num = parseFloat(val);
        if (isNaN(num) || num <= 0) return;
        db.ref(`billmate_rooms/${roomId}/customRates/${cur}`).set(num);
      };

      const handleAddCustomCurrency = (e) => {
        e.preventDefault();
        const code = newCurCode.trim().toUpperCase();
        const rateVal = parseFloat(newCurRate);
        if (code.length !== 3 || isNaN(rateVal) || rateVal <= 0) return;
        db.ref(`billmate_rooms/${roomId}/customRates/${code}`).set(rateVal);
        setCurrency(code);
        setNewCurCode("");
        setNewCurRate("");
      };

      // 切換結算項目「已付清 / 未付」狀態
      const toggleSettlementPaid = (txKey) => {
        const current = !!paidMap[txKey];
        db.ref(`billmate_rooms/${roomId}/paidMap/${txKey}`).set(!current);
      };

      const resetAllPaidStatus = () => {
        db.ref(`billmate_rooms/${roomId}/paidMap`).remove();
      };

      const toHKD = (amt, curr) => {
        const r = rates[curr] || 1;
        return amt * r;
      };

      const totalHKD = useMemo(() => {
        return expenses.reduce((acc, exp) => acc + toHKD(Number(exp.amount), exp.currency), 0);
      }, [expenses, rates]);

      const settlement = useMemo(() => {
        const balances = {};
        members.forEach(m => balances[m] = 0);

        expenses.forEach(exp => {
          const hkdAmount = toHKD(Number(exp.amount), exp.currency);
          const validSplits = (exp.splitWith || []).filter(p => balances[p] !== undefined);
          if (validSplits.length === 0) return;

          const share = hkdAmount / validSplits.length;
          if (balances[exp.payer] !== undefined) balances[exp.payer] += hkdAmount;
          validSplits.forEach(p => { balances[p] -= share; });
        });

        const debtors = [];
        const creditors = [];
        Object.keys(balances).forEach(m => {
          const val = Math.round(balances[m]);
          if (val < -1) debtors.push({ name: m, amount: -val });
          else if (val > 1) creditors.push({ name: m, amount: val });
        });

        debtors.sort((a, b) => b.amount - a.amount);
        creditors.sort((a, b) => b.amount - a.amount);

        const transactions = [];
        let i = 0, j = 0;
        while (i < debtors.length && j < creditors.length) {
          const deb = debtors[i];
          const cred = creditors[j];
          const settleAmt = Math.min(deb.amount, cred.amount);
          const fromName = deb.name;

          if (cred.amount === 0) j++;

                      return (
                        <div key={m} className="flex justify-between items-center text-sm py-2 border-b border-white/10 last:border-none">
                          <span className="font-bold text-white">{m}</span>
                          <span className={`font-bold px-3 py-1 rounded-full text-xs ${net === 0 ? 'bg-white/10 text-slate-300' : isPositive ? 'bg-emerald-500/25 text-emerald-300 border border-emerald-400/30' : 'bg-rose-500/25 text-rose-300 border border-rose-400/30'}`}>
                            {net === 0 ? '收支平衡' : isPositive ? `應收回 HK$ ${net.toLocaleString()}` : `應支付 HK$ ${Math.abs(net).toLocaleString()}`}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: 房間管理 (實現 Kahoot 式「房間名稱」與「6位隨機 Room ID」分離) */}
            {activeTab === "rooms" && (
              <div className="space-y-4">
                {/* 1. 建立全新房間：輸入名稱 -> 自動產生 6 位亂碼 ID */}
                <div className="glass-dark p-5 rounded-3xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-white text-sm">✨ 建立全新夾錢房間</h3>
                    <span className="text-[10px] bg-white/15 px-2.5 py-0.5 rounded-full text-[#9BE0EE] font-bold">
                      自動分配獨立 ID
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-300 leading-relaxed">
                    輸入你想改嘅房間名稱（例如「日本之旅」），系統會自動產生一組獨一無二嘅 6 位房間代碼，唔怕同人撞名！
                  </p>
                  <form onSubmit={handleCreateNewRoom} className="flex gap-2 pt-1">
                    <input
                      type="text"
                      placeholder="輸入新房間名稱 (如：沖繩自駕遊)"
                      value={newRoomNameInput}
                      onChange={e => setNewRoomNameInput(e.target.value)}
                      className="flex-1 text-xs bg-white/10 border border-white/15 rounded-2xl px-3.5 py-3 font-bold text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#3A8899]"
                    />
                    <button type="submit" className="teal-pill text-white text-xs font-bold px-4 rounded-2xl whitespace-nowrap">
                      {!isPro && myRooms.length >= FREE_ROOM_QUOTA ? "🔒 建立新房" : "＋ 建立新房"}
                    </button>
                  </form>
                </div>

                {/* 2. 加入朋友房間：輸入 6 位 Room ID */}
                <div className="glass-dark p-5 rounded-3xl space-y-3">
                  <h3 className="font-bold text-white text-sm">🔑 輸入代碼加入朋友房間</h3>
                  <p className="text-[11px] text-slate-300">
                    問朋友攞 6 位房間代碼（例如 <span className="font-mono text-amber-300">X7K9P2</span>）直接連線同步：
                  </p>
                  <form onSubmit={handleJoinRoomByCode} className="flex gap-2">
                    <input
                      type="text"
                      maxLength="12"
                      placeholder="輸入 6 位房間代碼 (如 X7K9P2)"
                      value={joinRoomCodeInput}
                      onChange={e => setJoinRoomCodeInput(e.target.value.toUpperCase())}
                      className="flex-1 text-xs bg-white/10 border border-white/15 rounded-2xl px-3.5 py-3 font-mono font-bold uppercase text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#3A8899]"
                    />
                    <button type="submit" className="bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-4 rounded-2xl whitespace-nowrap transition">
                      加入房間
                    </button>
                  </form>
                </div>

                {/* 3. 我加入過嘅房間列表 */}
                <div className="glass-dark p-5 rounded-3xl space-y-3">
                  <div className="flex justify-between items-center border-b border-white/10 pb-2.5">
                    <h3 className="font-bold text-white text-sm">📂 我的房間列表</h3>
                    <span className="text-[11px] font-bold text-[#78C3D2]">
                      {isPro ? "PRO 無限額度 ✨" : `免費額度：${myRooms.length} / ${FREE_ROOM_QUOTA}`}
                    </span>
                  </div>
                  <div className="space-y-2">
                    {myRooms.map(r => {
                      const isCurrent = r.id === roomId;
                      return (
                        <button
                          key={r.id}
                          type="button"
                          onClick={() => {
                            setRoomId(r.id);
                            setActiveTab("expenses");
                          }}
                          className={`w-full p-3.5 rounded-2xl border text-left flex justify-between items-center transition ${
                            isCurrent
                              ? "bg-[#3A8899]/40 border-[#78C3D2] text-white shadow-md"
                              : "bg-white/5 border-white/10 text-slate-200 hover:bg-white/10"
                          }`}
                        >
                          <div>
                            <div className="font-bold text-sm flex items-center gap-2">
                              {isCurrent && <span className="w-2 h-2 rounded-full bg-emerald-400"></span>}
                              <span>{r.name}</span>
                            </div>
                            <div className="text-[11px] text-slate-300 font-mono mt-0.5">
                              房間代碼：#{r.id}
                            </div>
                          </div>
                          <span className="text-xs font-bold px-3 py-1 rounded-full bg-white/10">
                            {isCurrent ? "使用中" : "切換"}
                          </span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: 設定與成員/匯率 */}
            {activeTab === "settings" && (
              <div className="space-y-4">
                {/* 項目模式切換 */}
                <div className="glass-dark p-5 rounded-3xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-white text-sm">🎯 項目用途模式</h3>
                    {!isPro && <span className="text-[10px] text-amber-300 font-bold">旅遊模式需 Pro</span>}
                  </div>
                  <div className="grid grid-cols-2 gap-2.5">
                    <button
                      type="button"
                      onClick={() => handleToggleMode("daily")}
                      className={`p-3 rounded-2xl border text-left transition ${roomMode === "daily" ? 'bg-[#3A8899]/40 border-[#78C3D2] text-white' : 'bg-white/5 border-white/10 text-slate-300'}`}
                    >
                      <div className="font-bold text-xs mb-0.5">☕ 日常夾錢模式</div>
                      <div className="text-[10px] opacity-80">港幣記帳 · 飯局/夾租</div>
                    </button>
                    <button
                      type="button"
                      onClick={() => handleToggleMode("travel")}
                      className={`p-3 rounded-2xl border text-left transition ${roomMode === "travel" ? 'bg-[#3A8899]/40 border-[#78C3D2] text-white' : 'bg-white/5 border-white/10 text-slate-300'}`}
                    >
                      <div className="font-bold text-xs mb-0.5 flex items-center justify-between">
                        <span>✈️ 旅遊專案模式</span>
                        {!isPro && <span>🔒</span>}
                      </div>
                      <div className="text-[10px] opacity-80">多國貨幣 · 即時匯率</div>
                    </button>
                  </div>
                </div>

                {/* 參與成員管理 */}
                <div className="glass-dark p-5 rounded-3xl space-y-3.5">
                  <div className="flex justify-between items-center border-b border-white/10 pb-2.5">
                    <h3 className="font-bold text-white text-sm">👥 參與成員 ({members.length}人)</h3>
                    {!isPro && <span className="text-[10px] text-slate-300">免費版上限 4 人</span>}
                  </div>
                  <div className="flex gap-2">
                    <input type="text" placeholder="新增成員名字" value={newMemberName} onChange={e => setNewMemberName(e.target.value)} className="flex-1 text-sm bg-white/10 border border-white/15 rounded-2xl px-4 py-2.5 text-white placeholder-slate-400 focus:outline-none" />
                    <button onClick={handleAddMember} className="teal-pill text-white text-xs font-bold px-5 rounded-2xl">新增</button>
                  </div>
                  <div className="flex flex-wrap gap-2 pt-1">
                    {members.map(m => (
                      <span key={m} className="bg-white/10 border border-white/15 text-white text-xs px-3 py-1.5 rounded-xl font-medium flex items-center gap-2">
                        {m}
                        {members.length > 2 && <button onClick={() => handleRemoveMember(m)} className="text-slate-300 hover:text-rose-300 font-bold text-sm leading-none">×</button>}
                      </span>
                    ))}
                  </div>
                </div>

                {/* 多幣種匯率設定（Pro 專屬） */}
                {isPro && (
                  <div className="glass-dark p-5 rounded-3xl space-y-3.5">
                    <div className="flex justify-between items-center border-b border-white/10 pb-2.5">
                      <h3 className="font-bold text-white text-sm">💱 旅遊自訂匯率 (兌 HKD)</h3>
                    </div>
                    <form onSubmit={handleAddCustomCurrency} className="flex gap-2 bg-white/5 p-2 rounded-2xl">
                      <input type="text" maxLength="3" placeholder="代號 (NZD)" value={newCurCode} onChange={e => setNewCurCode(e.target.value.toUpperCase())} className="w-24 text-xs bg-white/10 rounded-xl px-2 py-2 font-mono uppercase text-center text-white placeholder-slate-400 focus:outline-none" />
                      <input type="number" step="any" placeholder="兌港幣匯率" value={newCurRate} onChange={e => setNewCurRate(e.target.value)} className="flex-1 text-xs bg-white/10 rounded-xl px-3 py-2 text-white placeholder-slate-400 focus:outline-none" />
                      <button type="submit" className="teal-pill text-white text-xs font-bold px-3 rounded-xl">＋加入</button>
                    </form>
                    <div className="grid grid-cols-2 gap-2.5 pt-1">
                      {Object.keys(rates).map(cur => (
                        <div key={cur} className="flex justify-between items-center p-2.5 bg-white/5 rounded-2xl border border-white/10">
                          <span className="font-bold text-slate-200 text-xs pl-1">{cur}</span>
                          <input type="number" step="0.0001" value={rates[cur]} onChange={e => handleRateChange(cur, e.target.value)} className="w-20 text-right bg-black/30 rounded-lg px-2 py-1 font-mono font-bold text-xs text-amber-300 focus:outline-none" />
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* 參照圖一底部：4 格方形磨砂玻璃導航欄 (4 Frosted Square Cards Dock) */}
          <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto px-5 pb-4 pt-2 z-40 bg-gradient-to-t from-[#141C22] via-[#141C22]/90 to-transparent">
            <div className="grid grid-cols-4 gap-2.5">
              <button
                onClick={() => setActiveTab("expenses")}
                className={`py-2.5 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 transition-all ${
                  activeTab === "expenses" ? "nav-square-active text-white scale-105" : "nav-square text-slate-300 hover:text-white"
                }`}
              >
                <span className="text-base leading-none">📝</span>
                <span className="text-[10px] font-bold tracking-tight">記帳明細</span>
              </button>

              <button
                onClick={() => setActiveTab("settle")}
                className={`py-2.5 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 transition-all ${
                  activeTab === "settle" ? "nav-square-active text-white scale-105" : "nav-square text-slate-300 hover:text-white"
                }`}
              >
                <span className="text-base leading-none">⚡</span>
                <span className="text-[10px] font-bold tracking-tight">
                  結算 {settlement.transactions.length > 0 ? `(${paidCount}/${settlement.transactions.length})` : ""}
                </span>
              </button>

              <button
                onClick={() => setActiveTab("rooms")}
                className={`py-2.5 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 transition-all ${
                  activeTab === "rooms" ? "nav-square-active text-white scale-105" : "nav-square text-slate-300 hover:text-white"
                }`}
              >
                <span className="text-base leading-none">🔑</span>
                <span className="text-[10px] font-bold tracking-tight">房間代碼</span>
              </button>

              <button
                onClick={() => setActiveTab("settings")}
                className={`py-2.5 px-2 rounded-2xl flex flex-col items-center justify-center gap-1 transition-all ${
                  activeTab === "settings" ? "nav-square-active text-white scale-105" : "nav-square text-slate-300 hover:text-white"
                }`}
              >
                <span className="text-base leading-none">⚙️</span>
                <span className="text-[10px] font-bold tracking-tight">成員設定</span>
              </button>
            </div>
          </div>

          {/* 【新增】刪除單據雙重確認彈窗 (Delete Confirmation Modal) */}
          {deleteConfirmExp && (
            <div className="fixed inset-0 bg-black/65 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-dark max-w-xs w-full rounded-3xl p-6 text-center space-y-4 border border-white/20 animate-fade-in">
                <div className="w-12 h-12 rounded-full bg-rose-500/20 border border-rose-400/30 flex items-center justify-center mx-auto text-2xl">
                  🗑️
                </div>
                <div className="space-y-1">
                  <h3 className="font-black text-base text-white">確定要刪除呢筆單據？</h3>
                  <p className="text-xs text-slate-300">
                    「<span className="font-bold text-amber-300">{deleteConfirmExp.title}</span>」({deleteConfirmExp.currency} {Number(deleteConfirmExp.amount).toLocaleString()})
                  </p>
                  <p className="text-[11px] text-slate-400">刪除後所有成員嘅夾錢結算會即時重新計算。</p>
                </div>
                <div className="flex gap-2.5 pt-1">
                  <button
                    type="button"
                    onClick={() => setDeleteConfirmExp(null)}
                    className="flex-1 py-2.5 rounded-2xl bg-white/15 hover:bg-white/25 text-white text-xs font-bold transition"
                  >
                    取消
                  </button>
                  <button
                    type="button"
                    onClick={confirmDeleteExpense}
                    className="flex-1 py-2.5 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold shadow-lg transition"
                  >
                    確定刪除
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 升級 COPAY Pro 彈窗 (Paywall Modal) */}
          {showPaywall && (
            <div className="fixed inset-0 bg-black/65 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-dark max-w-sm w-full rounded-[2rem] p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-start">
                  <div className="flex items-center gap-2.5">
                    <CopayLogo size="w-9 h-9" />
                    <div>
                      <h2 className="font-black text-lg text-white">升級 COPAY Pro</h2>
                      <p className="text-[11px] text-slate-300">解鎖完整旅遊專案與無限房間額度</p>
                    </div>
                  </div>
                  <button onClick={() => setShowPaywall(false)} className="text-slate-300 hover:text-white text-xl font-bold leading-none">×</button>
                </div>

                <div className="bg-amber-500/20 border border-amber-300/30 p-3 rounded-2xl text-xs text-amber-200">
                  {paywallMsg}
                </div>

                <div className="space-y-2 text-xs text-slate-200 bg-white/5 p-3.5 rounded-2xl border border-white/10">
                  <div className="flex items-center gap-2"><span>✅</span> <strong>無限個獨立房間</strong>（打破免費版 2 個限制）</div>
                  <div className="flex items-center gap-2"><span>✅</span> <strong>旅遊多幣種混合記帳</strong> + 即時自動匯率</div>
                  <div className="flex items-center gap-2"><span>✅</span> <strong>無上限夾錢人數</strong>（打破免費版 4 人限制）</div>
                  <div className="flex items-center gap-2"><span>✅</span> <strong>鎖定唱錢匯率</strong>，計數零誤差</div>
                </div>

                <div className="grid grid-cols-2 gap-2.5 pt-1">
                  <button
                    type="button"
                    onClick={() => handleSimulatePurchase("單次旅遊通行證 HK$28")}
                    className="p-3 rounded-2xl border border-[#78C3D2] bg-white/10 text-left hover:bg-white/20 transition"
                  >
                    <div className="text-[10px] font-bold text-[#9BE0EE]">單次買斷</div>
                    <div className="text-base font-black text-white">HK$ 28</div>
                    <div className="text-[10px] text-slate-300">適合單次長途旅行</div>
                  </button>
                  <button
                    type="button"
                    onClick={() => handleSimulatePurchase("Pro 月費計劃 HK$18/月")}
                    className="p-3 rounded-2xl teal-pill text-white text-left transition relative overflow-hidden"
                  >
                    <div className="text-[10px] font-bold text-amber-300">最受歡迎 🔥</div>
                    <div className="text-base font-black">HK$ 18 <span className="text-xs font-normal">/月</span></div>
                    <div className="text-[10px] text-white/85">無限旅行與日常項目</div>
                  </button>
                </div>

                <form onSubmit={handleUnlockWithCode} className="pt-2 border-t border-white/10">
                  <label className="block text-[10px] text-slate-300 font-bold mb-1">已有 VIP 解鎖碼？（測試碼：COPAY2026）</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      placeholder="輸入解鎖碼"
                      value={vipInput}
                      onChange={e => setVipInput(e.target.value)}
                      className="flex-1 text-xs bg-white/10 border border-white/15 rounded-xl px-3 py-2 font-mono uppercase text-white focus:outline-none"
                    />
                    <button type="submit" className="bg-amber-400 text-slate-900 text-xs font-black px-4 py-2 rounded-xl">
                      兌換
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
