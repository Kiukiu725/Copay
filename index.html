  <!-- ✨ iOS 主畫面 Logo 終極保障腳本：自動檢測 GitHub 圖片，若因檔名大小寫或緩存未載入，即時用 Canvas 1:1 繪製圖二高清 512x512 PNG 注入 iPhone 主畫面 Icon！ -->
  <script>
    (function ensureCopayHomeScreenIcon() {
      function generateFallbackCopayIconDataURL() {
        const canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext("2d");

        // 1. 圖二深灰藍柔和漸層背景 (#384049 -> #282E35)
        const bgGrad = ctx.createLinearGradient(0, 0, 512, 512);
        bgGrad.addColorStop(0, "#3D4650");
        bgGrad.addColorStop(1, "#262C33");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 512, 512);

        // 2. 右上角暖金色柔光暈 (Glow)
        const glowGrad = ctx.createRadialGradient(295, 165, 5, 295, 165, 95);
        glowGrad.addColorStop(0, "rgba(246, 193, 107, 0.55)");
        glowGrad.addColorStop(0.5, "rgba(246, 193, 107, 0.18)");
        glowGrad.addColorStop(1, "rgba(246, 193, 107, 0)");
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(295, 165, 95, 0, Math.PI * 2);
        ctx.fill();

        // 3. 中央垂直青藍柱 ($)
        const barGrad = ctx.createLinearGradient(236, 95, 276, 330);
        barGrad.addColorStop(0, "#3B7282");
        barGrad.addColorStop(1, "#234C59");
        ctx.fillStyle = barGrad;
        ctx.beginPath();
        ctx.roundRect(238, 92, 36, 240, 12);
        ctx.fill();

        // 4. 立體 S 形深青藍絲帶主體
        const sGrad = ctx.createLinearGradient(180, 120, 330, 310);
        sGrad.addColorStop(0, "#356A7A");
        sGrad.addColorStop(0.5, "#2B5B6C");
        sGrad.addColorStop(1, "#1D424F");
        ctx.strokeStyle = sGrad;
        ctx.lineWidth = 40;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(298, 162);
        ctx.bezierCurveTo(265, 120, 195, 130, 198, 176);
        ctx.bezierCurveTo(200, 222, 315, 210, 315, 262);
        ctx.bezierCurveTo(315, 305, 230, 308, 205, 268);
        ctx.stroke();

        // 5. 圖二標誌性右上角暖金色立體水滴弧帶
        const goldGrad = ctx.createLinearGradient(250, 128, 320, 180);
        goldGrad.addColorStop(0, "#FCE092");
        goldGrad.addColorStop(0.5, "#EAA956");
        goldGrad.addColorStop(1, "#C58337");
        ctx.strokeStyle = goldGrad;
        ctx.lineWidth = 34;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(256, 136);
        ctx.quadraticCurveTo(292, 132, 306, 162);
        ctx.stroke();

        // 6. 底部 "copay" 淺冰藍圓體字樣
        ctx.fillStyle = "#B2C8CE";
        ctx.font = "bold 78px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";
        ctx.fillText("copay", 256, 422);

        return canvas.toDataURL("image/png");
      }

      // 先即時掛載高清 Canvas Icon 確保 iOS 100% 讀到，再探測 GitHub 上嘅實體 PNG
      window.addEventListener("DOMContentLoaded", () => {
        const fallbackDataUrl = generateFallbackCopayIconDataURL();
        const appleIconLink = document.getElementById("dynamic-apple-icon");
        const favIconLink = document.getElementById("dynamic-favicon");

        const candidateFiles = ["Copay.png", "Copay_2.png", "copay.png", "./Copay.png", "./Copay_2.png"];
        let found = false;

        candidateFiles.forEach((src) => {
          const img = new Image();
          img.onload = function () {
            if (!found) {
              found = true;
              // 將成功載入嘅 GitHub PNG 畫入正方形 Canvas 轉為標準 DataURL，徹底解決 iOS Safari 緩存與路徑問題
              try {
                const c = document.createElement("canvas");
                c.width = 512;
                c.height = 512;
                const ctx = c.getContext("2d");
                ctx.drawImage(img, 0, 0, 512, 512);
                const dataUrl = c.toDataURL("image/png");
                if (appleIconLink) appleIconLink.href = dataUrl;
                if (favIconLink) favIconLink.href = dataUrl;
              } catch (e) {
                if (appleIconLink) appleIconLink.href = src;
                if (favIconLink) favIconLink.href = src;
              }
            }
          };
          img.src = src;
        });

        // 預設先寫入 1:1 還原嘅高清圖二 DataURL，保證任何情況下「加入主畫面」都有靚 Logo
        if (appleIconLink) appleIconLink.href = fallbackDataUrl;
        if (favIconLink) favIconLink.href = fallbackDataUrl;
      });
    })();
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 初始化 Firebase
    const firebaseConfig = {
      databaseURL: "https://travel-split-app-78a36-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 公數錢包固定代號
    const POOL_PAYER_KEY = "🏦 公數錢包";

    // 將任何 YYYY-MM-DD 日期統一轉為英式 DD/MM/YYYY 格式
    const formatDateUK = (isoDateStr) => {
      if (!isoDateStr || typeof isoDateStr !== "string") return "";
      const parts = isoDateStr.split("-");
      if (parts.length !== 3) return isoDateStr;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    };

    // Copay Travel 專屬多國貨幣清單
    const TRAVEL_RATES = {
      HKD: 1.0,
      JPY: 0.052,
      TWD: 0.245,
      SGD: 5.82,
      KRW: 0.0058,
      THB: 0.22,
      EUR: 8.45,
      GBP: 9.95,
      USD: 7.78,
      AUD: 5.15,
      CNY: 1.08,
      MOP: 0.97,
      CAD: 5.75,
      CHF: 8.85,
      VND: 0.00031
    };

    const CHART_COLORS = ["#4B7B99", "#7BA69E", "#D9A05B", "#8FAEC4", "#6B8E78", "#C77D63", "#8C7B99"];

    const DEFAULT_MEMBERS = ["我", "Alex", "Chloe", "Sam"];
    const DEFAULT_CATEGORIES_DAILY = ["🍱 食飯", "🚕 車費", "📦 團購"];
    const DEFAULT_CATEGORIES_TRAVEL = ["🍱 食飯", "🚕 車費", "📦 團購"];

    const VALID_VIP_CODES = ["COPAY2026", "COPAYPRO", "VIP888", "TRAVELPRO"];

    const generateRandomRoomId = () => {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let result = "";
      for (let i = 0; i < 6; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    };

    const sanitizeRoomId = (raw) => {
      return (raw || "").trim().toUpperCase().replace(/[.#$\[\]\/\s]/g, "");
    };

    const getStoredRooms = () => {
      try {
        const saved = JSON.parse(localStorage.getItem("copay_brand_rooms_v1"));
        if (Array.isArray(saved) && saved.length > 0) {
          return saved.map(item =>
            typeof item === "string"
              ? { id: item, name: item, mode: "daily" }
              : { id: item.id, name: item.name, mode: item.mode === "travel" || item.mode === "triptab" ? "travel" : "daily" }
          );
        }
      } catch (e) {}
      const firstId = generateRandomRoomId();
      const initial = [{ id: firstId, name: "日常飯局夾錢 🍱", mode: "daily" }];
      localStorage.setItem("copay_brand_rooms_v1", JSON.stringify(initial));
      return initial;
    };

    const getInitialRoomId = () => {
      const params = new URLSearchParams(window.location.search);
      const urlRoom = params.get("room");
      if (urlRoom) return sanitizeRoomId(urlRoom);
      const rooms = getStoredRooms();
      return rooms[0].id;
    };

    // 圖二 Copay Logo 元件 (自動嘗試 Copay.png -> Copay_2.png -> copay.png -> 內置 1:1 圖二 SVG)

      const candidateLogos = ["Copay.png", "Copay_2.png", "copay.png"];
      const [logoIdx, setLogoIdx] = useState(0);

      if (logoIdx < candidateLogos.length) {
        return (
          <div className="relative shrink-0">
            <img
              src={candidateLogos[logoIdx]}
              alt="Copay Logo"
              onError={() => setLogoIdx(prev => prev + 1)}
              className={`${size} rounded-2xl object-cover shadow-md border border-white/80`}
            />
            {isTravel && (
              <span className="absolute -bottom-1 -right-1 bg-[#2D3842] text-[#F4D58D] text-[9px] font-black px-1 py-0.2 rounded-md border border-white/60 shadow">
                ✈️
              </span>

      }

      // 圖二 1:1 高精細內置 SVG Logo (深灰藍底 + 3D 青藍 $ + 右上暖金發光弧 + copay 字樣)
      return (
        <div className="relative shrink-0">
          <div className={`${size} rounded-2xl bg-gradient-to-br from-[#3D4650] to-[#262C33] flex items-center justify-center shadow-md border border-white/80 relative overflow-hidden`}>

              <defs>
                <linearGradient id="cpBar" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stopColor="#3B7282" />
                  <stop offset="100%" stopColor="#234C59" />
                </linearGradient>
                <linearGradient id="cpRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stopColor="#356A7A" />
                  <stop offset="100%" stopColor="#1D424F" />
                </linearGradient>
                <linearGradient id="cpGold" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stopColor="#FCE092" />
                  <stop offset="55%" stopColor="#EAA956" />
                  <stop offset="100%" stopColor="#C58337" />
                </linearGradient>
                <radialGradient id="cpGlow" cx="60%" cy="30%" r="30%">
                  <stop offset="0%" stopColor="#F6C16B" stopOpacity="0.55" />
                  <stop offset="100%" stopColor="#F6C16B" stopOpacity="0" />
                </radialGradient>
              </defs>
              <circle cx="60" cy="30" r="24" fill="url(#cpGlow)" />
              <rect x="46" y="16" width="8" height="48" rx="3.5" fill="url(#cpBar)" />
              <path d="M60 31 C53 22, 37 24, 38 34 C39 44, 62 41, 62 52 C62 61, 44 61, 39 53" stroke="url(#cpRibbon)" strokeWidth="8.5" strokeLinecap="round" fill="none" />
              <path d="M50 25 Q58 24 61 31" stroke="url(#cpGold)" strokeWidth="7.5" strokeLinecap="round" fill="none" />
              <text x="50" y="84" textAnchor="middle" fill="#B2C8CE" fontSize="16" fontWeight="bold" fontFamily="-apple-system, BlinkMacSystemFont, sans-serif">copay</text>
            </svg>
          </div>
          {isTravel && (
            <span className="absolute -bottom-1 -right-1 bg-[#2D3842] text-[#F4D58D] text-[9px] font-black px-1 py-0.2 rounded-md border border-white/60 shadow">
              ✈️
            </span>
          )}
        </div>
      );
    }

    function App() {
      // 房間與 Pro 權限狀態
      const [myRooms, setMyRooms] = useState(getStoredRooms);
      const [isPro, setIsPro] = useState(() => localStorage.getItem("copay_pro_travel_unlocked") === "true");
      const [showPaywall, setShowPaywall] = useState(false);
      const [pendingAction, setPendingAction] = useState(null);
      const [vipInput, setVipInput] = useState("");
      const [paywallMsg, setPaywallMsg] = useState("");
      const [paywallTriggerTitle, setPaywallTriggerTitle] = useState("Copay Travel 早鳥永久解鎖：$38 (原價 $88)");

      // 首頁點擊「＋ 新增房間」彈出嘅雙卡片選擇視窗
      const [showCreateRoomModal, setShowCreateRoomModal] = useState(false);
      const [modalSelectedMode, setModalSelectedMode] = useState("daily");
      const [modalRoomNameInput, setModalRoomNameInput] = useState("");

      // 當前房間 ID 與連線狀態
      const [roomId, setRoomId] = useState(getInitialRoomId);
      const [joinRoomCodeInput, setJoinRoomCodeInput] = useState("");
      const [syncStatus, setSyncStatus] = useState("connecting");

      // 群組雲端同步資料
      const [groupName, setGroupName] = useState("日常飯局夾錢 🍱");
      const [isEditingGroupName, setIsEditingGroupName] = useState(false);
      const [tempGroupName, setTempGroupName] = useState("");

      // 當前房間模式：'daily' (Copay Lite 免費日常版) | 'travel' (Copay Travel 海外旅遊版)
      const [roomMode, setRoomMode] = useState("daily");

      const [members, setMembers] = useState(DEFAULT_MEMBERS);
      const [customCategories, setCustomCategories] = useState(null);
      const [newCategoryInput, setNewCategoryInput] = useState("");
      const [expenses, setExpenses] = useState([]);
      const [customRates, setCustomRates] = useState({});
      const [paidMap, setPaidMap] = useState({});

      const [showAllExpenses, setShowAllExpenses] = useState(false);
      const [isTravelFormCollapsed, setIsTravelFormCollapsed] = useState(false);
      const [collapsedDays, setCollapsedDays] = useState({});
      const [cardFeePercent, setCardFeePercent] = useState(1.95);

      // 成員改名狀態
      const [editingMemberName, setEditingMemberName] = useState(null);
      const [tempMemberNewName, setTempMemberNewName] = useState("");

      // 【Copay Travel 公數錢包狀態】
      const [poolContributions, setPoolContributions] = useState({});
      const [poolDate, setPoolDate] = useState(new Date().toISOString().split("T")[0]);
      const [poolTopUpAmount, setPoolTopUpAmount] = useState("");
      const [showPoolModal, setShowPoolModal] = useState(false);

      // 編輯單據與刪除確認狀態
      const [editingExpId, setEditingExpId] = useState(null);
      const [editTitle, setEditTitle] = useState("");
      const [editAmount, setEditAmount] = useState("");
      const [deleteConfirmExp, setDeleteConfirmExp] = useState(null);

      // UI 導航狀態
      const [activeTab, setActiveTab] = useState("expenses");
      const [newMemberName, setNewMemberName] = useState("");
      const [liveRates, setLiveRates] = useState(TRAVEL_RATES);
      const [rateUpdatedText, setRateUpdatedText] = useState("即時匯率");
      const [newCurCode, setNewCurCode] = useState("");
      const [newCurRate, setNewCurRate] = useState("");

      // 新增開支表單輸入
      const [title, setTitle] = useState("");
      const [amount, setAmount] = useState("");
      const [currency, setCurrency] = useState("HKD");
      const [addCardFee, setAddCardFee] = useState(false);
      const [payer, setPayer] = useState("我");
      const [splitWith, setSplitWith] = useState(DEFAULT_MEMBERS);
      const [category, setCategory] = useState("🍱 食飯");
      const [date, setDate] = useState(new Date().toISOString().split("T")[0]);

      // 進階拆帳邏輯
      const [useAdvancedSplit, setUseAdvancedSplit] = useState(false);
      const [splitAdjustments, setSplitAdjustments] = useState({});

      // 日常版消費報告篩選狀態
      const [reportYear, setReportYear] = useState("ALL");
      const [reportMonth, setReportMonth] = useState("ALL");
      const [reportDay, setReportDay] = useState("ALL");

      const rates = useMemo(() => ({ ...liveRates, ...customRates }), [liveRates, customRates]);
      const isTravelMode = roomMode === "travel";

      const dailyRoomsList = useMemo(() => myRooms.filter(r => r.mode !== "travel"), [myRooms]);
      const travelRoomsList = useMemo(() => myRooms.filter(r => r.mode === "travel"), [myRooms]);

      const activeCategories = useMemo(() => {
        if (Array.isArray(customCategories) && customCategories.length > 0) {
          return customCategories;
        }
        return isTravelMode ? DEFAULT_CATEGORIES_TRAVEL : DEFAULT_CATEGORIES_DAILY;
      }, [customCategories, isTravelMode]);

      const sortedCurrencyKeys = useMemo(() => {
        const allKeys = Object.keys(rates);
        return [currency, ...allKeys.filter(k => k !== currency)];
      }, [rates, currency]);

      useEffect(() => {
        if (!activeCategories.includes(category)) {
          setCategory(activeCategories[0] || "🍱 食飯");
        }
      }, [activeCategories, isTravelMode]);

      useEffect(() => {
        localStorage.setItem("copay_brand_rooms_v1", JSON.stringify(myRooms));
      }, [myRooms]);

      useEffect(() => {
        localStorage.setItem("copay_pro_travel_unlocked", isPro ? "true" : "false");
      }, [isPro]);

      useEffect(() => {
        if (!roomId || !groupName) return;
        setMyRooms(prev => {
          const exists = prev.some(r => r.id === roomId);
          if (exists) {
            return prev.map(r => r.id === roomId ? { ...r, name: groupName, mode: roomMode } : r);
          } else {
            return [...prev, { id: roomId, name: groupName, mode: roomMode }];
          }
        });
      }, [roomId, groupName, roomMode]);

      const fetchLiveExchangeRates = () => {
        setRateUpdatedText("更新中...");
        fetch("https://open.er-api.com/v6/latest/HKD")
          .then(res => res.json())
          .then(data => {
            if (data && data.rates) {
              const updated = {};
              Object.keys(TRAVEL_RATES).forEach(cur => {
                if (cur === "HKD") {
                  updated[cur] = 1.0;
                } else if (data.rates[cur]) {
                  updated[cur] = Number((1 / data.rates[cur]).toFixed(5));
                } else {
                  updated[cur] = TRAVEL_RATES[cur];
                }
              });
              setLiveRates(prev => ({ ...prev, ...updated }));
              setRateUpdatedText(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
            }
          })
          .catch(() => {
            setRateUpdatedText("預設匯率");
          });
      };

      useEffect(() => {
        fetchLiveExchangeRates();
      }, []);

      // 統一彈出 Copay Travel 早鳥優惠 Paywall 函數
      const triggerPaywall = (titleText, msgText, onUnlockCallback = null) => {
        setPaywallTriggerTitle(titleText || "Copay Travel 早鳥永久解鎖：$38 (原價 $88)");
        setPaywallMsg(msgText);
        if (onUnlockCallback) {
          setPendingAction(() => onUnlockCallback);
        } else {
          setPendingAction(null);
        }
        setShowPaywall(true);
      };

      // 監聽當前 Firebase 房間數據
      useEffect(() => {
        setSyncStatus("connecting");
        setIsEditingGroupName(false);
        setEditingExpId(null);
        setEditingMemberName(null);
        setShowAllExpenses(false);
        setIsTravelFormCollapsed(false);
        setCollapsedDays({});
        setUseAdvancedSplit(false);
        setSplitAdjustments({});
        setReportYear("ALL");
        setReportMonth("ALL");
        setReportDay("ALL");

        const url = new URL(window.location);
        url.searchParams.set("room", roomId);
        window.history.replaceState({}, "", url);

        const roomRef = db.ref(`billmate_rooms/${roomId}`);

        const handleValue = (snapshot) => {
          const data = snapshot.val();
          if (data) {
            const rawMode = data.roomMode === "travel" || data.roomMode === "triptab" ? "travel" : "daily";
            setGroupName(data.groupName || (rawMode === "travel" ? "東京之旅 ✈️" : "日常飯局夾錢 🍱"));

            if (rawMode === "travel") {
              setRoomMode("travel");
              setCurrency(data.defaultCurrency || "JPY");
            } else {
              setRoomMode("daily");
              setCurrency("HKD");
              setAddCardFee(false);
              if (payer === POOL_PAYER_KEY) setPayer("我");
            }

            if (data.cardFeePercent !== undefined && !isNaN(Number(data.cardFeePercent))) {
              setCardFeePercent(Number(data.cardFeePercent));
            } else {
              setCardFeePercent(1.95);
            }

            const loadedMembers = Array.isArray(data.members) && data.members.length > 0 ? data.members : DEFAULT_MEMBERS;
            setMembers(loadedMembers);
            setPayer(prev => (prev === POOL_PAYER_KEY || loadedMembers.includes(prev)) ? prev : loadedMembers[0]);
            setSplitWith(prev => {
              const valid = prev.filter(m => loadedMembers.includes(m));
              return valid.length > 0 ? valid : loadedMembers;
            });

            if (Array.isArray(data.customCategories) && data.customCategories.length > 0) {
              setCustomCategories(data.customCategories);
            } else {
              setCustomCategories(null);
            }

            if (data.expenses) {
              const expList = Object.values(data.expenses).sort((a, b) => {
                const dateA = new Date(a.date).getTime();
                const dateB = new Date(b.date).getTime();
                if (dateA !== dateB) return dateB - dateA;
                return (b.id || 0) - (a.id || 0);
              });
              setExpenses(expList);
            } else {
              setExpenses([]);
            }

            setCustomRates(data.customRates || {});
            setPaidMap(data.paidMap || {});
            setPoolContributions(data.poolContributions || {});
            if (data.poolDate) setPoolDate(data.poolDate);
          } else {
            const localRoom = myRooms.find(r => r.id === roomId);
            const targetMode = localRoom && localRoom.mode === "travel" ? "travel" : "daily";
            const defaultTitle = localRoom ? localRoom.name : (targetMode === "travel" ? "日本之旅 ✈️" : "日常飯局夾錢 🍱");
            const initialRoomData = {
              roomId: roomId,
              groupName: defaultTitle,
              roomMode: targetMode,
              defaultCurrency: targetMode === "travel" ? "JPY" : "HKD",
              cardFeePercent: 1.95,
              members: DEFAULT_MEMBERS,
              expenses: {},
              customRates: {},
              paidMap: {},
              poolContributions: {},
              poolDate: new Date().toISOString().split("T")[0],
              createdAt: Date.now()
            };
            roomRef.set(initialRoomData);
          }
          setSyncStatus("synced");
        };

        const handleError = () => setSyncStatus("error");

        roomRef.on("value", handleValue, handleError);
        return () => roomRef.off("value", handleValue);
      }, [roomId]);

      const toHKD = (amt, curr) => {
        if (!curr || curr === "HKD") return amt;
        const r = rates[curr] || 1;
        return amt * r;
      };

      // ==========================================
      // 🏦 公數錢包總額、已用金額及可用餘額
      // ==========================================
      const poolStats = useMemo(() => {
        const totalContributedHKD = members.reduce((sum, m) => {
          return sum + (Number(poolContributions[m]) || 0);
        }, 0);

        const totalSpentFromPoolHKD = expenses.reduce((sum, exp) => {
          if (exp.payer === POOL_PAYER_KEY || exp.isPoolExpense) {
            return sum + toHKD(Number(exp.amount), exp.currency);
          }
          return sum;
        }, 0);

        const remainingPoolHKD = Math.max(0, Number((totalContributedHKD - totalSpentFromPoolHKD).toFixed(2)));
        const rawRemainingHKD = Number((totalContributedHKD - totalSpentFromPoolHKD).toFixed(2));

        return {
          totalContributedHKD,
          totalSpentFromPoolHKD,
          remainingPoolHKD,
          rawRemainingHKD
        };
      }, [members, poolContributions, expenses, rates]);

      const feeMultiplier = useMemo(() => {
        const pct = Math.max(0, Number(cardFeePercent) || 0);
        return 1 + pct / 100;
      }, [cardFeePercent]);

      const currentInputHKD = useMemo(() => {
        const raw = parseFloat(amount);
        if (isNaN(raw) || raw <= 0) return 0;
        const withFee = isTravelMode && addCardFee ? raw * feeMultiplier : raw;
        const curr = isTravelMode ? currency : "HKD";
        return toHKD(withFee, curr);
      }, [amount, currency, addCardFee, isTravelMode, rates, feeMultiplier]);

      const isExceedingPoolBalance = useMemo(() => {
        if (payer !== POOL_PAYER_KEY) return false;
        return currentInputHKD > (poolStats.rawRemainingHKD + 0.05);
      }, [payer, currentInputHKD, poolStats.rawRemainingHKD]);

      const handleBatchTopUpPool = (e) => {
        e.preventDefault();
        const addAmt = parseFloat(poolTopUpAmount);
        if (isNaN(addAmt) || addAmt <= 0) return;
        const updated = { ...poolContributions };
        members.forEach(m => {
          updated[m] = Number(((Number(updated[m]) || 0) + addAmt).toFixed(2));
        });
        db.ref(`billmate_rooms/${roomId}`).update({
          poolContributions: updated,
          poolDate: poolDate
        });
        setPoolTopUpAmount("");
      };

      const handlePoolDateChange = (newDate) => {
        setPoolDate(newDate);
        db.ref(`billmate_rooms/${roomId}/poolDate`).set(newDate);
      };

      const handleMemberPoolChange = (memberName, newValStr) => {
        const newVal = Math.max(0, parseFloat(newValStr) || 0);
        const tempContributions = { ...poolContributions, [memberName]: newVal };
        const newTotalPool = members.reduce((sum, m) => sum + (Number(tempContributions[m]) || 0), 0);

        if (newTotalPool + 0.05 < poolStats.totalSpentFromPoolHKD) {
          alert(
            `⚠️ 無法調低公數金額！\n\n` +
            `目前公數錢包已經消費咗 HK$ ${Math.round(poolStats.totalSpentFromPoolHKD).toLocaleString()}，` +
            `公數總注資額唔可以少過已消費金額！`
          );
          return;
        }
        db.ref(`billmate_rooms/${roomId}/poolContributions/${memberName}`).set(newVal);
      };

      // ==========================================
      // 🏷️ 自訂活動類別新增與刪除
      // ==========================================
      const handleAddCategory = (e) => {
        e.preventDefault();
        const trimmed = newCategoryInput.trim();
        if (!trimmed) return;
        if (activeCategories.includes(trimmed)) {
          setNewCategoryInput("");
          return;
        }
        const updated = [...activeCategories, trimmed];
        setCustomCategories(updated);
        setCategory(trimmed);
        db.ref(`billmate_rooms/${roomId}/customCategories`).set(updated);
        setNewCategoryInput("");
      };

      const handleDeleteCategory = (catToDel) => {
        if (activeCategories.length <= 1) {
          alert("至少要保留 1 個活動類別！");
          return;
        }
        const updated = activeCategories.filter(c => c !== catToDel);
        setCustomCategories(updated);
        if (category === catToDel) {
          setCategory(updated[0]);
        }
        db.ref(`billmate_rooms/${roomId}/customCategories`).set(updated);
      };

      // ==========================================
      // 👥 成員管理
      // ==========================================
      const handleAddMember = () => {
        const name = newMemberName.trim();
        if (!name || members.includes(name) || name === POOL_PAYER_KEY) return;
        const updated = [...members, name];
        db.ref(`billmate_rooms/${roomId}/members`).set(updated);
        setSplitWith(updated);
        setNewMemberName("");
      };

      const handleRenameMember = (oldName) => {
        const newName = tempMemberNewName.trim();
        if (!newName || newName === oldName || newName === POOL_PAYER_KEY) {
          setEditingMemberName(null);
          return;
        }
        if (members.includes(newName)) {
          alert("呢個成員名已經存在！");
          return;
        }

        const updatedMembers = members.map(m => m === oldName ? newName : m);
        const updates = {};
        updates[`members`] = updatedMembers;

        expenses.forEach(exp => {
          const newPayer = exp.payer === oldName ? newName : exp.payer;
          const newSplit = (exp.splitWith || []).map(p => p === oldName ? newName : p);
          if (newPayer !== exp.payer || JSON.stringify(newSplit) !== JSON.stringify(exp.splitWith)) {
            updates[`expenses/${exp.id}/payer`] = newPayer;
            updates[`expenses/${exp.id}/splitWith`] = newSplit;
          }
          if (exp.splitAdjustments && exp.splitAdjustments[oldName] !== undefined) {
            const newAdj = { ...exp.splitAdjustments };
            newAdj[newName] = newAdj[oldName];
            delete newAdj[oldName];
            updates[`expenses/${exp.id}/splitAdjustments`] = newAdj;
          }
        });

        if (poolContributions && poolContributions[oldName] !== undefined) {
          const newPool = { ...poolContributions };
          newPool[newName] = newPool[oldName];
          delete newPool[oldName];
          updates[`poolContributions`] = newPool;
        }

        db.ref(`billmate_rooms/${roomId}`).update(updates);
        if (payer === oldName) setPayer(newName);
        setSplitWith(prev => prev.map(m => m === oldName ? newName : m));
        setEditingMemberName(null);
        setTempMemberNewName("");
      };

      const handleRemoveMember = (nameToRemove) => {
        if (members.length <= 2) {
          alert("每個房間至少需要保留 2 位活躍成員！");
          return;
        }
        if (!window.confirm(`確定要刪除成員「${nameToRemove}」？\n\n• 佢參與過嘅開支將會保留原總額，並自動由餘下成員重新平分。\n• 如果佢曾擔任「墊支人」，系統會直接以負數顯示佢嘅墊支額，並保留喺消費報告內。`)) {
          return;
        }

        const updatedMembers = members.filter(x => x !== nameToRemove);
        const updates = {};
        updates[`members`] = updatedMembers;

        expenses.forEach(exp => {
          if (Array.isArray(exp.splitWith) && exp.splitWith.includes(nameToRemove)) {
            let remainingSplits = exp.splitWith.filter(m => m !== nameToRemove && updatedMembers.includes(m));
            if (remainingSplits.length === 0) {
              remainingSplits = [...updatedMembers];
            }
            updates[`expenses/${exp.id}/splitWith`] = remainingSplits;
          }
        });

        db.ref(`billmate_rooms/${roomId}`).update(updates);
        if (payer === nameToRemove) setPayer(updatedMembers[0]);
        setSplitWith(prev => {
          const filtered = prev.filter(m => m !== nameToRemove);
          return filtered.length > 0 ? filtered : updatedMembers;
        });
      };

      // ==========================================
      // 🔑 建立「日常夾錢 (Copay Lite)」與「海外旅遊 (Copay Travel)」房間
      // ==========================================
      const createSeparateRoomWithMode = (customName, targetMode) => {
        const newId = generateRandomRoomId();
        const initialRoomData = {
          roomId: newId,
          groupName: customName,
          roomMode: targetMode,
          defaultCurrency: targetMode === "travel" ? "JPY" : "HKD",
          cardFeePercent: 1.95,
          members: DEFAULT_MEMBERS,
          expenses: {},
          customRates: {},
          paidMap: {},
          poolContributions: {},
          poolDate: new Date().toISOString().split("T")[0],
          createdAt: Date.now()
        };
        db.ref(`billmate_rooms/${newId}`).set(initialRoomData);
        setMyRooms(prev => [...prev, { id: newId, name: customName, mode: targetMode }]);
        setRoomId(newId);
        setGroupName(customName);
        setRoomMode(targetMode);
        setCurrency(targetMode === "travel" ? "JPY" : "HKD");
        setActiveTab("expenses");
      };

      // 在「新增房間」彈窗提交表單
      const handleModalCreateRoomSubmit = (e) => {
        e.preventDefault();
        const fallbackName = modalSelectedMode === "travel" ? "東京之旅 ✈️" : "日常飯局夾錢 🍱";
        const customName = modalRoomNameInput.trim() || fallbackName;

        if (modalSelectedMode === "travel" && !isPro) {
          setShowCreateRoomModal(false);
          triggerPaywall(
            "Copay Travel 早鳥永久解鎖：$38 (原價 $88)",
            `準備出發去「${customName}」？趁限時早鳥優惠以 HK$ 38（原價 $88）永久解鎖 Copay Travel，即刻開立專屬海外旅遊房間，並免費包攬未來 AI 掃描單據自動入帳更新！`,
            () => {
              createSeparateRoomWithMode(customName, "travel");
              setModalRoomNameInput("");
            }
          );
          return;
        }

        createSeparateRoomWithMode(customName, modalSelectedMode);
        setModalRoomNameInput("");
        setShowCreateRoomModal(false);
      };

      const handleJoinRoomByCode = (e) => {
        e.preventDefault();
        const cleanCode = sanitizeRoomId(joinRoomCodeInput);
        if (!cleanCode) return;

        db.ref(`billmate_rooms/${cleanCode}/roomMode`).once("value", (snapshot) => {
          const remoteMode = snapshot.val();
          const isRemoteTravel = remoteMode === "travel" || remoteMode === "triptab";

          if (isRemoteTravel && !isPro) {
            triggerPaywall(
              "Copay Travel 早鳥永久解鎖：$38 (原價 $88)",
              `房間 #${cleanCode} 屬於「Copay Travel 海外旅遊房間」（支援外幣自動匯率與公數錢包）。趁早鳥優惠 HK$ 38（原價 $88）一次買斷，即可永久加入並開啟無限個海外旅遊房間！`,
              () => {
                setRoomId(cleanCode);
                setJoinRoomCodeInput("");
                setActiveTab("expenses");
              }
            );
            return;
          }

          setRoomId(cleanCode);
          setJoinRoomCodeInput("");
          setActiveTab("expenses");
        });
      };

      // 切換進階拆帳邏輯
      const handleToggleAdvancedSplit = () => {
        if (!useAdvancedSplit && !isPro) {
          triggerPaywall(
            "Copay Travel 早鳥永久解鎖：$38 (原價 $88)",
            "想處理「呢餐飯 A 墊支，但 B 同 C 唔飲酒所以少夾 $50」或者「某人買多咗手信要多夾 $100」？立即把握早鳥優惠 HK$ 38（原價 $88）永久解鎖進階拆帳與所有旅遊功能！",
            () => {
              setUseAdvancedSplit(true);
            }
          );
          return;
        }
        setUseAdvancedSplit(prev => !prev);
      };

      const handleAdjustmentChange = (memberName, valStr) => {
        setSplitAdjustments(prev => ({
          ...prev,
          [memberName]: valStr
        }));
      };

      // 匯出 CSV 試算表
      const handleExportExcelCSV = () => {
        if (!isPro) {
          triggerPaywall(

      const totalHKD = useMemo(() => {

      }, [expenses, rates]);

      // 計算單筆開支每位成員嘅實際分攤金額 (HKD)
      const calculateMemberSharesHKD = (exp, validSplitMembers) => {
        const totalExpHKD = toHKD(Number(exp.amount), exp.currency);
        const count = validSplitMembers.length;
        if (count === 0) return {};

        const adjustments = exp.splitAdjustments || {};
        let totalAdjHKD = 0;
        const memberAdjHKD = {};

        validSplitMembers.forEach(m => {
          const rawAdj = Number(adjustments[m]) || 0;
          const adjHKD = toHKD(rawAdj, exp.currency);
          memberAdjHKD[m] = adjHKD;
          totalAdjHKD += adjHKD;
        });

        const baseShareHKD = (totalExpHKD - totalAdjHKD) / count;
        const result = {};
        validSplitMembers.forEach(m => {
          result[m] = Math.max(0, baseShareHKD + (memberAdjHKD[m] || 0));
        });
        return result;
      };

      // ==========================================
      // 📅 Copay Travel 第一頁專屬：按日期 (Day 1, Day 2...) 分組
      // ==========================================
      const travelDailyGroups = useMemo(() => {
        if (!expenses || expenses.length === 0) return [];
        const uniqueDatesAsc = Array.from(new Set(expenses.map(e => e.date || "未知日期"))).sort();
        const dayIndexMap = {};
        uniqueDatesAsc.forEach((d, idx) => {
          dayIndexMap[d] = idx + 1;
        });

        const uniqueDatesDesc = [...uniqueDatesAsc].reverse();
        return uniqueDatesDesc.map(d => {
          const items = expenses.filter(e => (e.date || "未知日期") === d);
          const dayTotalHKD = items.reduce((sum, e) => sum + toHKD(Number(e.amount), e.currency), 0);
          return {
            date: d,
            ukDate: formatDateUK(d),
            dayNum: dayIndexMap[d] || 1,
            items,
            dayTotalHKD
          };
        });
      }, [expenses, rates]);

      const toggleDayCollapse = (dateKey) => {

          [dateKey]: !prev[dateKey]
        }));

      // ==========================================
      // ⚡ 結算與重算邏輯
      // ==========================================
      const settlement = useMemo(() => {
        const balances = {};
        const deletedPayersNegative = {};

        members.forEach(m => {
          const poolPaid = isTravelMode ? (Number(poolContributions[m]) || 0) : 0;
          balances[m] = poolPaid;
        });

        expenses.forEach(exp => {
          const hkdAmount = toHKD(Number(exp.amount), exp.currency);
          let activeSplits = (exp.splitWith || []).filter(p => members.includes(p));
          if (activeSplits.length === 0) {
            activeSplits = [...members];
          }

          if (exp.payer !== POOL_PAYER_KEY && !exp.isPoolExpense) {
            if (members.includes(exp.payer)) {
              balances[exp.payer] += hkdAmount;
            } else {
              deletedPayersNegative[exp.payer] = (deletedPayersNegative[exp.payer] || 0) - hkdAmount;
            }
          } else if (!isTravelMode) {
            return;
          }

          const sharesMap = calculateMemberSharesHKD(exp, activeSplits);
          activeSplits.forEach(p => {
            balances[p] -= (sharesMap[p] || 0);
          });
        });

        if (isTravelMode && poolStats.remainingPoolHKD > 0 && poolStats.totalContributedHKD > 0) {
          members.forEach(m => {
            const myContrib = Number(poolContributions[m]) || 0;
            const myRefundShare = (myContrib / poolStats.totalContributedHKD) * poolStats.remainingPoolHKD;
            balances[m] -= myRefundShare;
          });
        }

        const debtors = [];
        const creditors = [];
        Object.keys(balances).forEach(m => {
          const val = Math.round(balances[m]);
          if (val < -1) debtors.push({ name: m, amount: -val });
          else if (val > 1) creditors.push({ name: m, amount: val });
        });

        debtors.sort((a, b) => b.amount - a.amount);
        creditors.sort((a, b) => b.amount - a.amount);

        const transactions = [];
        let i = 0, j = 0;
        while (i < debtors.length && j < creditors.length) {
          const deb = debtors[i];
          const cred = creditors[j];
          const settleAmt = Math.min(deb.amount, cred.amount);
          const fromName = deb.name;
          const toName = cred.name;
          const txKey = `${fromName}_TO_${toName}`.replace(/[.#$\[\]\/]/g, "_");
          transactions.push({
            key: txKey,
            from: fromName,
            to: toName,
            amount: Math.round(settleAmt)
          });
          deb.amount -= settleAmt;
          cred.amount -= settleAmt;
          if (deb.amount === 0) i++;
          if (cred.amount === 0) j++;
        }
        return { balances, deletedPayersNegative, transactions };
      }, [expenses, members, rates, poolContributions, isTravelMode, poolStats]);

      // ==========================================
      // 📊 報告與圖表數據計算
      // ==========================================
      const reportAvailableDates = useMemo(() => {

          const parts = e.date.split("-");
          if (parts[0]) years.add(parts[0]);
          if (parts[1]) months.add(parts[1]);
          if (parts[2]) days.add(parts[2]);

        return {
          years: Array.from(years).sort().reverse(),
          months: Array.from(months).sort(),
          days: Array.from(days).sort()
        };

          if (reportMonth !== "ALL" && m !== reportMonth) return false;
          if (reportDay !== "ALL" && d !== reportDay) return false;

          catMap[cat] = (catMap[cat] || 0) + hkd;

        const categoryBreakdown = Object.entries(catMap)
          .map(([cat, val]) => ({
            category: cat,
            amountHKD: val,
            percent: totalFilteredHKD > 0 ? Math.round((val / totalFilteredHKD) * 100) : 0
          }))
          .sort((a, b) => b.amountHKD - a.amountHKD);

        list.forEach(exp => {

          (exp.splitWith || []).forEach(p => participantSet.add(p));

          if (validSplits.length > 0) {

            validSplits.forEach(p => {

                if (exp.payer !== p) personStats[p].eventCount += 1;
              }
            });
          }
        });

        const personArray = Object.values(personStats)
          .filter(p => !p.isDeleted || p.eventCount > 0 || p.paidHKD > 0 || p.shareHKD > 0)
          .map(p => ({
            ...p,
            netHKD: p.isDeleted && p.paidHKD > 0 ? -p.paidHKD : (p.paidHKD - p.shareHKD)
          }))
          .sort((a, b) => b.shareHKD - a.shareHKD);

        const maxShareHKD = personArray.reduce((max, p) => Math.max(max, p.shareHKD), 0);

        return { list, totalFilteredHKD, categoryBreakdown, personArray, maxShareHKD };
      }, [expenses, isTravelMode, reportYear, reportMonth, reportDay, members, rates]);
