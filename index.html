<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>BillMate 🤝 日常與旅遊夾錢神器</title>
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BillMate" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#7A9D8C" />

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase Compat SDKs (App + Realtime Database) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    input, select, textarea {
      user-select: auto;
    }
    .soft-shadow {
      box-shadow: 4px 6px 16px rgba(180, 170, 160, 0.15), -4px -4px 12px rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body class="bg-[#F3ECE4] text-[#4A423B] antialiased min-h-screen font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 初始化 Firebase
    const firebaseConfig = {
      databaseURL: "https://travel-split-app-78a36-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 常用貨幣清單
    const DEFAULT_RATES = {
      HKD: 1.0,
      JPY: 0.052,
      TWD: 0.245,
      SGD: 5.82,
      KRW: 0.0058,
      THB: 0.22,
      EUR: 8.45,
      GBP: 9.95,
      USD: 7.78,
      AUD: 5.15,
      CNY: 1.08,
      MOP: 0.97,
      CAD: 5.75,
      CHF: 8.85,
      VND: 0.00031
    };

    const DEFAULT_MEMBERS = ["我", "Alex", "Chloe", "Sam"];
    const FREE_ROOM_QUOTA = 2;
    const VALID_VIP_CODES = ["BILLMATE2026", "VIP888", "TRAVELPRO"];

    const sanitizeRoomId = (raw) => {
      return (raw || "LUNCH-CREW").trim().toUpperCase().replace(/[.#$\[\]\/]/g, "-");
    };

    const getStoredRooms = () => {
      try {
        const saved = JSON.parse(localStorage.getItem("billmate_my_rooms"));
        if (Array.isArray(saved) && saved.length > 0) return saved;
      } catch (e) {}
      return ["LUNCH-CREW"];
    };

    const getInitialRoom = () => {
      const params = new URLSearchParams(window.location.search);
      const urlRoom = params.get("room");
      if (urlRoom) return sanitizeRoomId(urlRoom);
      const rooms = getStoredRooms();
      return rooms[0] || "LUNCH-CREW";
    };

    function App() {
      // 帳號與 Quota 狀態
      const [myRooms, setMyRooms] = useState(getStoredRooms);
      const [isPro, setIsPro] = useState(() => localStorage.getItem("billmate_is_pro") === "true");
      const [showPaywall, setShowPaywall] = useState(false);
      const [pendingRoomId, setPendingRoomId] = useState("");
      const [vipInput, setVipInput] = useState("");
      const [paywallMsg, setPaywallMsg] = useState("");

      // 房間切換狀態
      const [roomId, setRoomId] = useState(getInitialRoom);
      const [roomInput, setRoomInput] = useState("");
      const [syncStatus, setSyncStatus] = useState("connecting");

      // 群組雲端同步資料
      const [groupName, setGroupName] = useState("日常飯局夾錢 🍱");
      const [roomMode, setRoomMode] = useState("daily"); // daily | travel
      const [members, setMembers] = useState(DEFAULT_MEMBERS);
      const [expenses, setExpenses] = useState([]);
      const [customRates, setCustomRates] = useState({});

      // UI 狀態
      const [activeTab, setActiveTab] = useState("expenses");
      const [newMemberName, setNewMemberName] = useState("");
      const [liveRates, setLiveRates] = useState(DEFAULT_RATES);
      const [rateUpdatedText, setRateUpdatedText] = useState("載入中...");
      const [newCurCode, setNewCurCode] = useState("");
      const [newCurRate, setNewCurRate] = useState("");

      // 表單輸入
      const [title, setTitle] = useState("");
      const [amount, setAmount] = useState("");
      const [currency, setCurrency] = useState("HKD");
      const [payer, setPayer] = useState("我");
      const [splitWith, setSplitWith] = useState(DEFAULT_MEMBERS);
      const [category, setCategory] = useState("餐飲美食");
      const [date, setDate] = useState(new Date().toISOString().split("T")[0]);

      const rates = useMemo(() => ({ ...liveRates, ...customRates }), [liveRates, customRates]);

      // 同步儲存本地房間清單與 Pro 狀態
      useEffect(() => {
        localStorage.setItem("billmate_my_rooms", JSON.stringify(myRooms));
      }, [myRooms]);

      useEffect(() => {
        localStorage.setItem("billmate_is_pro", isPro ? "true" : "false");
      }, [isPro]);

      // 若透過邀請連結進入新房號，自動記錄到 myRooms
      useEffect(() => {
        if (!myRooms.includes(roomId)) {
          setMyRooms(prev => [...prev, roomId]);
        }
      }, [roomId]);

      // 1. 載入即時公開匯率 API
      useEffect(() => {
        fetch("https://open.er-api.com/v6/latest/HKD")
          .then(res => res.json())
          .then(data => {
            if (data && data.rates) {
              const updated = {};
              Object.keys(DEFAULT_RATES).forEach(cur => {
                if (cur === "HKD") {
                  updated[cur] = 1.0;
                } else if (data.rates[cur]) {
                  updated[cur] = Number((1 / data.rates[cur]).toFixed(5));
                } else {
                  updated[cur] = DEFAULT_RATES[cur];
                }
              });
              setLiveRates(prev => ({ ...prev, ...updated }));
              setRateUpdatedText(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
            }
          })
          .catch(() => {
            setRateUpdatedText("基準匯率");
          });
      }, []);

      // 2. 監聽當前 Firebase 房間數據
      useEffect(() => {
        setSyncStatus("connecting");

        const url = new URL(window.location);
        url.searchParams.set("room", roomId);
        window.history.replaceState({}, "", url);

        const roomRef = db.ref(`billmate_rooms/${roomId}`);

        const handleValue = (snapshot) => {
          const data = snapshot.val();
          if (data) {
            setGroupName(data.groupName || `${roomId} 群組帳本`);
            const mode = data.roomMode || "daily";
            setRoomMode(mode);
            if (mode === "daily" && currency !== "HKD" && !isPro) {
              setCurrency("HKD");
            }

            const loadedMembers = Array.isArray(data.members) && data.members.length > 0 ? data.members : DEFAULT_MEMBERS;
            setMembers(loadedMembers);
            setPayer(prev => loadedMembers.includes(prev) ? prev : loadedMembers[0]);
            setSplitWith(prev => {
              const valid = prev.filter(m => loadedMembers.includes(m));
              return valid.length > 0 ? valid : loadedMembers;
            });

            if (data.expenses) {
              const expList = Object.values(data.expenses).sort((a, b) => {
                const dateA = new Date(a.date).getTime();
                const dateB = new Date(b.date).getTime();
                if (dateA !== dateB) return dateB - dateA;
                return (b.id || 0) - (a.id || 0);
              });
              setExpenses(expList);
            } else {
              setExpenses([]);
            }

            setCustomRates(data.customRates || {});
          } else {
            const initialRoomData = {
              groupName: roomId === "LUNCH-CREW" ? "日常飯局夾錢 🍱" : `${roomId} 帳本`,
              roomMode: "daily",
              members: DEFAULT_MEMBERS,
              expenses: {},
              customRates: {},
              createdAt: Date.now()
            };
            roomRef.set(initialRoomData);
          }
          setSyncStatus("synced");
        };

        const handleError = () => setSyncStatus("error");

        roomRef.on("value", handleValue, handleError);
        return () => roomRef.off("value", handleValue);
      }, [roomId]);

      // 嘗試切換或建立新房間（檢查 2 個免費 Quota）
      const attemptEnterRoom = (targetRaw) => {
        const clean = sanitizeRoomId(targetRaw);
        if (!clean) return;

        // 如果已經喺自己嘅清單入面，或者已經係 Pro 用戶，直接進入
        if (myRooms.includes(clean) || isPro) {
          setRoomId(clean);
          setRoomInput("");
          if (!myRooms.includes(clean)) {
            setMyRooms(prev => [...prev, clean]);
          }
          return;
        }

        // 檢查免費 Quota 是否已滿（2 個）
        if (myRooms.length >= FREE_ROOM_QUOTA) {
          setPendingRoomId(clean);
          setPaywallMsg(`免費版最多支援 ${FREE_ROOM_QUOTA} 個活躍項目（你目前已使用 ${myRooms.length}/${FREE_ROOM_QUOTA} 個額度）。升級 BillMate Pro 即解鎖無限房間及專屬旅遊多幣種模式！`);
          setShowPaywall(true);
        } else {
          setMyRooms(prev => [...prev, clean]);
          setRoomId(clean);
          setRoomInput("");
        }
      };

      const handleSwitchRoomForm = (e) => {
        e.preventDefault();
        attemptEnterRoom(roomInput);
      };

      // 切換「日常模式」vs「旅遊專案模式 (Pro)」
      const handleToggleMode = (targetMode) => {
        if (targetMode === "travel" && !isPro) {
          setPaywallMsg("「旅遊專案模式」支援多國貨幣自動混合記帳、即時自動匯率更新及旅行專屬分類，屬於 BillMate Pro 進階功能！");
          setShowPaywall(true);
          return;
        }
        setRoomMode(targetMode);
        if (targetMode === "daily") setCurrency("HKD");
        if (targetMode === "travel") setCurrency("JPY");
        db.ref(`billmate_rooms/${roomId}/roomMode`).set(targetMode);
      };

      // 解鎖 Pro（模擬一鍵購買或輸入 VIP 解鎖碼）
      const handleUnlockWithCode = (e) => {
        e.preventDefault();
        const code = vipInput.trim().toUpperCase();
        if (VALID_VIP_CODES.includes(code)) {
          setIsPro(true);
          setShowPaywall(false);
          setVipInput("");
          if (pendingRoomId) {
            setMyRooms(prev => prev.includes(pendingRoomId) ? prev : [...prev, pendingRoomId]);
            setRoomId(pendingRoomId);
            setPendingRoomId("");
          }
          alert("🎉 驗證成功！已為你開通 BillMate Pro 永久版權限！");
        } else {
          alert("❌ 解鎖碼無效！測試可用解鎖碼：BILLMATE2026");
        }
      };

      const handleSimulatePurchase = (planName) => {
        setIsPro(true);
        setShowPaywall(false);
        if (pendingRoomId) {
          setMyRooms(prev => prev.includes(pendingRoomId) ? prev : [...prev, pendingRoomId]);
          setRoomId(pendingRoomId);
          setPendingRoomId("");
        }
        alert(`🎉 感謝支持！已成功模擬開通【${planName}】，所有旅遊進階功能及無限房間已解鎖！`);
      };

      const handleGroupNameBlur = () => {
        db.ref(`billmate_rooms/${roomId}/groupName`).set(groupName);
      };

      const handleAddExpense = (e) => {
        e.preventDefault();
        if (!title || !amount || splitWith.length === 0 || !date) return;
        const id = Date.now();
        const newExp = {
          id,
          title,
          amount: parseFloat(amount),
          currency: isPro || roomMode === "travel" ? currency : "HKD",
          payer,
          splitWith,
          category,
          date
        };
        db.ref(`billmate_rooms/${roomId}/expenses/${id}`).set(newExp);
        setTitle("");
        setAmount("");
      };

      const handleDeleteExpense = (id) => {
        db.ref(`billmate_rooms/${roomId}/expenses/${id}`).remove();
      };

      const handleAddMember = () => {
        const name = newMemberName.trim();
        if (!name || members.includes(name)) return;
        if (!isPro && members.length >= 4) {
          setPaywallMsg("免費版每個項目最多支援 4 位成員夾錢。升級 BillMate Pro 即可解鎖無限人數（適合大型旅行或團隊活動）！");
          setShowPaywall(true);
          return;
        }
        const updated = [...members, name];
        db.ref(`billmate_rooms/${roomId}/members`).set(updated);
        setSplitWith(updated);
        setNewMemberName("");
      };

      const handleRemoveMember = (name) => {
        if (members.length <= 2) return;
        const updated = members.filter(x => x !== name);
        db.ref(`billmate_rooms/${roomId}/members`).set(updated);
      };

      const handleRateChange = (cur, val) => {
        const num = parseFloat(val);
        if (isNaN(num) || num <= 0) return;
        db.ref(`billmate_rooms/${roomId}/customRates/${cur}`).set(num);
      };

      const handleAddCustomCurrency = (e) => {
        e.preventDefault();
        const code = newCurCode.trim().toUpperCase();
        const rateVal = parseFloat(newCurRate);
        if (code.length !== 3 || isNaN(rateVal) || rateVal <= 0) return;
        db.ref(`billmate_rooms/${roomId}/customRates/${code}`).set(rateVal);
        setCurrency(code);
        setNewCurCode("");
        setNewCurRate("");
      };

      const toHKD = (amt, curr) => {
        const r = rates[curr] || 1;
        return amt * r;
      };

      const totalHKD = useMemo(() => {
        return expenses.reduce((acc, exp) => acc + toHKD(Number(exp.amount), exp.currency), 0);
      }, [expenses, rates]);

      const settlement = useMemo(() => {
        const balances = {};
        members.forEach(m => balances[m] = 0);

        expenses.forEach(exp => {
          const hkdAmount = toHKD(Number(exp.amount), exp.currency);
          const validSplits = (exp.splitWith || []).filter(p => balances[p] !== undefined);
          if (validSplits.length === 0) return;

          const share = hkdAmount / validSplits.length;
          if (balances[exp.payer] !== undefined) balances[exp.payer] += hkdAmount;
          validSplits.forEach(p => { balances[p] -= share; });
        });

        const debtors = [];
        const creditors = [];
        Object.keys(balances).forEach(m => {
          const val = Math.round(balances[m]);
          if (val < -1) debtors.push({ name: m, amount: -val });
          else if (val > 1) creditors.push({ name: m, amount: val });
        });

        debtors.sort((a, b) => b.amount - a.amount);
        creditors.sort((a, b) => b.amount - a.amount);

        const transactions = [];
        let i = 0, j = 0;
        while (i < debtors.length && j < creditors.length) {
          const deb = debtors[i];
          const cred = creditors[j];
          const settleAmt = Math.min(deb.amount, cred.amount);
          transactions.push({ from: deb.name, to: cred.name, amount: Math.round(settleAmt) });
          deb.amount -= settleAmt;
          cred.amount -= settleAmt;
          if (deb.amount === 0) i++;
          if (cred.amount === 0) j++;
        }
        return { balances, transactions };
      }, [expenses, members, rates]);

      const shareRoomLink = () => {
        const shareUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(roomId)}`;
        const msg = `🤝 一齊用 BillMate「${groupName}」夾錢記帳！
👉 直接撳連結入房（房號：${roomId}）：
${shareUrl}`;
        navigator.clipboard.writeText(msg);
        alert(`已複製邀請連結！直接貼去 WhatsApp 群組，朋友一撳就會自動入房「${roomId}」📲`);
      };

      const copyToWhatsApp = () => {
        let text = `🤝【BillMate · ${groupName}】結算清單 📊
`;
        text += `房號：${roomId} ｜ 總開支：HK$ ${Math.round(totalHKD).toLocaleString()}
`;
        text += `------------------------
`;
        text += `【過數指引 / FPS / PayMe】：
`;
        if (settlement.transactions.length === 0) {
          text += `✅ 大家帳目已平衡，互不相欠！
`;
        } else {
          settlement.transactions.forEach(t => {
            text += `👉 ${t.from} 需過數 HK$ ${t.amount.toLocaleString()} 畀 ${t.to}
`;
          });
        }
        text += `------------------------
`;
        text += `大家 check 下有冇問題！🍻`;
        navigator.clipboard.writeText(text);
        alert("已複製 WhatsApp 結算清單！可以直接貼去群組！📲");
      };

      // 根據模式顯示不同預設類別
      const categoryOptions = roomMode === "travel"
        ? ["🍱 餐飲美食", "🚗 交通租車", "🏨 住宿酒店", "🎟️ 門票活動", "🛍️ 購物手信", "✈️ 機票保險", "💡 其他雜費"]
        : ["🍱 餐飲美食", "🛒 超市買餸", "🏠 租金水電", "🎬 娛樂聚會", "🚕 的士車費", "📦 網購團購", "💡 其他雜費"];

      return (
        <div className="max-w-md mx-auto min-h-screen bg-[#F3ECE4] flex flex-col pb-24 shadow-2xl relative">
          
          {/* Header */}
          <div className="bg-gradient-to-br from-[#7A9D8C] via-[#9EB09E] to-[#E5AB99] text-white p-6 rounded-b-[2rem] shadow-sm relative overflow-hidden">
            <div className="absolute top-[-20%] right-[-10%] w-48 h-48 bg-white opacity-10 rounded-full blur-2xl pointer-events-none"></div>

            {/* Brand Bar + Quota Badge */}
            <div className="flex justify-between items-center mb-3 relative z-10">
              <div className="flex items-center gap-2">
                <div className="w-7 h-7 rounded-xl bg-white/25 backdrop-blur-md flex items-center justify-center font-black text-sm border border-white/30">
                  🤝
                </div>
                <span className="font-extrabold tracking-tight text-base">BillMate</span>
                {isPro ? (
                  <span className="text-[10px] bg-amber-300/90 text-[#4A423B] px-2 py-0.5 rounded-full font-black tracking-wide shadow-sm">
                    PRO 旅遊版 ✨
                  </span>
                ) : (
                  <button
                    onClick={() => {
                      setPaywallMsg("升級 BillMate Pro，立即解鎖無限項目房間、旅遊多幣種自動匯率及無上限成員功能！");
                      setShowPaywall(true);
                    }}
                    className="text-[10px] bg-white/20 hover:bg-white/30 text-white px-2.5 py-0.5 rounded-full font-bold border border-white/25 transition"
                  >
                    免費額度 {myRooms.length}/{FREE_ROOM_QUOTA} 房 · 升級
                  </button>
                )}
              </div>
              <button onClick={shareRoomLink} className="text-xs bg-white/20 hover:bg-white/30 backdrop-blur-md text-white px-3 py-1 rounded-full font-bold shadow-sm transition border border-white/20">
                🔗 邀請
              </button>
            </div>

            {/* Room ID & Mode Switcher */}
            <div className="flex items-center justify-between mt-2 relative z-10">
              <div className="flex items-center gap-1.5">
                <span className="text-[11px] bg-black/15 px-2.5 py-1 rounded-full font-mono font-medium flex items-center gap-1.5">
                  <span className={`w-2 h-2 rounded-full ${syncStatus === 'synced' ? 'bg-[#98D8A7]' : syncStatus === 'connecting' ? 'bg-[#F2D0A4] animate-ping' : 'bg-[#E57A7A]'}`}></span>
                  {roomId}
                </span>
                <span className="text-[11px] bg-white/20 px-2.5 py-1 rounded-full font-bold">
                  {roomMode === "travel" ? "✈️ 旅遊專案" : "☕ 日常夾錢"}
                </span>
              </div>
              {roomMode === "travel" && (
                <span className="text-[10px] text-white/85">匯率: {rateUpdatedText}</span>
              )}
            </div>
            
            <h1 className="text-2xl font-bold tracking-tight mt-2 text-white drop-shadow-sm relative z-10">{groupName}</h1>
            
            <div className="mt-4 flex justify-between items-end bg-white/15 p-4 rounded-3xl backdrop-blur-md border border-white/20 relative z-10 shadow-sm">
              <div>
                <p className="text-[11px] text-white/85 mb-0.5">總開支折合 (HKD)</p>
                <p className="text-3xl font-bold tracking-tight">HK$ {Math.round(totalHKD).toLocaleString()}</p>
              </div>
              <div className="text-right">
                <p className="text-[11px] text-white/85 mb-0.5">參與成員</p>
                <p className="text-lg font-bold">{members.length} {!isPro && "/ 4"} 人</p>
              </div>
            </div>
          </div>

          {/* Navigation Tabs */}
          <div className="flex bg-[#FCFAF6] mx-5 mt-5 p-1.5 rounded-full soft-shadow border border-[#EBE3DB]">
            <button onClick={() => setActiveTab("expenses")} className={`flex-1 py-2.5 text-xs font-bold rounded-full transition-all duration-300 ${activeTab === 'expenses' ? 'bg-[#7A9D8C] text-white shadow-sm' : 'text-[#A09990] hover:bg-[#F3ECE4]'}`}>
              記帳明細
            </button>
            <button onClick={() => setActiveTab("settle")} className={`flex-1 py-2.5 text-xs font-bold rounded-full transition-all duration-300 ${activeTab === 'settle' ? 'bg-[#7A9D8C] text-white shadow-sm' : 'text-[#A09990] hover:bg-[#F3ECE4]'}`}>
              結算夾錢
            </button>
            <button onClick={() => setActiveTab("rates")} className={`flex-1 py-2.5 text-xs font-bold rounded-full transition-all duration-300 ${activeTab === 'rates' ? 'bg-[#7A9D8C] text-white shadow-sm' : 'text-[#A09990] hover:bg-[#F3ECE4]'}`}>
              項目與設定
            </button>
          </div>

          <div className="p-5 flex-1 space-y-5">
            {/* 1. 記帳分頁 */}
            {activeTab === "expenses" && (
              <>
                <form onSubmit={handleAddExpense} className="bg-[#FCFAF6] p-5 rounded-3xl soft-shadow border border-[#EBE3DB] space-y-4">
                  <div className="flex justify-between items-center border-b border-[#EBE3DB] pb-3">
                    <h3 className="font-bold text-[#5C544D] text-sm">➕ 記低一筆新開支</h3>
                    <button
                      type="button"
                      onClick={() => handleToggleMode(roomMode === "daily" ? "travel" : "daily")}
                      className="text-[10px] font-bold px-2.5 py-1 rounded-full bg-[#F3ECE4] text-[#7A9D8C] border border-[#DFD6CD] flex items-center gap-1"
                    >
                      {roomMode === "daily" ? "🔒 切換旅遊多幣種模式" : "✈️ 旅遊多幣種已啟用"}
                    </button>
                  </div>

                  <div className="flex gap-3">
                    <div className="flex-1">
                      <label className="block text-[10px] text-[#A09990] font-bold mb-1 ml-1">類別</label>
                      <select value={category} onChange={e => setCategory(e.target.value)} className="w-full text-sm bg-[#F3ECE4] border border-transparent rounded-2xl px-3 py-3 text-[#5C544D] font-medium focus:outline-none focus:ring-2 focus:ring-[#7A9D8C] transition">
                        {categoryOptions.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                      </select>
                    </div>
                    <div className="flex-1">
                      <label className="block text-[10px] text-[#A09990] font-bold mb-1 ml-1">單據日期</label>
                      <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full text-sm bg-[#F3ECE4] border border-transparent rounded-2xl px-3 py-3 text-[#5C544D] font-medium focus:outline-none focus:ring-2 focus:ring-[#7A9D8C] transition" required />
                    </div>
                  </div>

                  <div>
                    <label className="block text-[10px] text-[#A09990] font-bold mb-1 ml-1">項目名稱</label>
                    <input type="text" placeholder={roomMode === "travel" ? "例如: 居酒屋晚餐、租車油錢" : "例如: 譚仔午餐、超市買餸"} value={title} onChange={e => setTitle(e.target.value)} className="w-full text-sm bg-[#F3ECE4] border border-transparent rounded-2xl px-4 py-3 text-[#5C544D] font-medium focus:outline-none focus:ring-2 focus:ring-[#7A9D8C] transition placeholder-[#BDB7B0]" required />
                  </div>

                  <div>
                    <label className="block text-[10px] text-[#A09990] font-bold mb-1 ml-1">消費金額</label>
                    <div className="flex gap-2">
                      <div className="relative flex-1">
                        <input type="number" step="any" placeholder="金額" value={amount} onChange={e => setAmount(e.target.value)} className="w-full text-base bg-[#F3ECE4] border border-transparent rounded-2xl px-4 py-3 font-bold text-[#5C544D] focus:outline-none focus:ring-2 focus:ring-[#7A9D8C] transition placeholder-[#BDB7B0]" required />
                      </div>
                      {isPro || roomMode === "travel" ? (
                        <select value={currency} onChange={e => setCurrency(e.target.value)} className="bg-[#F3ECE4] border border-transparent rounded-2xl px-4 py-3 text-sm font-bold text-[#7A9D8C] focus:outline-none focus:ring-2 focus:ring-[#7A9D8C] transition">
                          {Object.keys(rates).map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                      ) : (
                        <button
                          type="button"
                          onClick={() => handleToggleMode("travel")}
                          className="bg-[#F3ECE4] rounded-2xl px-3.5 py-3 text-xs font-bold text-[#8C847D] flex items-center gap-1 border border-[#E2D9D0]"
                        >
                          HKD <span className="text-[10px] text-[#DF9A84]">🔒外幣</span>
                        </button>
                      )}
                    </div>
                  </div>

                  <div className="text-xs pt-1">
                    <label className="block text-[10px] text-[#A09990] font-bold mb-2 ml-1">邊個墊支先？</label>
                    <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
                      {members.map(m => (
                        <button key={m} type="button" onClick={() => setPayer(m)} className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${payer === m ? 'bg-[#7A9D8C] text-white shadow-sm' : 'bg-[#F3ECE4] text-[#8C847D] hover:bg-[#EBE3DB]'}`}>
                          {m}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="text-xs">
                    <div className="flex justify-between items-center mb-2 mx-1">
                      <label className="text-[10px] text-[#A09990] font-bold">邊個夾份？</label>
                      <button type="button" onClick={() => setSplitWith(splitWith.length === members.length ? [payer] : members)} className="text-[#DF9A84] font-bold hover:opacity-80 transition text-[10px] bg-[#FCFAF6] px-2 py-0.5 rounded-full border border-[#EAE2DA]">
                        {splitWith.length === members.length ? '淨係自己' : '全部人夾'}
                      </button>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      {members.map(m => {
                        const isSelected = splitWith.includes(m);
                        return (
                          <button key={m} type="button" onClick={() => {
                            if (isSelected) {
                              if (splitWith.length > 1) setSplitWith(splitWith.filter(x => x !== m));
                            } else {
                              setSplitWith([...splitWith, m]);
                            }
                          }} className={`px-3 py-1.5 rounded-xl text-xs font-medium transition-all border ${isSelected ? 'bg-[#F1EBE4] border-[#D4C8BC] text-[#5C544D] font-bold shadow-sm' : 'bg-transparent border-[#EBE3DB] text-[#A09990] opacity-70'}`}>
                            {isSelected ? '✓ ' : ''}{m}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                  
                  <div className="pt-2">
                    <button type="submit" className="w-full bg-[#E5AB99] text-white font-bold py-3.5 rounded-2xl shadow-sm hover:bg-[#D49A88] transition-all text-sm tracking-wide">
                      同步加入開支
                    </button>
                  </div>
                </form>

                <div className="space-y-3">
                  <h3 className="font-bold text-[#8C847D] text-xs flex justify-between items-center px-2">
                    <span>開支明細</span>
                    <span className="font-medium bg-[#EAE2DA] px-2 py-0.5 rounded-full">{expenses.length} 筆</span>
                  </h3>
                  {expenses.length === 0 ? (
                    <div className="bg-[#FCFAF6] p-8 rounded-3xl border border-dashed border-[#D4C8BC] text-center text-xs text-[#A09990]">
                      暫時未有開支記錄，喺上面入第一筆數啦！🤝
                    </div>
                  ) : (
                    expenses.map(exp => (
                      <div key={exp.id} className="bg-[#FCFAF6] p-4 rounded-3xl soft-shadow border border-[#EBE3DB] flex flex-col gap-2">
                        <div className="flex justify-between items-start">
                          <div className="flex items-center gap-2">
                            <span className="text-[10px] bg-[#F3ECE4] text-[#8C847D] px-2 py-1 rounded-lg font-bold">{exp.category}</span>
                            <span className="font-bold text-[#5C544D] text-sm">{exp.title}</span>
                          </div>
                          <div className="text-right">
                            <p className="font-extrabold text-[#4A423B] text-sm">{exp.currency} {Number(exp.amount).toLocaleString()}</p>
                          </div>
                        </div>
                        <div className="flex justify-between items-end mt-1">
                          <div className="text-[11px] text-[#A09990]">
                            <p className="mb-0.5"><span className="font-bold text-[#7A9D8C]">{exp.payer}</span> 墊支 • 畀 {(exp.splitWith || []).join(", ")}</p>
                            <p className="opacity-80">📅 {exp.date}</p>
                          </div>
                          <div className="text-right">
                            {exp.currency !== "HKD" && <p className="text-[10px] text-[#A09990] mb-1">≈ HK$ {Math.round(toHKD(exp.amount, exp.currency)).toLocaleString()}</p>}
                            <button onClick={() => handleDeleteExpense(exp.id)} className="text-[10px] text-[#DF9A84] font-bold hover:text-[#C88470] bg-[#FFF5F2] px-2 py-1 rounded-md">刪除</button>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </>
            )}

            {/* 2. 結算分頁 */}
            {activeTab === "settle" && (
              <div className="space-y-5">
                <div className="bg-[#FCFAF6] p-5 rounded-3xl soft-shadow border border-[#EBE3DB]">
                  <div className="flex justify-between items-center mb-4 border-b border-[#EBE3DB] pb-3">
                    <h3 className="font-bold text-[#5C544D] text-sm">自動簡化結算</h3>
                    <button onClick={copyToWhatsApp} className="bg-[#7A9D8C] text-white text-[11px] px-3 py-1.5 rounded-full font-bold shadow-sm hover:bg-[#688A79] transition">
                      複製清單
                    </button>
                  </div>
                  {settlement.transactions.length === 0 ? (
                    <div className="text-center py-8 text-[#A09990] text-xs bg-[#F3ECE4] rounded-2xl">
                      🌿 目前收支平衡，互不相欠！
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {settlement.transactions.map((t, idx) => (
                        <div key={idx} className="flex items-center justify-between p-3.5 bg-[#F3ECE4] rounded-2xl">
                          <div className="flex items-center gap-2">
                            <span className="font-bold text-[#5C544D] text-sm">{t.from}</span>
                            <span className="text-xs text-[#A09990]">➡️</span>
                            <span className="font-bold text-[#7A9D8C] text-sm">{t.to}</span>
                          </div>
                          <span className="font-black text-[#DF9A84] text-sm">HK$ {t.amount.toLocaleString()}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                
                <div className="bg-[#FCFAF6] p-5 rounded-3xl soft-shadow border border-[#EBE3DB]">
                  <h3 className="font-bold text-[#5C544D] text-sm mb-4 border-b border-[#EBE3DB] pb-3">個人墊支與應付分析</h3>
                  <div className="space-y-3">
                    {members.map(m => {
                      const net = Math.round(settlement.balances[m] || 0);
                      const isPositive = net > 0;
                      return (
                        <div key={m} className="flex justify-between items-center text-sm py-2 border-b border-[#F3ECE4] last:border-none">
                          <span className="font-bold text-[#5C544D]">{m}</span>
                          <span className={`font-bold px-3 py-1 rounded-full text-xs ${net === 0 ? 'bg-[#F3ECE4] text-[#A09990]' : isPositive ? 'bg-[#EAF3EB] text-[#7A9D8C]' : 'bg-[#FFF5F2] text-[#DF9A84]'}`}>
                            {net === 0 ? '收支平衡' : isPositive ? `應收回 HK$ ${net.toLocaleString()}` : `應支付 HK$ ${Math.abs(net).toLocaleString()}`}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* 3. 項目與設定分頁 */}
            {activeTab === "rates" && (
              <div className="space-y-5">
                {/* 我的項目列表 + 免費 Quota 進度 */}
                <div className="bg-[#FCFAF6] p-5 rounded-3xl soft-shadow border border-[#EBE3DB] space-y-4">
                  <div className="flex justify-between items-center border-b border-[#EBE3DB] pb-3">
                    <h3 className="font-bold text-[#5C544D] text-sm">📂 我的夾錢項目</h3>
                    <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full ${isPro ? 'bg-amber-100 text-amber-800' : 'bg-[#F3ECE4] text-[#7A9D8C]'}`}>
                      {isPro ? "Pro 無限額度 ✨" : `免費額度：${myRooms.length} / ${FREE_ROOM_QUOTA}`}
                    </span>
                  </div>

                  {/* 快速切換已建立的房間 */}
                  <div className="flex flex-wrap gap-2">
                    {myRooms.map(r => (
                      <button
                        key={r}
                        type="button"
                        onClick={() => attemptEnterRoom(r)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-mono font-bold transition border ${roomId === r ? 'bg-[#7A9D8C] text-white border-[#7A9D8C] shadow-sm' : 'bg-[#F3ECE4] text-[#5C544D] border-transparent hover:border-[#D4C8BC]'}`}
                      >
                        {roomId === r ? '● ' : ''}{r}
                      </button>
                    ))}
                  </div>

                  <form onSubmit={handleSwitchRoomForm} className="flex gap-2 pt-1">
                    <input type="text" placeholder="開新項目 / 輸入房號 (如 OKINAWA27)" value={roomInput} onChange={e => setRoomInput(e.target.value.toUpperCase())} className="flex-1 text-xs bg-[#F3ECE4] rounded-2xl px-3.5 py-3 font-mono font-bold uppercase focus:outline-none focus:ring-2 focus:ring-[#7A9D8C] text-[#5C544D] placeholder-[#BDB7B0]" />
                    <button type="submit" className="bg-[#7A9D8C] text-white text-xs font-bold px-4 rounded-2xl shadow-sm hover:bg-[#688A79] transition whitespace-nowrap">
                      {!isPro && myRooms.length >= FREE_ROOM_QUOTA ? "🔒 開新房" : "＋ 開新房"}
                    </button>
                  </form>
                </div>

                {/* 項目模式切換（日常 vs 旅遊） */}
                <div className="bg-[#FCFAF6] p-5 rounded-3xl soft-shadow border border-[#EBE3DB] space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-[#5C544D] text-sm">🎯 項目用途模式</h3>
                    {!isPro && <span className="text-[10px] text-[#DF9A84] font-bold">旅遊模式需 Pro</span>}
                  </div>
                  <div className="grid grid-cols-2 gap-2.5">
                    <button
                      type="button"
                      onClick={() => handleToggleMode("daily")}
                      className={`p-3 rounded-2xl border text-left transition ${roomMode === "daily" ? 'bg-[#EAF3EB] border-[#7A9D8C] text-[#4A423B]' : 'bg-[#F3ECE4] border-transparent text-[#8C847D]'}`}
                    >
                      <div className="font-bold text-xs mb-0.5">☕ 日常夾錢模式</div>
                      <div className="text-[10px] opacity-80">港幣記帳 · 飯局/夾租</div>
                    </button>
                    <button
                      type="button"
                      onClick={() => handleToggleMode("travel")}
                      className={`p-3 rounded-2xl border text-left transition ${roomMode === "travel" ? 'bg-[#EAF3EB] border-[#7A9D8C] text-[#4A423B]' : 'bg-[#F3ECE4] border-transparent text-[#8C847D]'}`}
                    >
                      <div className="font-bold text-xs mb-0.5 flex items-center justify-between">
                        <span>✈️ 旅遊專案模式</span>
                        {!isPro && <span>🔒</span>}
                      </div>
                      <div className="text-[10px] opacity-80">多國貨幣 · 即時自動匯率</div>
                    </button>
                  </div>
                </div>

                <div className="bg-[#FCFAF6] p-5 rounded-3xl soft-shadow border border-[#EBE3DB] space-y-3">
                  <h3 className="font-bold text-[#5C544D] text-sm">當前項目名稱</h3>
                  <input type="text" value={groupName} onChange={e => setGroupName(e.target.value)} onBlur={handleGroupNameBlur} className="w-full text-sm bg-[#F3ECE4] rounded-2xl px-4 py-3 font-bold text-[#5C544D] focus:outline-none focus:ring-2 focus:ring-[#7A9D8C]" />
                </div>

                <div className="bg-[#FCFAF6] p-5 rounded-3xl soft-shadow border border-[#EBE3DB] space-y-4">
                  <div className="flex justify-between items-center border-b border-[#EBE3DB] pb-3">
                    <h3 className="font-bold text-[#5C544D] text-sm">參與成員 ({members.length}人)</h3>
                    {!isPro && <span className="text-[10px] text-[#A09990]">免費版上限 4 人</span>}
                  </div>
                  <div className="flex gap-2">
                    <input type="text" placeholder="新增成員名字" value={newMemberName} onChange={e => setNewMemberName(e.target.value)} className="flex-1 text-sm bg-[#F3ECE4] rounded-2xl px-4 py-3 text-[#5C544D] focus:outline-none focus:ring-2 focus:ring-[#7A9D8C]" />
                    <button onClick={handleAddMember} className="bg-[#E5AB99] text-white text-xs font-bold px-5 rounded-2xl hover:bg-[#D49A88] transition">新增</button>
                  </div>
                  <div className="flex flex-wrap gap-2 pt-2">
                    {members.map(m => (
                      <span key={m} className="bg-[#F3ECE4] text-[#5C544D] text-xs px-3 py-1.5 rounded-xl font-medium flex items-center gap-2">
                        {m}
                        {members.length > 2 && <button onClick={() => handleRemoveMember(m)} className="text-[#A09990] hover:text-[#DF9A84] font-bold text-sm leading-none">×</button>}
                      </span>
                    ))}
                  </div>
                </div>

                {/* 多幣種匯率設定（Pro 專屬） */}
                {isPro && (
                  <div className="bg-[#FCFAF6] p-5 rounded-3xl soft-shadow border border-[#EBE3DB] space-y-4">
                    <div className="flex justify-between items-center border-b border-[#EBE3DB] pb-3">
                      <h3 className="font-bold text-[#5C544D] text-sm">💱 旅遊自訂匯率 (兌 HKD)</h3>
                    </div>
                    <form onSubmit={handleAddCustomCurrency} className="flex gap-2 bg-[#F3ECE4] p-2 rounded-2xl">
                      <input type="text" maxLength="3" placeholder="代號 (如 NZD)" value={newCurCode} onChange={e => setNewCurCode(e.target.value.toUpperCase())} className="w-20 text-xs bg-[#FCFAF6] rounded-xl px-2 py-2 font-mono uppercase text-center focus:outline-none" />
                      <input type="number" step="any" placeholder="兌港幣匯率" value={newCurRate} onChange={e => setNewCurRate(e.target.value)} className="flex-1 text-xs bg-[#FCFAF6] rounded-xl px-3 py-2 focus:outline-none" />
                      <button type="submit" className="bg-[#7A9D8C] text-white text-xs font-bold px-3 rounded-xl shadow-sm">＋加入</button>
                    </form>
                    <div className="grid grid-cols-2 gap-3 pt-2">
                      {Object.keys(rates).map(cur => (
                        <div key={cur} className="flex justify-between items-center p-2.5 bg-[#F3ECE4] rounded-2xl">
                          <span className="font-bold text-[#8C847D] text-xs pl-1">{cur}</span>
                          <input type="number" step="0.0001" value={rates[cur]} onChange={e => handleRateChange(cur, e.target.value)} className="w-20 text-right bg-[#FCFAF6] rounded-lg px-2 py-1 font-mono font-bold text-xs text-[#5C544D] focus:outline-none focus:ring-1 focus:ring-[#7A9D8C]" />
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* 付費牆 / 升級 BillMate Pro 彈窗 (Paywall Modal) */}
          {showPaywall && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#FCFAF6] max-w-sm w-full rounded-[2rem] p-6 shadow-2xl border border-[#EBE3DB] space-y-4 animate-fade-in">
                <div className="flex justify-between items-start">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">👑</span>
                    <div>
                      <h2 className="font-black text-lg text-[#4A423B]">升級 BillMate Pro</h2>
                      <p className="text-[11px] text-[#8C847D]">解鎖完整旅遊專案與無限項目額度</p>
                    </div>
                  </div>
                  <button onClick={() => setShowPaywall(false)} className="text-[#A09990] hover:text-[#4A423B] text-xl font-bold leading-none">×</button>
                </div>

                <div className="bg-[#FFF5F2] border border-[#F3D5CC] p-3 rounded-2xl text-xs text-[#7D5A50]">
                  {paywallMsg}
                </div>

                {/* 功能對比清單 */}
                <div className="space-y-2 text-xs text-[#5C544D] bg-[#F3ECE4] p-3.5 rounded-2xl">
                  <div className="flex items-center gap-2"><span>✅</span> <strong>無限個項目房間</strong>（打破免費版 2 個限制）</div>
                  <div className="flex items-center gap-2"><span>✅</span> <strong>旅遊多幣種混合記帳</strong> + 即時自動匯率</div>
                  <div className="flex items-center gap-2"><span>✅</span> <strong>無上限夾錢人數</strong>（打破免費版 4 人限制）</div>
                  <div className="flex items-center gap-2"><span>✅</span> <strong>鎖定找換店唱錢匯率</strong>，計數零誤差</div>
                </div>

                {/* 模擬收費方案按鈕 */}
                <div className="grid grid-cols-2 gap-2.5 pt-1">
                  <button
                    type="button"
                    onClick={() => handleSimulatePurchase("單次旅遊通行證 HK$28")}
                    className="p-3 rounded-2xl border-2 border-[#7A9D8C] bg-white text-left hover:bg-[#EAF3EB] transition"
                  >
                    <div className="text-[10px] font-bold text-[#7A9D8C]">單次買斷</div>
                    <div className="text-base font-black text-[#4A423B]">HK$ 28</div>
                    <div className="text-[10px] text-[#8C847D]">適合單次長途旅行</div>
                  </button>
                  <button
                    type="button"
                    onClick={() => handleSimulatePurchase("Pro 月費計劃 HK$18/月")}
                    className="p-3 rounded-2xl bg-[#7A9D8C] text-white text-left shadow-md hover:bg-[#688A79] transition relative overflow-hidden"
                  >
                    <div className="text-[10px] font-bold text-amber-200">最受歡迎 🔥</div>
                    <div className="text-base font-black">HK$ 18 <span className="text-xs font-normal">/月</span></div>
                    <div className="text-[10px] text-white/85">無限旅行與日常項目</div>
                  </button>
                </div>

                {/* VIP 解鎖碼輸入（方便測試或 PayMe/FPS 手動派碼） */}
                <form onSubmit={handleUnlockWithCode} className="pt-2 border-t border-[#EBE3DB]">
                  <label className="block text-[10px] text-[#A09990] font-bold mb-1">已有 VIP 解鎖碼？（測試碼：BILLMATE2026）</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      placeholder="輸入解鎖碼"
                      value={vipInput}
                      onChange={e => setVipInput(e.target.value)}
                      className="flex-1 text-xs bg-[#F3ECE4] rounded-xl px-3 py-2 font-mono uppercase focus:outline-none"
                    />
                    <button type="submit" className="bg-[#4A423B] text-white text-xs font-bold px-3.5 py-2 rounded-xl">
                      兌換
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
